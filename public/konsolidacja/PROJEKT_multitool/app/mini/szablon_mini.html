<script>

const SLOWNIK = {}; function slownik(t) { if (SLOWNIK[t]) return SLOWNIK[t]; const c = new Map(); BAZA.forEach(a => POLA.bloki.forEach(g => g.pola.forEach(p => { if (RODZ(p.id) !== t) return; const v = String((a.f || {})[p.id] || '').replace(/\?/g, '').trim(); if (!v || /^\[.*\]$/.test(v) || v.length > 40) return; c.set(v, (c.get(v) || 0) + 1); }))); return SLOWNIK[t] = [...c].map(([v, n]) => ({v, n, k: fold(v)})).sort((x, y) => y.n - x.n); }

function podpowiedzi(t, txt) { const k = fold(txt); if (!k) return []; return slownik(t).filter(x => x.k.startsWith(k) && x.k !== k).slice(0, 7); }
const PARY_MARG = {margin_groom_first_name: 'groom_first_name', margin_groom_last_name: 'groom_last_name', margin_bride_first_name: 'bride_first_name', margin_bride_last_name: 'bride_last_name'};
const PARA = {}; Object.entries(PARY_MARG).forEach(([m, a]) => { PARA[m] = a; PARA[a] = m; });
const POTW = new Set();
const DLUGIE = ['margin_notes', 'groom_death_margin', 'bride_death_margin', 'notes', 'parents_raw'];

/* suma kontrolna jak w Multitoolu (skpHash): pierwsze 16 znaków szesnastkowych SHA-256 zawartości pliku */

  toast('Dodano ' + n + (d ? ', pominięto ' + d + ' (już są – ta sama suma)' : '')); if (przypisz && ost) { const e = edit(przypisz.rok, przypisz.nr, true); e.h = ost; await zapisz('akty', e); } if (!przypisz && ost) cur = ost; rys(); }

/* ---- przeglądarka skanu: przypięta u góry, przeciąganie, szczypanie, +/−, „Akt” (obcięcie do obszaru aktu), „Całość”, ⇕ (wysokość) ---- */
