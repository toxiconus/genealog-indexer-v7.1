<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multitool v1 – akty</title>
<style>
:root{color-scheme:light;--bg:#f6f4ef;--card:#fff;--ink:#22262b;--mut:#687079;--line:#d9d5cb;--acc:#2f5d8a;--accink:#fff;--ok:#2e7d4f;--warn:#a86500;--err:#b3261e;--note-bg:#f9e7c0;--note-ink:#4a3300;--toast-bg:#22262b;--toast-ink:#fff;--skan-bg:#111;--cien:rgba(0,0,0,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#16181b;--card:#1f2226;--ink:#e6e3dc;--mut:#9aa1a9;--line:#353a40;--acc:#7fb0e0;--accink:#0e1a26;--ok:#6cc08b;--warn:#e0a84a;--err:#ef8a80;--note-bg:#3a2f14;--note-ink:#f1dca8;--toast-bg:#e6e3dc;--toast-ink:#16181b;--skan-bg:#0b0c0d;--cien:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#16181b;--card:#1f2226;--ink:#e6e3dc;--mut:#9aa1a9;--line:#353a40;--acc:#7fb0e0;--accink:#0e1a26;--ok:#6cc08b;--warn:#e0a84a;--err:#ef8a80;--note-bg:#3a2f14;--note-ink:#f1dca8;--toast-bg:#e6e3dc;--toast-ink:#16181b;--skan-bg:#0b0c0d;--cien:rgba(0,0,0,.6)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:70;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}h2{font-size:16px;margin:0 0 4px}h3{font-size:15px;margin:0 0 6px}
button,select,input,textarea{font:inherit;color:var(--ink)}button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:var(--accink)}button.d{color:var(--err)}button:disabled{opacity:.5;cursor:default}button.sm{padding:2px 8px;font-size:13px}
input,select,textarea{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);max-width:100%}textarea{width:100%}
.ind{border:0;background:none;color:var(--mut);cursor:pointer;text-decoration:underline dotted}.ind.warn{color:var(--warn);font-weight:600}
#pasekStan{background:var(--err);color:var(--accink);padding:8px 16px;font-weight:600}#przyp{background:var(--note-bg);color:var(--note-ink);padding:6px 16px}
.wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:820px){.wrap{grid-template-columns:1fr}#lista{max-height:38vh}}
.col{min-width:0}#filtry{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#filtry input[type=search]{flex:1 1 140px;min-width:0}
#lista{display:flex;flex-direction:column;gap:3px;overflow:auto;max-height:calc(100vh - 220px)}
.it{text-align:left;display:flex;gap:6px;align-items:baseline;background:linear-gradient(90deg,rgba(47,93,138,.14) var(--p,0%),transparent var(--p,0%)),var(--card)}.it.cur{border-color:var(--acc);outline:2px solid var(--acc)}.it.done{opacity:.65}.it em{margin-left:auto;color:var(--ok);font-style:normal}.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.muted{color:var(--mut);font-size:13px}code{font-size:12px;word-break:break-all}
.bar{height:5px;background:var(--line);border-radius:3px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.warn{border-left:3px solid var(--warn);padding:4px 10px;margin:8px 0;font-size:13px}.err{color:var(--err)}.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.blok{margin:14px 0 4px;font-size:14px;color:var(--mut);border-bottom:1px solid var(--line)}.pola{display:grid;grid-template-columns:1fr;gap:8px}.pole{border:1px solid var(--line);border-radius:8px;padding:8px}.pole.ok{border-color:var(--ok)}.pole.un{border-color:var(--warn)}.pole.df{border-color:var(--err)}
.pole label{display:block;font-size:12px;color:var(--mut)}.pole input{width:100%}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.chip{padding:1px 8px;font-size:12px;border-radius:12px}.bdg{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--mut)}.bdg.ok{color:var(--ok);border-color:var(--ok)}.bdg.un{color:var(--warn);border-color:var(--warn)}
#menu{position:absolute;right:16px;top:100%;z-index:9;max-height:80vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:240px}#menu[hidden]{display:none}
#okno{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;display:flex;align-items:center;justify-content:center;padding:16px}#okno[hidden]{display:none}.okno-in{background:var(--card);border-radius:10px;padding:16px;max-width:760px;width:100%;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--toast-bg);color:var(--toast-ink);padding:8px 14px;border-radius:8px;display:none;z-index:130;max-width:92vw}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;word-break:break-word}
#skView{position:relative;height:min(52vh,420px);overflow:hidden;background:var(--skan-bg);border-radius:8px;touch-action:none;cursor:grab;margin:6px 0}#skView[hidden]{display:none}#skLayer{position:absolute;left:0;top:0;transform-origin:0 0}#skLayer img{display:block;max-width:none;user-select:none}
.skbox{position:absolute;border:solid;pointer-events:none}.skbox.roi{border-color:rgba(245,158,11,.85)}.skbox.pole{border-color:#06b6d4}.skbox.nowy{border-color:#e11d48}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.pick input[type=number]{width:90px}details.skan>summary,details.txt>summary,details.kal>summary{cursor:pointer}
.tpodglad{white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}.mq{background:rgba(224,168,74,.35)}.mr{background:rgba(239,138,128,.35)}.mg{background:rgba(127,176,224,.3)}.sugw{margin:4px 0}

:root{--skw:clamp(480px,42vw,640px)}
#skWin{position:fixed;top:64px;right:12px;bottom:12px;width:min(44vw,720px);min-width:300px;min-height:160px;display:flex;flex-direction:column;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px var(--cien);z-index:50;resize:both;overflow:hidden}
#skWin[hidden]{display:none}
body.hdr-ukryty #skWin{top:12px}
.skwin-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;cursor:move;background:var(--bg);color:var(--ink);border-bottom:1px solid var(--line);border-radius:9px 9px 0 0;user-select:none;touch-action:none;flex-wrap:wrap}
.skwin-btn{display:flex;gap:4px;flex-wrap:wrap}
.skwin-cialo{display:flex;flex-direction:column;gap:6px;padding:6px 8px;flex:1;min-height:0;overflow:auto}
#skWin #skView{flex:1 1 auto;height:auto;min-height:240px}
/* układ na komputerze: lista aktów po lewej (można ukryć), skan obok niej na całą wysokość, pola po prawej */
:root{--lw:300px}
body.sk-dok .wrap{display:block;margin-left:calc(var(--lw) + var(--skw));max-width:none;padding:12px 16px}
body.sk-dok .wrap>.col:first-child{position:fixed;left:0;top:var(--tt,0px);bottom:0;width:var(--lw);overflow:auto;z-index:40;background:var(--card);padding:8px;border-right:1px solid var(--line)}
body.sk-dok #skWin{z-index:40;left:var(--lw);top:var(--tt,0px);bottom:0;width:var(--skw);border-radius:0;box-shadow:none;border-width:0 1px 0 0;border-color:var(--line);resize:none}
body.sk-dok.lista-ukryta .wrap>.col:first-child{display:none}
body.sk-dok.lista-ukryta #skWin{left:0;width:calc(var(--skw) + var(--lw))}
body.sk-dok.lista-ukryta .wrap{margin-left:calc(var(--skw) + var(--lw))}
.listaTog{position:fixed;top:calc(var(--tt,0px) + 45vh);left:calc(var(--lw) - 14px);z-index:60;width:28px;height:48px;padding:0;border-radius:0 8px 8px 0;display:none;font-size:14px;line-height:1}
body.sk-dok .listaTog{display:block}
body.sk-dok.lista-ukryta .listaTog{left:0}
@media (max-width:820px){.listaTog{display:none!important}}
.skPok{position:fixed;right:12px;bottom:12px;z-index:60;display:block}
.skPok[hidden]{display:none}
.hdrPok{position:fixed;top:0;left:0;z-index:60;display:none}
body.hdr-ukryty header{display:none}
body.hdr-ukryty .hdrPok{display:block}
@media (max-width:820px){#skWin,body.sk-dok #skWin,body.sk-dok.lista-ukryta #skWin{position:sticky;left:auto;right:auto;top:0;bottom:auto;width:auto;min-width:0;height:44vh;margin:0;border-width:0 0 1px 0;border-radius:0;border-color:var(--line);box-shadow:none;resize:none;z-index:40}#skWin.bezobrazu,body.sk-dok #skWin.bezobrazu{height:auto;position:static}#skWin.bezobrazu .skwin-cialo{flex:none}#skWin #skView{min-height:120px}body.sk-dok .wrap,body.sk-dok.lista-ukryta .wrap{display:grid;margin-left:0;padding:12px 16px}body.sk-dok .wrap>.col:first-child{position:static;width:auto;border-right:0;padding:0;background:none}.skwin-head{cursor:default;border-radius:0}#skDok,#skHdr{display:none}}

/* ===== powłoka v2: zakładki, pasek akcji aktu, mini-pola, narzędzia, raport, drzewo ===== */
#zakl{display:flex;gap:4px;flex-wrap:wrap}#zakl button{border-radius:6px}
#doSpr{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--mut)}#doSpr i{display:inline-block;width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}#doSpr i b{display:block;height:100%;background:var(--ok)}
body:not([data-zakl="akty"]) #doSpr{display:none}
body[data-zakl="narz"] .wrap,body[data-zakl="raport"] .wrap{grid-template-columns:1fr;max-width:1200px}
body[data-zakl="narz"] .wrap>.col:first-child,body[data-zakl="raport"] .wrap>.col:first-child{display:none}
body[data-zakl="drzewo"] .wrap{max-width:none}
.aktbar{position:sticky;bottom:0;z-index:6;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--card);border-top:1px solid var(--line);margin:12px -14px -14px;padding:8px 14px;border-radius:0 0 10px 10px;box-shadow:0 -6px 12px -10px var(--cien)}
.aktbar .sp{flex:1}
.widok{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.widok button.on{border-color:var(--acc);color:var(--acc);font-weight:600}
.pole.mini{display:flex;gap:8px;align-items:baseline;padding:4px 8px}.pole.mini span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.pole.mini strong{font-weight:600}
.pole.fok{outline:2px solid var(--acc)}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:12px ui-monospace,monospace;background:var(--bg)}
.kafle{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}.kafle .card h3{margin-bottom:8px}.kafle .card .acts{margin:6px 0 0;flex-direction:column;align-items:stretch}.kafle .card .acts button{text-align:left}
.skr{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;align-items:baseline}
.rtab{overflow:auto;max-height:60vh;border:1px solid var(--line);border-radius:8px}.rtab table td,.rtab table th{white-space:nowrap}.rtab table td.w,.rtab table th.w{white-space:normal;min-width:120px}
.rnav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.rnav button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
a.lk,button.lk{border:0;background:none;padding:0;color:var(--acc);text-decoration:underline;cursor:pointer;font:inherit}
/* drzewo */
.drz{display:flex;align-items:center;gap:0;overflow:auto;padding:8px 0}.drz .gal{display:flex;flex-direction:column;justify-content:center;gap:6px;position:relative;padding-left:18px;margin-left:0}
.drz .wezel{display:flex;align-items:center}.os{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:5px 9px;min-width:150px;max-width:230px;font-size:13px;cursor:pointer;text-align:left}
.os:hover{border-color:var(--acc)}.os.m{border-left:4px solid var(--acc)}.os.k{border-left:4px solid var(--warn)}.os.cur{outline:2px solid var(--acc)}.os.moz{border-style:dashed}.os small{display:block;color:var(--mut)}
.drz .gal>.wezel{position:relative}.drz .gal>.wezel::before{content:"";position:absolute;left:-18px;top:50%;width:18px;border-top:1px solid var(--mut)}
.drz .gal::before{content:"";position:absolute;left:0;top:25%;bottom:25%;border-left:1px solid var(--mut)}.drz .gal.jeden::before{display:none}
ul.pot{list-style:none;margin:0;padding-left:18px;border-left:1px solid var(--line)}ul.pot>li{margin:4px 0}ul.pot.korzen{border-left:0;padding-left:0}
.fakty{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px 14px;font-size:13px}
@media (max-width:820px){header{padding:8px 16px;gap:6px}h1{width:100%;font-size:15px}#zakl{width:100%;overflow-x:auto;flex-wrap:nowrap}.wrap{padding:12px 16px;gap:12px}.aktbar{margin:12px -14px -14px}.rtab{max-height:none}.drz .os{min-width:120px}}
</style></head><body>
<script>try{var m=localStorage.getItem('mt.motyw');if(m==='light'||m==='dark')document.documentElement.setAttribute('data-theme',m);}catch(e){}</script>
<header><h1 id="tytul">Multitool v1 · akt zgonu</h1><nav id="zakl" aria-label="Moduły"><button id="zAkty" class="p" title="Alt+1">Akty</button><button id="zOsoby" title="Alt+2">Osoby</button><button id="zDrzewo" title="Alt+3">Drzewo</button><button id="zRaport" title="Alt+4">Raport</button><button id="zNarz" title="Alt+5">Narzędzia</button></nav> <select id="selTyp" aria-label="Typ aktu" title="Typ aktu"></select><span class="muted" id="prog"></span><span id="doSpr" title="Akty z odczytem, jeszcze niezatwierdzone"></span><button class="ind" id="kopiaInd" title="Zrób kopię pełną">decyzji i zmian bez kopii: 0</button><span style="flex:1"></span><button id="bMenu">Menu ▾</button>
<div id="menu" hidden><button id="mCsv">Eksport CSV (zgony)</button><button id="mKopia">Kopia pełna (JSON)</button><button id="mKopiaWczytaj">Wczytaj kopię (JSON)…</button><button id="mImpDop">Import CSV zatwierdzeń (dopisz)…</button><button id="mImpZast">Import CSV zatwierdzeń (zastąp)…</button><button id="mMigawki">Migawki / przywróć…</button><button id="mKolejka">Dane źródłowe się zmieniły (0)</button><button id="mMigr">Migracja zgonów z CSV…</button><button id="mAuto">Autozapis do pliku…</button><button id="mDecJson" class="osMenu">Decyzje o osobach: eksport JSON</button><button id="mDecCsv" class="osMenu">Decyzje o osobach: eksport CSV</button><button id="mDecImp" class="osMenu">Decyzje o osobach: import JSON…</button><button id="mDop" class="osMenu">Import decyzji dop.v1…</button></div></header>
<div id="pasekStan" hidden></div><div id="przyp" hidden></div>
<div class="wrap"><div class="col"><div id="filtry"></div><div id="lista"></div></div><div class="col" id="main"></div></div>
<input type="file" id="fKopia" accept=".json,application/json" hidden><input type="file" id="fCsv" accept=".csv,text/csv" hidden><input type="file" id="fMigr" accept=".csv,text/csv" multiple hidden><input type="file" id="fDec" accept=".json,application/json" hidden><input type="file" id="fDop" accept=".json,application/json" hidden>
<div id="okno" hidden></div><div id="toast"></div>

<script>
/*MODULE:tekst*/
/*MODULE:plik*/

/*MODUL:raport_zgonow*/
/*MODULE:norm*/

let GOTOWE = false;
const DANE = /*DATA*/;
const DANE_TYPY = /*DATA_TYPY*/;   // krok 5: małżeństwa i chrzty (dane_malzenstwa.json, dane_chrzty.json)
const D = daneNaD(DANE, DANE_TYPY), AM = {}; D.wszystkie.forEach(a => AM[a.id] = a);
const FIELDS = D.fields.filter(f => f.id !== 'death_time');
let S = stPusty();
const save = () => { const n0 = S.histN || 0; histCommit(); if (typeof cofPoZapisie === 'function') cofPoZapisie(n0); stZapisz(); if (typeof stWskaznik === 'function') stWskaznik(); };
/*MODUL:akt_zgon*/

/*MODUL:ui_powloka*/
(async () => {
  S = await stWczytaj(); noweWlacz(S.nowe); normActs(); startMigracja(); startZatwierdzone(); stKolejka();
  HS = histSnap(S.acts); await stFlush(false);   // stan początkowy (migracja, zatwierdzone z danych) nie liczy się do „zmian bez kopii”
  typInit(); menuInit(); skanInit(); nawInit(); odswiez(); GOTOWE = true;
})().catch(e => { document.body.insertAdjacentText('afterbegin', 'Błąd startu: ' + e.message); });
