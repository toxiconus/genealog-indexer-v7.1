<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multitool v1 – akty</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22262b;--mut:#687079;--line:#d9d5cb;--acc:#2f5d8a;--ok:#2e7d4f;--warn:#a86500;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e6e3dc;--mut:#9aa1a9;--line:#353a40;--acc:#7fb0e0;--ok:#6cc08b;--warn:#e0a84a;--err:#ef8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}h2{font-size:16px;margin:0 0 4px}h3{font-size:15px;margin:0 0 6px}
button,select,input,textarea{font:inherit;color:var(--ink)}button{padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--err)}button:disabled{opacity:.5;cursor:default}button.sm{padding:2px 8px;font-size:13px}
input,select,textarea{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);max-width:100%}textarea{width:100%}
.ind{border:0;background:none;color:var(--mut);cursor:pointer;text-decoration:underline dotted}.ind.warn{color:var(--warn);font-weight:600}
#pasekStan{background:var(--err);color:#fff;padding:8px 16px;font-weight:600}#przyp{background:#f9e7c0;color:#4a3300;padding:6px 16px}
.wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:820px){.wrap{grid-template-columns:1fr}#lista{max-height:38vh}}
.col{min-width:0}#filtry{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}#filtry input[type=search]{flex:1 1 140px;min-width:0}
#lista{display:flex;flex-direction:column;gap:3px;overflow:auto;max-height:calc(100vh - 220px)}
.it{text-align:left;display:flex;gap:6px;align-items:baseline;background:linear-gradient(90deg,rgba(47,93,138,.14) var(--p,0%),transparent var(--p,0%)),var(--card)}.it.cur{border-color:var(--acc);outline:2px solid var(--acc)}.it.done{opacity:.65}.it em{margin-left:auto;color:var(--ok);font-style:normal}.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}.muted{color:var(--mut);font-size:13px}code{font-size:12px;word-break:break-all}
.bar{height:5px;background:var(--line);border-radius:3px;margin:6px 0}.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.warn{border-left:3px solid var(--warn);padding:4px 10px;margin:8px 0;font-size:13px}.err{color:var(--err)}.acts{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.blok{margin:14px 0 4px;font-size:14px;color:var(--mut);border-bottom:1px solid var(--line)}.pola{display:grid;grid-template-columns:1fr;gap:8px}.pole{border:1px solid var(--line);border-radius:8px;padding:8px}.pole.ok{border-color:var(--ok)}.pole.un{border-color:var(--warn)}.pole.df{border-color:var(--err)}
.pole label{display:block;font-size:12px;color:var(--mut)}.pole input{width:100%}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;align-items:center}
.chip{padding:1px 8px;font-size:12px;border-radius:12px}.bdg{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--mut)}.bdg.ok{color:var(--ok);border-color:var(--ok)}.bdg.un{color:var(--warn);border-color:var(--warn)}
#menu{position:absolute;right:16px;top:44px;z-index:9;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:240px}#menu[hidden]{display:none}
#okno{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}#okno[hidden]{display:none}.okno-in{background:var(--card);border-radius:10px;padding:16px;max-width:760px;width:100%;max-height:85vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:30;max-width:92vw}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:3px 6px;text-align:left;word-break:break-word}
#skView{position:relative;height:min(52vh,420px);overflow:hidden;background:#111;border-radius:8px;touch-action:none;cursor:grab;margin:6px 0}#skView[hidden]{display:none}#skLayer{position:absolute;left:0;top:0;transform-origin:0 0}#skLayer img{display:block;max-width:none;user-select:none}
.skbox{position:absolute;border:solid;pointer-events:none}.skbox.roi{border-color:rgba(245,158,11,.85)}.skbox.pole{border-color:#06b6d4}.skbox.nowy{border-color:#e11d48}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}.pick input[type=number]{width:90px}details.skan>summary,details.txt>summary,details.kal>summary{cursor:pointer}
.tpodglad{white-space:pre-wrap;border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}.mq{background:rgba(224,168,74,.35)}.mr{background:rgba(239,138,128,.35)}.mg{background:rgba(127,176,224,.3)}.sugw{margin:4px 0}

:root{--skw:clamp(480px,42vw,640px)}
#skWin{position:fixed;top:64px;right:12px;bottom:12px;width:min(44vw,720px);min-width:300px;min-height:160px;display:flex;flex-direction:column;background:Canvas;color:CanvasText;border:1px solid #94a3b8;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:50;resize:both;overflow:hidden}
#skWin[hidden]{display:none}
body.hdr-ukryty #skWin{top:12px}
.skwin-head{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 8px;cursor:move;background:#e2e8f0;color:#0f172a;border-radius:9px 9px 0 0;user-select:none;touch-action:none;flex-wrap:wrap}
.skwin-btn{display:flex;gap:4px;flex-wrap:wrap}
.skwin-cialo{display:flex;flex-direction:column;gap:6px;padding:6px 8px;flex:1;min-height:0;overflow:auto}
#skWin #skView{flex:1 1 auto;height:auto;min-height:240px}
/* układ na komputerze: skan po lewej na całą wysokość, lista aktów (można ukryć) i pola po prawej */
body.sk-dok #skWin{left:0;right:auto;top:var(--tt,0px);bottom:0;width:var(--skw);border-radius:0;box-shadow:none;border-width:0 1px 0 0;resize:none}
body.sk-dok .wrap{margin-left:var(--skw);max-width:none;padding-right:16px}
body.sk-dok.lista-ukryta .wrap>.col:first-child{display:none}
body.sk-dok.lista-ukryta .wrap{grid-template-columns:1fr}
.skPok{position:fixed;right:12px;bottom:12px;z-index:60;display:block}
.skPok[hidden]{display:none}
.hdrPok{position:fixed;top:0;left:0;z-index:60;display:none}
body.hdr-ukryty header{display:none}
body.hdr-ukryty .hdrPok{display:block}
@media (max-width:820px){body.sk-dok #skWin{left:8px;right:8px;top:auto;bottom:8px;width:auto;height:55vh;border-width:1px;border-radius:10px}body.sk-dok .wrap{margin-left:0;padding-right:16px}}
</style></head><body>
<header><h1 id="tytul">Multitool v1 · akt zgonu</h1><span id="zakl"><button id="zAkty" class="p">Akty</button> <button id="zOsoby">Osoby</button></span> <select id="selTyp" aria-label="Typ aktu" title="Typ aktu"></select><span class="muted" id="prog"></span><button class="ind" id="kopiaInd" title="Zrób kopię pełną">decyzji i zmian bez kopii: 0</button><span style="flex:1"></span><button id="bMenu">Menu ▾</button>
<div id="menu" hidden><button id="mCsv">Eksport CSV (zgony)</button><button id="mKopia">Kopia pełna (JSON)</button><button id="mKopiaWczytaj">Wczytaj kopię (JSON)…</button><button id="mImpDop">Import CSV zatwierdzeń (dopisz)…</button><button id="mImpZast">Import CSV zatwierdzeń (zastąp)…</button><button id="mMigawki">Migawki / przywróć…</button><button id="mKolejka">Dane źródłowe się zmieniły (0)</button><button id="mMigr">Migracja zgonów z CSV…</button><button id="mAuto">Autozapis do pliku…</button><button id="mDecJson" class="osMenu">Decyzje o osobach: eksport JSON</button><button id="mDecCsv" class="osMenu">Decyzje o osobach: eksport CSV</button><button id="mDecImp" class="osMenu">Decyzje o osobach: import JSON…</button><button id="mDop" class="osMenu">Import decyzji dop.v1…</button></div></header>
<div id="pasekStan" hidden></div><div id="przyp" hidden></div>
<div class="wrap"><div class="col"><div id="filtry"></div><div id="lista"></div></div><div class="col" id="main"></div></div>
<input type="file" id="fKopia" accept=".json,application/json" hidden><input type="file" id="fCsv" accept=".csv,text/csv" hidden><input type="file" id="fMigr" accept=".csv,text/csv" multiple hidden><input type="file" id="fDec" accept=".json,application/json" hidden><input type="file" id="fDop" accept=".json,application/json" hidden>
<div id="okno" hidden></div><div id="toast"></div>
