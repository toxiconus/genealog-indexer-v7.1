button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}button.sm{min-height:34px;padding:4px 9px;font-size:14px}
main{padding:10px;max-width:760px;margin:0 auto}
.muted{color:var(--mut);font-size:14px}
