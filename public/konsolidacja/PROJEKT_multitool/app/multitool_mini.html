dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:560px;width:94vw}dialog input,dialog select{width:100%;padding:9px;margin:2px 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}

     navigator.canShare && navigator.canShare({files: [f]}) ? el('button', {onclick: async () => { try { await navigator.share({files: [f], title: nazwa}); zamknij(); } catch (e) {} }}, 'Udostępnij…') : '', el('button', {onclick: zamknij}, 'Zamknij')]);
}
async function importuj(plik) {
  let p; try { p = JSON.parse(await plik.text()); } catch (e) { return toast('To nie jest plik JSON'); } if (!p || !p.format || p.format.nazwa !== 'multitool-mini' || !Array.isArray(p.akty)) return toast('To nie jest paczka Multitool mini');
  let n = 0, k = 0; for (const x of p.akty) { if (!POLA[x.typ] || !x.h || !/^\d{1,4}[a-z]?$/i.test(String(x.nr))) continue; const id = aktId(x.typ, x.rok, x.nr), a = MEM.akty[id] || {id, typ: x.typ, rok: +x.rok, nr: String(x.nr), h: x.h, f: {}, utw: Date.now()}; if (MEM.akty[id]) k++; else n++;
    for (const [f, v] of Object.entries(x.pola || {})) if (!a.f[f] || !a.f[f].v) a.f[f] = {v: String(v.v), u: !!v.u}; MEM.akty[id] = a; await zapisz('akty', a); }
  toast('Zaimportowano: nowych ' + n + ', uzupełnionych ' + k + '. Obrazy dodaj przyciskiem „＋ Zdjęcia” (bez obrazów skan pokaże się po dodaniu pliku).'); rys();
}
function menu() { dlg('Menu', [], [el('button', {onclick: () => { zamknij(); eksport(); }}, 'Eksport paczki dla Multitoola'), el('button', {onclick: () => { zamknij(); $('fImp').click(); }}, 'Import paczki (np. z drugiego telefonu)'),
  el('button', {onclick: async () => { if (!cur || !confirm('Usunąć ten skan (obraz) z telefonu? Akty tego skanu zostają w paczce.')) return; delete MEM.skany[cur]; await usun('skany', cur); cur = null; zamknij(); rys(); }}, 'Usuń obraz bieżącego skanu'), el('button', {onclick: zamknij}, 'Zamknij')]); }
/* ---- start ---- */
$('bFoto').onclick = () => $('fFoto').click(); $('fFoto').onchange = e => { const L = [...e.target.files]; e.target.value = ''; if (L.length) dodajZdjecia(L); };
$('fImp').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importuj(f); }; $('bMenu').onclick = menu; $('kAkt').onclick = () => dlgAkt(null);
$('kPrev').onclick = () => { const P = porzadek(), i = P.findIndex(s => s.h === cur); if (i > 0) { cur = P[i - 1].h; curAkt = null; rys(); } }; $('kNext').onclick = () => { const P = porzadek(), i = P.findIndex(s => s.h === cur); if (i >= 0 && P[i + 1]) { cur = P[i + 1].h; curAkt = null; rys(); } };
(async () => { try { DB = await idb(); (await wszystko('skany')).forEach(s => MEM.skany[s.h] = s); (await wszystko('akty')).forEach(a => MEM.akty[a.id] = a); if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { toast('Brak pamięci przeglądarki – dane nie zapiszą się po zamknięciu'); DB = null; } rys(); })();
