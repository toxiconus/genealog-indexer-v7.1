*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;-webkit-text-size-adjust:100%}
#gora{position:sticky;top:0;z-index:6}header{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:6px;align-items:center}
header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:42px}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}button.sm{min-height:34px;padding:4px 9px;font-size:14px}
main{padding:10px;max-width:760px;margin:0 auto}
.muted{color:var(--mut);font-size:14px}
#pas{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
#pas .m{flex:0 0 auto;width:64px;height:84px;border:2px solid var(--line);border-radius:8px;padding:0;background:var(--bg) center/cover no-repeat;position:relative;overflow:hidden}

.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pole{margin:8px 0}.pole label{display:block;font-size:13px;color:var(--mut)}.pole .w{display:flex;gap:4px}.pole input{flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.pole.u input{background:var(--unc);border-color:var(--uncl)}.pole .q{min-height:40px;padding:0 10px}.pole.u .q{background:var(--uncl);color:var(--bg)}
details{margin:6px 0}summary{padding:8px 4px;font-weight:600}
.akt{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.akt button.cur{background:var(--acc);color:var(--bg)}.akt button.ok{border-color:var(--ok)}
.kl{position:sticky;bottom:0;display:flex;gap:6px;background:var(--card);border-top:1px solid var(--line);padding:6px;justify-content:center}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;display:none;z-index:9}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:560px;width:94vw}dialog input,dialog select{width:100%;padding:9px;margin:2px 0 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
[hidden]{display:none!important}nav{display:flex;background:var(--card);border-bottom:1px solid var(--line)}nav button{flex:1;border:0;border-radius:0;border-bottom:3px solid transparent;min-height:42px}nav button[aria-selected=true]{border-bottom-color:var(--acc);font-weight:600}
.li{display:block;width:100%;text-align:left;margin:4px 0;padding:8px 10px}.li small{color:var(--mut);display:block}.li .ai{color:var(--uncl);font-size:12px}
.pole.z label{font-weight:700;color:var(--ink)}pre.t{white-space:pre-wrap;font:13px/1.35 ui-monospace,monospace;background:var(--bg);padding:8px;border-radius:8px}
#szuk{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
@media(min-width:900px){main{max-width:1280px}.dwa{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}.dwa .pg{height:calc(100vh - var(--gh,96px) - 16px)}}
