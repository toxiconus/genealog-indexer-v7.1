<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multitool – prototyp rdzenia (osoby i propozycje scaleń)</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22262b;--mut:#687079;--line:#d9d5cb;--acc:#2f5d8a;--ok:#2e7d4f;--warn:#a86500;--err:#b3261e;--hint:#5b6bb0}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e6e3dc;--mut:#9aa1a9;--line:#353a40;--acc:#7fb0e0;--ok:#6cc08b;--warn:#e0a84a;--err:#ef8a80;--hint:#9aa6e6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}h2{font-size:15px;margin:16px 0 6px}h3{font-size:14px;margin:0 0 4px}
button{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--err)}button:disabled{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:820px){.wrap{grid-template-columns:1fr}#lista{max-height:38vh}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
#q{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#lista{overflow:auto;max-height:calc(100vh - 190px);margin-top:8px}
.it{padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}.it:hover{border-color:var(--line)}.it.on{background:var(--bg);border-color:var(--acc)}
.it small,.mut{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{font-size:13px;padding:3px 8px}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.b{display:inline-block;font-size:12px;padding:0 6px;border-radius:9px;border:1px solid currentColor;margin-left:4px;white-space:nowrap}
.b.sprawdz{color:var(--ok)}.b.mozliwe{color:var(--acc)}.b.malo{color:var(--mut)}.b.konflikt{color:var(--err)}.b.os{color:var(--hint)}
.b.ai{color:var(--warn)}.b.lub{color:var(--mut)}.b.ok{color:var(--ok)}.b.unc{color:var(--err)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;white-space:nowrap}
.prop{border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:6px;padding:10px;margin:8px 0}
.prop.sprawdz{border-left-color:var(--ok)}.prop.mozliwe{border-left-color:var(--acc)}.prop.konflikt{border-left-color:var(--err)}
.prop ul{margin:2px 0 6px;padding-left:18px}.prop li{margin:1px 0}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.zg{color:var(--ok)}.rb{color:var(--warn)}.sp{color:var(--err)}.br{color:var(--mut)}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#stan{margin-left:auto;font-size:13px;color:var(--mut)}#stan.zle{color:var(--err)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90vw}
details summary{cursor:pointer;color:var(--acc)}
</style></head><body>

function lev(a, b, max){ a = String(a); b = String(b); const m = a.length, n = b.length; if (max !== undefined && Math.abs(m-n) > max) return max + 1; if (!m) return n; if (!n) return m;

/* moduly/db.js – trwały stan roboczy w IndexedDB (z awaryjnym trybem „tylko pamięć”). Jedna baza na aplikację, wersjonowana; nazwa bazy NIE zależy od wersji danych.
