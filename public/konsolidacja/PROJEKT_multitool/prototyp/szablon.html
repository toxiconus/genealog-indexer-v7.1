<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multitool – prototyp rdzenia (osoby i propozycje scaleń)</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#22262b;--mut:#687079;--line:#d9d5cb;--acc:#2f5d8a;--ok:#2e7d4f;--warn:#a86500;--err:#b3261e;--hint:#5b6bb0}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e6e3dc;--mut:#9aa1a9;--line:#353a40;--acc:#7fb0e0;--ok:#6cc08b;--warn:#e0a84a;--err:#ef8a80;--hint:#9aa6e6}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}h2{font-size:15px;margin:16px 0 6px}h3{font-size:14px;margin:0 0 4px}
button{font:inherit;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}button:hover{border-color:var(--acc)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button.d{color:var(--err)}button:disabled{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;padding:16px;max-width:1300px;margin:0 auto}
@media (max-width:820px){.wrap{grid-template-columns:1fr}#lista{max-height:38vh}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px}
#q{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
#lista{overflow:auto;max-height:calc(100vh - 190px);margin-top:8px}
.it{padding:6px 8px;border-radius:6px;cursor:pointer;border:1px solid transparent}.it:hover{border-color:var(--line)}.it.on{background:var(--bg);border-color:var(--acc)}
.it small,.mut{color:var(--mut);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips button{font-size:13px;padding:3px 8px}.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.b{display:inline-block;font-size:12px;padding:0 6px;border-radius:9px;border:1px solid currentColor;margin-left:4px;white-space:nowrap}
.b.sprawdz{color:var(--ok)}.b.mozliwe{color:var(--acc)}.b.malo{color:var(--mut)}.b.konflikt{color:var(--err)}.b.os{color:var(--hint)}
.b.ai{color:var(--warn)}.b.lub{color:var(--mut)}.b.ok{color:var(--ok)}.b.unc{color:var(--err)}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500;white-space:nowrap}
.prop{border:1px solid var(--line);border-left:4px solid var(--mut);border-radius:6px;padding:10px;margin:8px 0}
.prop.sprawdz{border-left-color:var(--ok)}.prop.mozliwe{border-left-color:var(--acc)}.prop.konflikt{border-left-color:var(--err)}
.prop ul{margin:2px 0 6px;padding-left:18px}.prop li{margin:1px 0}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.zg{color:var(--ok)}.rb{color:var(--warn)}.sp{color:var(--err)}.br{color:var(--mut)}
.act{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#stan{margin-left:auto;font-size:13px;color:var(--mut)}#stan.zle{color:var(--err)}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:9;max-width:90vw}
details summary{cursor:pointer;color:var(--acc)}
</style></head><body>
<header><h1>Multitool · prototyp rdzenia</h1><span class="mut" id="licz"></span>
<button id="bExp">Kopia decyzji (JSON)</button><button id="bCsv">Decyzje CSV</button><button id="bImp">Wczytaj kopię</button><input type="file" id="fImp" accept=".json,application/json" hidden>
<span id="stan"></span></header>
<div class="wrap">
<div class="card"><input id="q" placeholder="Szukaj: nazwisko, imię, rok, rola…" aria-label="Szukaj">
<div class="chips" id="flt"></div><div id="lista"></div></div>
<div id="main"><div class="card mut">Wybierz osobę z listy. Aplikacja tylko proponuje połączenia; każde scalenie zatwierdzasz sam i możesz je cofnąć.</div></div>
</div><div id="toast"></div>
<script>
"use strict";
const DANE = /*DATA*/;
/*MODULE:tekst*/
/*MODULE:plik*/
/*MODULE:raport*/
/*MODUL:norm*/
/*MODUL:identity*/
/*MODUL:wystapienia*/
/*MODUL:decyzje*/
/*MODUL:db*/
/* ---- powłoka prototypu: wszystko, co trafia do innerHTML, przechodzi przez esc() ---- */
const $ = id => document.getElementById(id);
const toast = t => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 3200); };
const AKT = {}; DANE.akty.forEach(a => AKT[a.id] = a);
const P = wystProfile(DANE), PL = Object.values(P), IX = idIndeks(PL), ZNANE = new Set(PL.map(p => p.id));
let DEC = [], KL = decKlastry(DEC), CUR = null, FLT = 'wsz', KAND = {}, GOTOWE = 0;
const WN = {sprawdz:'sprawdź', mozliwe:'możliwe', malo:'za mało danych', konflikt:'konflikt'};
const kand = id => KAND[id] || (KAND[id] = idKandydaci(P[id], IX));
const czlonkowie = id => KL.czyja[id] ? KL.osoby[KL.czyja[id]].wystapienia : [id];
// propozycje dla osoby (klastra): pary na zewnątrz klastra, bez odrzuconych; jedna pozycja na kandydata
function propozycje(id){ const C = czlonkowie(id), wC = new Set(C), out = {}; C.forEach(w => kand(w).forEach(u => { if (wC.has(u.b) || KL.odrzucone.has(decKlucz(u.a, u.b))) return; const k = KL.czyja[u.b] || u.b; if (!out[k] || idPorzadek(u, out[k]) < 0) out[k] = u; })); return Object.values(out).sort(idPorzadek); }
const najlepszy = id => { const L = (KAND[id] || []).filter(u => !KL.odrzucone.has(decKlucz(u.a, u.b)) && KL.czyja[u.b] !== (KL.czyja[id] || '-')); return L.length ? L[0].wniosek : ''; };
async function zapisz(){ KL = decKlastry(DEC); const ok = await dbPut('decyzje', {format: DEC_FORMAT, dane: DANE.format, decyzje: DEC}); stan(ok); }
async function stan(ok){ const kop = await dbGet('kopia', null), od = kop ? DEC.filter(d => d.n > kop.n).length : DEC.length, e = $('stan');
  e.className = (DB_TRYB === 'pamiec' || od >= 20) ? 'zle' : ''; e.textContent = (DB_TRYB === 'pamiec' ? 'Uwaga: przeglądarka nie zapisuje stanu – zrób kopię przed zamknięciem. ' : 'Zapis w przeglądarce. ') + (od ? 'Decyzji bez kopii w pliku: ' + od + '.' : 'Kopia w pliku aktualna.'); }
function decyduj(typ, u, why){ if (typ === 'scal') { const kol = decKolizje(DEC, u.a, u.b); if (kol.length) return toast('Nie można scalić: w połączonej osobie znalazłaby się para wcześniej oznaczona jako różne osoby (' + kol.length + '). Najpierw cofnij tamtą decyzję.'); }
  decNowa(DEC, {typ, a: u.a, b: u.b, wniosek: u.wniosek, reguly: u.reguly, why: why || '', uzasadnienie: {zgodnosci: u.zgodnosci.map(x => x.t), rozbieznosci: u.rozbieznosci.map(x => x.t), sprzecznosci: u.sprzecznosci.map(x => x.t), braki: u.braki.map(x => x.t)}}); KL = decKlastry(DEC); lista(); karta(); zapisz(); }
function cofnij(n){ decNowa(DEC, {typ:'cofnij', cofa:n}); KL = decKlastry(DEC); lista(); karta(); zapisz(); toast('Cofnięto decyzję nr ' + n + '. Wystąpienia i źródła bez zmian.'); }
/* ---- lista ---- */
function lista(){ const q = fold($('q').value.trim()).split(/\s+/).filter(Boolean), widziane = new Set(); let L = [];
  PL.forEach(p => { const os = KL.czyja[p.id]; if (os) { if (widziane.has(os)) return; widziane.add(os); } const C = czlonkowie(p.id), tekst = fold(C.map(w => wystEtykieta(P[w])).join(' ')); if (q.some(t => !tekst.includes(t))) return;
    const nj = C.map(najlepszy).sort((a, b) => 'sprawdz mozliwe malo konflikt'.indexOf(a || 'zzz') - 'sprawdz mozliwe malo konflikt'.indexOf(b || 'zzz'))[0] || ''; if (FLT === 'os' && !os) return; if (FLT === 'spr' && nj !== 'sprawdz') return; if (FLT === 'moz' && nj !== 'mozliwe') return; L.push({p, os, n: C.length, nj}); });
  L.sort((a, b) => fold((a.p.nazwisko || a.p.rodowe) + ' ' + a.p.imie).localeCompare(fold((b.p.nazwisko || b.p.rodowe) + ' ' + b.p.imie)) || a.p.rok - b.p.rok);
  $('licz').textContent = DANE.akty.length + ' aktów · ' + PL.length + ' wystąpień · scalone osoby: ' + Object.keys(KL.osoby).length + (GOTOWE < PL.length ? ' · liczę propozycje ' + Math.round(100 * GOTOWE / PL.length) + '%' : '');
  $('flt').innerHTML = [['wsz','Wszystkie'],['spr','Mocne propozycje'],['moz','Możliwe'],['os','Scalone osoby']].map(([k, l]) => `<button data-f="${k}" class="${FLT === k ? 'on' : ''}">${esc(l)}</button>`).join('');
  $('lista').innerHTML = L.slice(0, 400).map(x => `<div class="it ${CUR && (KL.czyja[CUR] || CUR) === (x.os || x.p.id) ? 'on' : ''}" data-id="${esc(x.p.id)}">${esc((x.p.imie + ' ' + (x.p.nazwisko || (x.p.rodowe ? 'z d. ' + x.p.rodowe : ''))).trim() || '(bez nazwiska)')}${x.os ? `<span class="b os">osoba · ${x.n}</span>` : ''}${x.nj ? `<span class="b ${x.nj}">${esc(WN[x.nj])}</span>` : ''}<br><small>${esc(x.p.rolaAktu.replace(/_/g, ' ') + ' · ' + x.p.typ + ' ' + x.p.rok + (x.p.miejsce ? ' · ' + x.p.miejsce : ''))}</small></div>`).join('') + (L.length > 400 ? `<div class="mut">… i ${L.length - 400} dalszych; zawęź wyszukiwanie</div>` : '') || '<div class="mut">Brak wyników.</div>'; }
$('lista').onclick = e => { const it = e.target.closest('.it'); if (it) { CUR = it.dataset.id; lista(); karta(); } };
$('flt').onclick = e => { const b = e.target.closest('button'); if (b) { FLT = b.dataset.f; lista(); } };
$('q').oninput = () => lista();
/* ---- karta osoby ---- */
const poleHtml = p => `${esc(p.value)}<span class="b ${esc(p.status)}" title="status pola">${esc(p.status)}</span>${p.unc ? '<span class="b unc" title="niepewne">?</span>' : ''}${(p.alt || []).map(a => `<br><span class="mut">inny odczyt: ${esc(a.value)}</span><span class="b ${esc(a.status)}">${esc(a.status)}</span>`).join('')}`;
function wystHtml(id){ const p = P[id], a = AKT[p.akt], w = DANE.wystapienia.find(x => x.id === id), ETY = {imie:'imię', nazwisko:'nazwisko', rodowe:'nazwisko rodowe', imie_nazwisko:'imię i nazwisko', plec:'płeć', wiek:'wiek', stan:'stan', miejsce:'miejscowość', dom:'nr domu'};
  const rows = Object.entries(w.mapa).map(([k, f]) => { const x = a.pola[f]; return `<tr><th>${esc(ETY[k] || k)}</th><td>${poleHtml(x)}</td><td class="mut">${esc(x.source.plik)}${x.source.wiersz ? ' · w. ' + esc(x.source.wiersz) : ''}${x.source.skan ? ' · skan ' + esc(x.source.skan.split('/').pop()) + (x.source.strona ? ' s. ' + esc(x.source.strona) : '') : ''}</td></tr>`; }).join('');
  const ur = idUr(p), rodz = [p.ojciec && 'ojciec ' + p.ojciec, p.matka && 'matka ' + p.matka + (p.matkaNazw ? ' z d. ' + p.matkaNazw : ''), p.malzonek.length && 'małżonek ' + p.malzonek.join(', ')].filter(Boolean).join(' · ');
  return `<div class="card" style="margin-bottom:8px"><h3>${esc(wystEtykieta(p))} <span class="mut">(${esc(a.id)}, nr ${esc(a.nr || '–')})</span></h3><table>${rows}</table><div class="mut" style="margin-top:4px">${ur ? 'ur. ' + esc(ur.join('–')) + ' (wyliczone) · ' : ''}${esc(rodz || 'brak danych o rodzinie w tym akcie')}</div></div>`; }
function propHtml(u, i){ const q = P[u.b], os = KL.czyja[u.b], li = (L, c) => L.length ? `<ul class="${c}">${L.map(x => `<li>${esc(x.t)}</li>`).join('')}</ul>` : '<div class="mut">–</div>', odl = KL.odlozone.has(decKlucz(u.a, u.b));
  return `<div class="prop ${esc(u.wniosek)}"><h3>${esc(wystEtykieta(q))}${os ? `<span class="b os">osoba · ${KL.osoby[os].wystapienia.length} wyst.</span>` : ''}<span class="b ${esc(u.wniosek)}">${esc(WN[u.wniosek])}</span>${odl ? '<span class="b malo">odłożone</span>' : ''}</h3>
  <div class="mut">porównano z: ${esc(wystEtykieta(P[u.a]))}</div><div class="g4"><div><b class="zg">Zgodności</b>${li(u.zgodnosci, 'zg')}</div><div><b class="rb">Rozbieżności</b>${li(u.rozbieznosci, 'rb')}</div><div><b class="sp">Sprzeczności</b>${li(u.sprzecznosci, 'sp')}</div><div><b class="br">Braki danych</b>${li(u.braki, 'br')}</div></div>
  <div><b>Wniosek:</b> ${esc(idZdanie(u))}</div><div class="act"><button class="p" data-a="scal" data-i="${i}">To ta sama osoba – scal</button><button data-a="odrzuc" data-i="${i}">To różne osoby</button><button data-a="odloz" data-i="${i}">Odłóż</button><button data-a="idz" data-i="${i}">Pokaż kandydata</button></div></div>`; }
let PROP = [];
function karta(){ if (!CUR || !P[CUR]) return; const C = czlonkowie(CUR), os = KL.czyja[CUR]; PROP = propozycje(CUR); const gr = {sprawdz:[], mozliwe:[], malo:[], konflikt:[]}; PROP.forEach((u, i) => gr[u.wniosek].push(propHtml(u, i)));
  const hist = DEC.filter(d => d.typ !== 'cofnij' && (C.includes(d.a) || C.includes(d.b))), cof = new Set(DEC.filter(d => d.typ === 'cofnij').map(d => d.cofa));
  $('main').innerHTML = `<h2 style="margin-top:0">${os ? 'Osoba ' + esc(os) + ' – wystąpień w aktach: ' + C.length : 'Wystąpienie bez powiązań (tożsamość nierozstrzygnięta)'}</h2>${C.map(wystHtml).join('')}
  <h2>Propozycje połączeń (${PROP.length})</h2>${PROP.length ? '' : '<div class="card mut">Brak (dalszych) kandydatów o zgodnym imieniu i nazwisku.</div>'}${gr.sprawdz.join('')}${gr.mozliwe.join('')}
  ${gr.malo.length ? `<details><summary>Za mało danych (${gr.malo.length})</summary>${gr.malo.join('')}</details>` : ''}${gr.konflikt.length ? `<details><summary>Konflikty – raczej inne osoby (${gr.konflikt.length})</summary>${gr.konflikt.join('')}</details>` : ''}
  <h2>Historia decyzji tej osoby (${hist.length})</h2>${hist.length ? `<table>${hist.map(d => `<tr><td>${d.n}</td><td>${esc(d.t.slice(0, 16).replace('T', ' '))}</td><td>${esc(({scal:'scalono', odrzuc:'różne osoby', odloz:'odłożono'})[d.typ])}</td><td>${esc(P[d.a] ? wystEtykieta(P[d.a]) : d.a)} ↔ ${esc(P[d.b] ? wystEtykieta(P[d.b]) : d.b)}${d.why ? '<br><span class="mut">powód: ' + esc(d.why) + '</span>' : ''}</td><td>${cof.has(d.n) ? '<span class="mut">cofnięta</span>' : `<button class="d" data-cof="${d.n}">Cofnij</button>`}</td></tr>`).join('')}</table>` : '<div class="mut">Brak decyzji.</div>'}`; }
$('main').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.cof) return cofnij(+b.dataset.cof); const u = PROP[+b.dataset.i]; if (!u) return;
  if (b.dataset.a === 'idz') { CUR = u.b; lista(); karta(); window.scrollTo(0, 0); return; }
  if (b.dataset.a === 'scal' && u.wniosek !== 'sprawdz') { const why = prompt(u.wniosek === 'konflikt' ? 'Dane są sprzeczne: ' + u.sprzecznosci.map(x => x.t).join('; ') + '.\nJeśli mimo to scalasz, wpisz powód (zostanie w historii):' : 'Propozycja nie jest mocna. Wpisz, na jakiej podstawie scalasz (zostanie w historii):', ''); if (why === null || !why.trim()) return toast('Nie scalono – brak powodu.'); return decyduj('scal', u, why.trim()); }
  decyduj(b.dataset.a, u); };
/* ---- kopie ---- */
$('bExp').onclick = async () => { dl('multitool_decyzje_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify({format: DEC_FORMAT, dane: DANE.format, zapisano: new Date().toISOString(), decyzje: DEC}, null, 1), 'application/json', false); await dbPut('kopia', {n: DEC.reduce((m, d) => Math.max(m, d.n), 0), t: Date.now()}); stan(); toast('Zapisano kopię decyzji (pełna historia).'); };
$('bCsv').onclick = () => { dl('multitool_decyzje.csv', decCsv(DEC)); toast('CSV do wglądu. Pełną kopią jest plik JSON.'); };
$('bImp').onclick = () => $('fImp').click();
$('fImp').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if (!f) return; let o; try { o = JSON.parse(await f.text()); } catch (x) { return toast('To nie jest poprawny plik JSON.'); } const v = decWaliduj(o, ZNANE); if (!v.ok.length && v.bledy.length) return toast(v.bledy[0]);
  const mam = new Set(DEC.map(d => d.n + '|' + d.t)), nowe = v.ok.filter(d => !mam.has(d.n + '|' + d.t)); if (!confirm('W pliku: ' + v.ok.length + ' poprawnych decyzji, ' + v.bledy.length + ' odrzuconych wpisów.\nNowych względem obecnego stanu: ' + nowe.length + '.\nDopisać nowe do historii? (Obecne decyzje zostają.)')) return;
  let n = DEC.reduce((m, d) => Math.max(m, d.n), 0); const mapa = {}; nowe.forEach(d => { const k = Object.assign({}, d); if (DEC.some(x => x.n === d.n)) { mapa[d.n] = ++n; k.n = n; k.importZ = d.n; } DEC.push(k); }); DEC.forEach(d => { if (d.typ === 'cofnij' && d.importZ && mapa[d.cofa]) d.cofa = mapa[d.cofa]; }); DEC.sort((a, b) => a.n - b.n); await zapisz(); lista(); karta(); toast('Dopisano decyzji: ' + nowe.length + (v.bledy.length ? '; pominięto błędnych: ' + v.bledy.length : '')); };
/* ---- start ---- */
(async () => { const z = await dbGet('decyzje', null); if (z && z.decyzje) { const v = decWaliduj({format: z.format, decyzje: z.decyzje}, ZNANE); DEC = v.ok; if (v.bledy.length) toast('Pominięto ' + v.bledy.length + ' decyzji niepasujących do danych (zostają w bazie przeglądarki).'); } KL = decKlastry(DEC); stan(); lista();
  let i = 0; (function krok(){ const t = Date.now(); while (i < PL.length && Date.now() - t < 40) kand(PL[i++].id); GOTOWE = i; if (i < PL.length) { if (i % 100 < 12) lista(); setTimeout(krok, 0); } else { lista(); if (CUR) karta(); } })(); })();
</script></body></html>
