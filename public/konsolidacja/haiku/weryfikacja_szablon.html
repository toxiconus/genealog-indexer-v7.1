<!doctype html>
<html lang="pl"><head><meta charset="utf-8">

<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;-webkit-text-size-adjust:100%}

#tsheet .act3{display:flex;gap:8px;margin-top:8px}#tsheet .act3 button{min-height:54px;flex:1;font-size:16px;font-weight:600}#tsheet .act3 .btn-ok{flex:2.2}#tsheet .act3 .uncb{background:var(--bzb);border-color:var(--bz);color:var(--bz);font-weight:500}
#tsheet .ted input{margin:4px 0;padding:9px;font-size:17px}#tsheet .chip{min-height:44px}

.ri.err{border-color:var(--bad);background:var(--badb)}.ri.warn{border-color:var(--bz);background:var(--bzb)}.ri.ig{opacity:.5}.ri a{color:var(--acc);text-decoration:underline;cursor:pointer}.ri button{flex:0 0 auto;min-height:30px;padding:2px 9px;font-size:12px}
#repov{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}.rep-hd{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}.rep-body{padding:8px 10px 40px;max-width:760px;margin:0 auto}
#list button.rp-err::after,#list button.rp-warn::after{content:'!';color:#fff;border-radius:8px;font-size:10px;padding:0 4px;margin-left:3px}#list button.rp-err::after{background:var(--bad)}#list button.rp-warn::after{background:#d97706}
.dw{margin:6px 0}.dwr{display:flex;flex-wrap:wrap;gap:8px}.dwg{display:inline-flex;align-items:stretch}.dwg button{min-height:44px;min-width:40px;padding:0 8px;font-size:20px;border-radius:0}.dwg button:first-child{border-radius:10px 0 0 10px}.dwg button:last-child{border-radius:0 10px 10px 0}
.dwi{border:1px solid var(--line);background:var(--bg);text-align:center;padding:6px 4px;font-size:17px;min-height:44px;border-radius:0}input.dwi[data-p=d]{width:52px}input.dwi[data-p=y]{width:68px}select.dwi{width:118px}.dwj.on{background:var(--acc);color:#fff;border-color:var(--acc)}.dwj{margin-top:4px;min-height:34px}
.dwl{font-size:13px;color:var(--mut);margin-top:4px}
#tsheet .dwg button{min-height:40px}#tsheet .dwi{min-height:40px}
.tnot{font-size:13px;color:var(--mut);margin-top:8px;white-space:pre-wrap}
.tarea{width:100%;min-height:42vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px;font:17px/1.6 system-ui,sans-serif}
</style></head><body>
<header><h1>Weryfikacja zgonów · AI v1</h1><span id="prog"></span><button id="bText" class="sm" title="Pełny tekst aktu od Haiku: kilka trybów">Aa Tekst</button><button id="bMenu" class="sm">⋯ Menu</button></header>
<div id="menu">
 <button id="mCsv">⬇ Eksport CSV (zweryfikowane)</button>
 <button id="mLog">⬇ Eksport logu zmian</button>
 <button id="mRoi">⬇ Eksport ROI (JSON)</button>
 <button id="mRep">⚠ Raport spójności</button>
 <button id="mTop">↑ Lista aktów i filtry (do góry)</button>
 <button id="mOff">✕ Zamknij tryb tekstu / kreator</button>
 <button id="mTxt">⬇ Eksport tekstów aktów (MD, z poprawkami)</button>
 <button id="mSave">⬇ Kopia robocza (JSON)</button>
 <button id="mLoad">⬆ Wczytaj kopię roboczą</button>
 <button id="mAi">⬆ Dołącz CSV z odczytem AI</button>
 <button id="mScan">🖼 Dodaj skany z telefonu</button>
 <button id="mRej">⬇ Eksport rejestru i protokołów (CSV)</button>
 <button id="mReset">🗑 Wyczyść moje wybory</button>
</div>
<input type="file" id="fScan" accept="image/*" multiple hidden><input type="file" id="fAi" accept=".csv,text/csv" hidden><input type="file" id="fLoad" accept=".json" hidden>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div id="view"><div id="layer"><img id="img" alt=""><div id="roi"></div></div><div id="noimg">Brak skanu dla tego aktu.<br>Wybierz skan poniżej albo dodaj z telefonu.</div>
 <div id="vbar"><button id="zMenu" title="Menu">☰</button><button id="zIn">＋</button><button id="zOut">－</button><button id="zFit">◎</button><button id="zH">⇕</button><button id="zRoi">✎</button><button id="zRf" title="Ukryj/pokaż zaznaczenia na skanie">▭</button></div></div>
<main id="main"></main>
<div id="bar"><button id="bPrev">◀</button><button id="bWiz">🧭</button><button id="bSkip" class="btn-skip">Pomiń</button><button id="bOk" class="btn-ok">✓ Zatwierdź pole</button><button id="bNext">▶</button></div>
<div id="wbar"></div>
<div id="toast"></div>
<datalist id="dlS"></datalist><datalist id="dlN"></datalist>
<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const FIELDS = D.fields, AM = {}; D.acts.forEach(a => AM[a.id] = a);
// kolejność wg tekstu aktu: margines (nazwisko, miejsce) → data → godzina → świadkowie → reszta z treści
// kolejność jak w akcie: margines (miejsce zgonu, imię i nazwisko) → data aktu → świadkowie → data i godzina zgonu → płeć, urodzony i zamieszkały → wiek, zawód, stan, małżonek → rodzice
const ORD = ['death_place','deceased_last_name','deceased_first_name','act_date','informant1','informant2','death_date','death_time','deceased_sex','deceased_birth_place','deceased_residence','age','profession','deceased_status','deceased_spouse','deceased_maiden_name','father_first_name','father_last_name','mother_first_name','mother_last_name','officiant','notes'];
const ORDF = [...ORD.map(id => FIELDS.find(f => f.id === id)).filter(Boolean), ...FIELDS.filter(f => !ORD.includes(f.id))];
const NUMW = {'jeden':1,'dwa':2,'trzy':3,'cztery':4,'pięć':5,'sześć':6,'siedem':7,'osiem':8,'dziewięć':9,'dziesięć':10,'jedenaście':11,'dwanaście':12,'trzynaście':13,'czternaście':14};
const sLow = a => (getv(a,'deceased_status') || '').toString().toLowerCase();
const isSingle = a => /panna|kawaler/.test(sLow(a));
const isChild = a => { const t = (getv(a,'age') || '').toString().toLowerCase(); if (!t) return false; if (/miesi|tygod|(^|\s)dni(\s|$)|(^|\s)dzie[ńn](\s|$)|(^|\s)godz/.test(t)) return true; const m = t.match(/\d+/); if (m) return +m[0] < 15; const w = t.split(/\s+/).find(x => NUMW[x] !== undefined); return w ? NUMW[w] < 15 : false; };
// reguły: panna – bez męża; mężczyzna – nazwisko rodowe puste (nazwisko jest rodowe); dziecko – bez zawodu, chyba że wymieniony
const appl = (a,f) => { if (f === 'deceased_maiden_name') return getv(a,'deceased_sex') === 'K'; if (f === 'deceased_spouse') return !isSingle(a) && !isChild(a); if (f === 'profession' || f === 'deceased_status') return !isChild(a) || !!clean(getv(a,f)); return true; };
const warnsOf = a => { if (!a.ai && !a.lub) return []; const w = []; if (getv(a,'deceased_sex') === 'M' && clean(getv(a,'deceased_maiden_name'))) w.push('Mężczyzna: nazwisko rodowe powinno być puste (nazwisko jest rodowe) — chyba że wyjątek.'); if (isSingle(a) && clean(getv(a,'deceased_spouse'))) w.push('Panna/kawaler: nie powinno być małżonka.'); if (isChild(a) && clean(getv(a,'deceased_status'))) w.push('Dziecko: stan cywilny (kawaler/panna) powinien być pusty.'); if (isChild(a) && clean(getv(a,'profession'))) w.push('Dziecko z zawodem — potwierdź, że zawód jest wymieniony w akcie.'); return w; };
const warnHtml = a => { const w = warnsOf(a); return w.length ? `<div class="warn">${w.map(t => '⚠ ' + t).join('<br>')}</div>` : ''; };
let S = {acts:{}, cur:null, year:'all', flt:'all', hideOk:true, hideDoneActs:true, noroi:false, wiz:false};
const fieldsOf = a => a.kind==='prot' ? D.fieldsProt : a.kind==='rej' ? D.fieldsRej : ORDF;
try { const r = localStorage.getItem('wz1'); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem('wz1', JSON.stringify(S)); } catch(e){} };
const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2200); };
/*MODULE:tekst*/
/*MODULE:plik*/
/*MODULE:raport*/
const clean = s => (s||'').toString().replace(/\?/g,'').trim();
const exact = (a,b) => clean(a).toLowerCase() === clean(b).toLowerCase() && clean(a) !== '';
const loose = (a,b) => fold(clean(a)) === fold(clean(b)) && clean(a) !== '';
const st = id => S.acts[id] || (S.acts[id] = {f:{}, done:false});
const getv = (a,f) => { const x = S.acts[a.id]?.f?.[f]; return x ? x.v : (a.ai?.[f] ?? a.lub?.[f] ?? ''); };
const countOf = (f, v) => { const t = FT[f]; if (!t) return null; const c = D.counts[t][clean(v)]; return c || 0; };
const FT = {deceased_last_name:'s', deceased_maiden_name:'s', father_last_name:'s', mother_last_name:'s', deceased_first_name:'n', father_first_name:'n', mother_first_name:'n'};
$('dlS').innerHTML = Object.keys(D.counts.s).filter(k => D.counts.s[k] >= 2).sort().map(k => `<option value="${k}">`).join('');
$('dlN').innerHTML = Object.keys(D.counts.n).filter(k => D.counts.n[k] >= 2).sort().map(k => `<option value="${k}">`).join('');
const fuzzCache = {};
function near(f, v){ const t = FT[f]; const w = fold(clean(v)); if (!t || w.length < 3) return []; const k = t+w; if (fuzzCache[k]) return fuzzCache[k];
  const out = []; for (const [n,c] of Object.entries(D.counts[t])) { if (c < 3) continue; const d = lev(w, fold(n), 2); if (d <= 2 && n !== clean(v)) out.push([n,c,d]); }
  out.sort((x,y) => x[2]-y[2] || y[1]-x[1]); return fuzzCache[k] = out.slice(0,3); }
function diffState(a,f){ const x = a.ai?.[f], y = a.lub?.[f]; if (!x || !y) return ''; if (exact(x,y)) return 'eq'; if (loose(x,y)) return 'ap'; return 'ne'; }
function hasDiff(a){ return fieldsOf(a).some(f => diffState(a,f.id) === 'ne'); }
function isUnc(a,f){ const x = S.acts[a.id]?.f?.[f]; if (x && x.unc !== undefined) return !!x.unc; return !!a.ai && (a.unc.includes(f) || /\?/.test(a.ai[f]||'')); }

// ---- raport spójności (moduł wspolne/raport.js)
const repRows = () => D.acts.filter(a => !a.kind && a.ai).map(a => { const g = f => clean(getv(a,f)); return {id:a.id, year:a.year, num:a.act, last:g('deceased_last_name'), first:g('deceased_first_name'), sex:g('deceased_sex'), death:g('death_date'), act:g('act_date'), ageText:g('age'), status:g('deceased_status'), spouse:g('deceased_spouse'), job:g('profession'), father:(g('father_first_name')+' '+g('father_last_name')).trim(), mother:(g('mother_first_name')+' '+g('mother_last_name')).trim(), maiden:g('deceased_maiden_name')}; });
const repAll = (ign) => raportSpojnosci(repRows()).filter(i => ign || !(S.repIgn || {})[i.id + '|' + i.code]);

    $('qSkip').onclick = () => { const s2 = st(a.id); (s2.qs = s2.qs || {})[q.key] = 'skip'; save(); tafter(a, FS, q.s, false); rerender(); }; }
  const adv = () => { tafter(a, FS, cpos, false); rerender(); };
  if ($('tfv')) { const f = TF; $('tfv').onchange = () => { commit(a, f, $('tfv').value.trim(), 'edit'); rerender(false); };
    sh.querySelectorAll('.chip[data-f]').forEach(b => b.onclick = () => { approveAll(a, FS, b.dataset.f, b.dataset.v, b.dataset.s); adv(); });
    $('tfOk').onclick = () => { const v = $('tfv').value.trim(), c = sh.querySelector('.chip.sel[data-f]'); approveAll(a, FS, f, v, c && clean(c.dataset.v) === clean(v) ? c.dataset.s : (st(a.id).f[f]?.src || 'edit')); adv(); };
    $('tfSkip').onclick = () => { commit(a, f, getv(a,f), 'ai', {skip:true, ok:false}); adv(); };
    $('tfUnc').onclick = () => { const x = st(a.id).f[f] || {v:getv(a,f), src:(a.ai?.[f]?'ai':'lub'), ok:false}; x.unc = !isUnc(a,f); st(a.id).f[f] = x; save(); rerender(false); };
    if ($('tfNote')) $('tfNote').onchange = () => { const x = st(a.id).f[f]; if (x) { x.note = $('tfNote').value.trim(); save(); } }; }
  setTimeout(() => { selScroll(); focusTxt(a); }, 30);
  if ($('tfMinus')) { $('tfMinus').onclick = () => { S.tfs = Math.max(13, fs-2); save(); renderAct(); }; $('tfPlus').onclick = () => { S.tfs = Math.min(30, fs+2); save(); renderAct(); }; }
  if ($('tfCopy')) $('tfCopy').onclick = async () => { try { await navigator.clipboard.writeText(t); toast('Skopiowano'); } catch(e) { toast('Nie można skopiować'); } };
  if ($('tfArea')) { const sv = () => { const v = $('tfArea').value; const s2 = st(a.id); if (v === (a.tekst||'')) delete s2.text; else s2.text = v; save(); }; $('tfArea').onchange = sv; $('tfSave').onclick = () => { sv(); toast('Zapisano tekst'); renderAct(); }; $('tfRest').onclick = () => { delete st(a.id).text; save(); toast('Przywrócono oryginał'); renderAct(); }; }
}
$('bText').onclick = () => { W.on = false; document.body.classList.remove('wz'); S.tmode = S.tmode ? '' : 'pola'; save(); if (S.tmode && !curAct()?.tekst) toast('Ta pozycja nie ma pełnego tekstu – wybierz akt z listy (np. 43/26)'); renderAct(); window.scrollTo(0,0); };
$('mTxt').onclick = () => { const L = ['# Teksty aktów zmarłych (Haiku AI v1, z poprawkami z narzędzia)', '']; D.acts.filter(a => a.tekst).forEach(a => { const ch = S.acts[a.id]?.text != null; L.push(`## ${a.id}${ch ? ' · POPRAWIONY' : ''}`, '> ' + txtOf(a), ''); if (ch) L.push('Oryginał Haiku:', '> ' + a.tekst, ''); }); dl('ZGONY_teksty_poprawione.md', L.join('\n'), 'text/markdown'); };
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#bMenu') && !e.target.closest('#zMenu')) $('menu').style.display = 'none'; });
function init(){ $('zRf').classList.toggle('on', !!S.noroi); renderTabs(); renderList(); if (!S.cur || !AM[S.cur]) S.cur = (D.acts.find(a => a.ai) || D.acts[0])?.id; renderList(); renderAct(); showScan(); }
loadExtra().then(init);
</script></body></html>
