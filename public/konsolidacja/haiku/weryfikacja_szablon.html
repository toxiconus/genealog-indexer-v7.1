<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weryfikacja zgonów AI</title>
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1f2937;--mut:#6b7280;--line:#d9d4c7;--ai:#1d4ed8;--aib:#dbeafe;--lub:#15803d;--lubb:#dcfce7;--bz:#b45309;--bzb:#ffedd5;--bad:#b91c1c;--badb:#fee2e2;--ok:#15803d;--acc:#7c2d12}
@media(prefers-color-scheme:dark){:root{--bg:#161412;--card:#201d1a;--ink:#ece7dd;--mut:#9a9488;--line:#3a352f;--aib:#1e3a8a;--lubb:#14532d;--bzb:#78350f;--badb:#7f1d1d;--ai:#93c5fd;--lub:#86efac;--bz:#fdba74;--bad:#fca5a5}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
header h1{font-size:15px;margin:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{min-height:34px;padding:5px 9px;font-size:14px}
#prog{font-size:13px;color:var(--mut)}
#list{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
#list button{min-width:48px;padding:6px 8px;min-height:38px;flex:0 0 auto}
#list button.cur{outline:3px solid var(--acc)}
#list button.done{background:var(--lubb);border-color:var(--lub)}
#list button.diff{border-color:var(--bad);border-width:2px}
#list button.noai{opacity:.55}
.tabs{display:flex;gap:6px;padding:6px 10px;flex-wrap:nowrap;overflow-x:auto;background:var(--card)}.tabs button{flex:0 0 auto}
.tabs button.on{background:var(--acc);color:#fff}
#view{position:sticky;top:0;z-index:25;height:42vh;background:#222;overflow:hidden;touch-action:none}
#view.l{height:68vh}#view.s{height:28vh}#view.xl{position:fixed;inset:0;z-index:50;height:100vh}
body.wz header,body.wz .tabs,body.wz #list,body.wz #bar{display:none}body.wz #view{height:40vh}body.wz #view.l{height:60vh}body.wz #view.s{height:26vh}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#layer img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#roi{position:absolute;border:2px dashed #f59e0b;background:none;pointer-events:none}
#vbar{position:absolute;right:6px;top:6px;display:flex;gap:6px;flex-direction:column;z-index:3}
#vbar button{background:rgba(255,255,255,.9);color:#111;min-height:40px;min-width:40px;padding:4px 8px}
#vbar button.on{background:#f59e0b}
#noimg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:20px}
main{padding:10px;max-width:760px;margin:0 auto 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.hd b{font-size:18px}.muted{color:var(--mut);font-size:13px}
.row{border-top:1px solid var(--line);padding:8px 0}
.row:first-of-type{border-top:0}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}
.row input,.row textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px}
.row.ok input{border-color:var(--ok);background:var(--lubb)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{border-radius:999px;padding:7px 12px;min-height:38px;font-size:15px;border:1px solid;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.chip small{opacity:.75;font-size:11px}
.chip.ai{background:var(--aib);border-color:var(--ai);color:var(--ai)}
.chip.lub{background:var(--lubb);border-color:var(--lub);color:var(--lub)}
.chip.bz{background:var(--bzb);border-color:var(--bz);color:var(--bz)}
.chip.sel{box-shadow:0 0 0 3px var(--acc)}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px}
.tag.eq{background:var(--lubb);color:var(--lub)}.tag.ne{background:var(--badb);color:var(--bad)}.tag.ap{background:var(--bzb);color:var(--bz)}.tag.q{background:var(--bzb);color:var(--bz)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
#bar button{flex:1}#bar #bOk{flex:2.2}#bar #bPrev,#bar #bNext,#bar #bWiz{flex:.7}.row.act{outline:3px solid var(--acc);border-radius:10px;padding-left:6px;padding-right:6px}
details{margin-top:6px}details pre{white-space:pre-wrap;font-size:13px;background:var(--bg);padding:8px;border-radius:8px}
#menu{display:none;position:fixed;right:8px;top:54px;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:260px}
#menu button{display:block;width:100%;margin:4px 0;text-align:left}
#wbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
body.wz #wbar{display:flex}#wbar button{flex:1;padding:9px 4px}
.wz-card .big{font-size:22px;font-weight:600;margin:4px 0}.wz-card .chip{font-size:18px;min-height:48px;padding:9px 16px}
.wz-card input,.wz-card textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:19px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.mini b{color:var(--ink);font-weight:500}.mini button{min-height:30px;padding:2px 10px;font-size:13px}
.chip.akt{background:#ede9fe;border-color:#6d28d9;color:#6d28d9}.chip.uncb{background:var(--bzb);border-color:var(--bz);color:var(--bz)}.chip.uncb.sel{box-shadow:0 0 0 3px var(--bz)}
.nt{margin-top:5px}.nt input{padding:7px;font-size:15px}
button.btn-ok,.chip.btn-ok{background:#15803d!important;color:#fff!important;border-color:#15803d!important}
button.btn-skip,.chip.btn-skip{background:#ea580c!important;color:#fff!important;border-color:#ea580c!important}
.warn{border:2px solid var(--bad);background:var(--badb);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:10px;z-index:70;display:none;max-width:90%}

/* tryby tekstowe */
#bText.on{background:var(--acc);color:#fff;border-color:var(--acc)}
body.textmode #bar{display:none}body.textmode main{max-width:1000px;margin-bottom:24px}
.tm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tm button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ttext{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:2.1;overflow-wrap:anywhere}
.hl{border-bottom:3px solid var(--ai);background:var(--aib);border-radius:4px;padding:1px 2px;cursor:pointer}
.hl.ok{background:var(--lubb);border-bottom-color:var(--lub)}.hl.un{background:var(--bzb);border-bottom-color:var(--bz)}.hl.cf{background:var(--badb);border-bottom-color:var(--bad)}.hl.sk{background:transparent;border-bottom:3px dotted var(--mut)}
.hl.sel{outline:3px solid var(--acc)}
.mq{background:var(--bzb);color:var(--bz);border-radius:4px;padding:0 2px;font-weight:600}.mr{background:var(--badb);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:600}.mg{color:var(--mut)}
.tleg{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}.tleg span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.ted{margin-top:10px;border:2px solid var(--acc);border-radius:12px;background:var(--card);padding:10px}.ted input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;margin:6px 0}
.qm{background:var(--bzb);border-bottom:3px solid var(--bz);border-radius:4px;padding:1px 3px;font-weight:600;cursor:pointer;color:var(--ink)}.qm.r{background:var(--badb);border-bottom-color:var(--bad)}.qm.sk{background:transparent;border-bottom:3px dotted var(--mut);font-weight:400}.qm.sel{outline:3px solid var(--acc)}
.tnot{font-size:13px;color:var(--mut);margin-top:8px;white-space:pre-wrap}
.tarea{width:100%;min-height:42vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px;font:17px/1.6 system-ui,sans-serif}
</style></head><body>
<header><h1>Weryfikacja zgonów · AI v1</h1><span id="prog"></span><button id="bText" class="sm" title="Pełny tekst aktu od Haiku: kilka trybów">Aa Tekst</button><button id="bMenu" class="sm">⋯ Menu</button></header>
<div id="menu">
 <button id="mCsv">⬇ Eksport CSV (zweryfikowane)</button>
 <button id="mLog">⬇ Eksport logu zmian</button>
 <button id="mRoi">⬇ Eksport ROI (JSON)</button>
 <button id="mTxt">⬇ Eksport tekstów aktów (MD, z poprawkami)</button>
 <button id="mSave">⬇ Kopia robocza (JSON)</button>
 <button id="mLoad">⬆ Wczytaj kopię roboczą</button>
 <button id="mAi">⬆ Dołącz CSV z odczytem AI</button>
 <button id="mScan">🖼 Dodaj skany z telefonu</button>
 <button id="mRej">⬇ Eksport rejestru i protokołów (CSV)</button>
 <button id="mReset">🗑 Wyczyść moje wybory</button>
</div>
<input type="file" id="fScan" accept="image/*" multiple hidden><input type="file" id="fAi" accept=".csv,text/csv" hidden><input type="file" id="fLoad" accept=".json" hidden>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div id="view"><div id="layer"><img id="img" alt=""><div id="roi"></div></div><div id="noimg">Brak skanu dla tego aktu.<br>Wybierz skan poniżej albo dodaj z telefonu.</div>
 <div id="vbar"><button id="zIn">＋</button><button id="zOut">－</button><button id="zFit">◎</button><button id="zH">⇕</button><button id="zRoi">✎</button><button id="zRf" title="Ukryj/pokaż ramkę">▭</button></div></div>
<main id="main"></main>
<div id="bar"><button id="bPrev">◀</button><button id="bWiz">🧭</button><button id="bSkip" class="btn-skip">Pomiń</button><button id="bOk" class="btn-ok">✓ Zatwierdź pole</button><button id="bNext">▶</button></div>
<div id="wbar"></div>
<div id="toast"></div>
<datalist id="dlS"></datalist><datalist id="dlN"></datalist>
<script>
const D = /*DATA*/null;
const $ = id => document.getElementById(id);
const FIELDS = D.fields, AM = {}; D.acts.forEach(a => AM[a.id] = a);
// kolejność wg tekstu aktu: margines (nazwisko, miejsce) → data → godzina → świadkowie → reszta z treści
// kolejność jak w akcie: margines (miejsce zgonu, imię i nazwisko) → data aktu → świadkowie → data i godzina zgonu → płeć, urodzony i zamieszkały → wiek, zawód, stan, małżonek → rodzice
const ORD = ['death_place','deceased_last_name','deceased_first_name','act_date','informant1','informant2','death_date','death_time','deceased_sex','deceased_birth_place','deceased_residence','age','profession','deceased_status','deceased_spouse','deceased_maiden_name','father_first_name','father_last_name','mother_first_name','mother_last_name','officiant','notes'];
const ORDF = [...ORD.map(id => FIELDS.find(f => f.id === id)).filter(Boolean), ...FIELDS.filter(f => !ORD.includes(f.id))];
const NUMW = {'jeden':1,'dwa':2,'trzy':3,'cztery':4,'pięć':5,'sześć':6,'siedem':7,'osiem':8,'dziewięć':9,'dziesięć':10,'jedenaście':11,'dwanaście':12,'trzynaście':13,'czternaście':14};
const sLow = a => (getv(a,'deceased_status') || '').toString().toLowerCase();
const isSingle = a => /panna|kawaler/.test(sLow(a));
const isChild = a => { const t = (getv(a,'age') || '').toString().toLowerCase(); if (!t) return false; if (/miesi|tygod|(^|\s)dni(\s|$)|(^|\s)dzie[ńn](\s|$)|(^|\s)godz/.test(t)) return true; const m = t.match(/\d+/); if (m) return +m[0] < 15; const w = t.split(/\s+/).find(x => NUMW[x] !== undefined); return w ? NUMW[w] < 15 : false; };
// reguły: panna – bez męża; mężczyzna – nazwisko rodowe puste (nazwisko jest rodowe); dziecko – bez zawodu, chyba że wymieniony
const appl = (a,f) => { if (f === 'deceased_maiden_name') return getv(a,'deceased_sex') === 'K'; if (f === 'deceased_spouse') return !isSingle(a) && !isChild(a); if (f === 'profession' || f === 'deceased_status') return !isChild(a) || !!clean(getv(a,f)); return true; };
const warnsOf = a => { if (!a.ai && !a.lub) return []; const w = []; if (getv(a,'deceased_sex') === 'M' && clean(getv(a,'deceased_maiden_name'))) w.push('Mężczyzna: nazwisko rodowe powinno być puste (nazwisko jest rodowe) — chyba że wyjątek.'); if (isSingle(a) && clean(getv(a,'deceased_spouse'))) w.push('Panna/kawaler: nie powinno być małżonka.'); if (isChild(a) && clean(getv(a,'deceased_status'))) w.push('Dziecko: stan cywilny (kawaler/panna) powinien być pusty.'); if (isChild(a) && clean(getv(a,'profession'))) w.push('Dziecko z zawodem — potwierdź, że zawód jest wymieniony w akcie.'); return w; };
const warnHtml = a => { const w = warnsOf(a); return w.length ? `<div class="warn">${w.map(t => '⚠ ' + t).join('<br>')}</div>` : ''; };
let S = {acts:{}, cur:null, year:'all', flt:'all', hideOk:true, hideDoneActs:true, noroi:false, wiz:false};
const fieldsOf = a => a.kind==='prot' ? D.fieldsProt : a.kind==='rej' ? D.fieldsRej : ORDF;
try { const r = localStorage.getItem('wz1'); if (r) S = Object.assign(S, JSON.parse(r)); } catch(e){}
const save = () => { try { localStorage.setItem('wz1', JSON.stringify(S)); } catch(e){} };
const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2200); };
const fold = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
const clean = s => (s||'').toString().replace(/\?/g,'').trim();
const exact = (a,b) => clean(a).toLowerCase() === clean(b).toLowerCase() && clean(a) !== '';
const loose = (a,b) => fold(clean(a)) === fold(clean(b)) && clean(a) !== '';
const st = id => S.acts[id] || (S.acts[id] = {f:{}, done:false});
const getv = (a,f) => { const x = S.acts[a.id]?.f?.[f]; return x ? x.v : (a.ai?.[f] ?? a.lub?.[f] ?? ''); };
const countOf = (f, v) => { const t = FT[f]; if (!t) return null; const c = D.counts[t][clean(v)]; return c || 0; };
const FT = {deceased_last_name:'s', deceased_maiden_name:'s', father_last_name:'s', mother_last_name:'s', deceased_first_name:'n', father_first_name:'n', mother_first_name:'n'};
$('dlS').innerHTML = Object.keys(D.counts.s).filter(k => D.counts.s[k] >= 2).sort().map(k => `<option value="${k}">`).join('');
$('dlN').innerHTML = Object.keys(D.counts.n).filter(k => D.counts.n[k] >= 2).sort().map(k => `<option value="${k}">`).join('');
function lev(a,b){ if (Math.abs(a.length-b.length) > 2) return 9; const m=[...Array(b.length+1).keys()]; for (let i=1;i<=a.length;i++){ let p=m[0]; m[0]=i; for (let j=1;j<=b.length;j++){ const t=m[j]; m[j]=Math.min(m[j]+1,m[j-1]+1,p+(a[i-1]===b[j-1]?0:1)); p=t; } } return m[b.length]; }
const fuzzCache = {};
function near(f, v){ const t = FT[f]; const w = fold(clean(v)); if (!t || w.length < 3) return []; const k = t+w; if (fuzzCache[k]) return fuzzCache[k];
  const out = []; for (const [n,c] of Object.entries(D.counts[t])) { if (c < 3) continue; const d = lev(w, fold(n)); if (d <= 2 && n !== clean(v)) out.push([n,c,d]); }
  out.sort((x,y) => x[2]-y[2] || y[1]-x[1]); return fuzzCache[k] = out.slice(0,3); }
function diffState(a,f){ const x = a.ai?.[f], y = a.lub?.[f]; if (!x || !y) return ''; if (exact(x,y)) return 'eq'; if (loose(x,y)) return 'ap'; return 'ne'; }
function hasDiff(a){ return fieldsOf(a).some(f => diffState(a,f.id) === 'ne'); }
function isUnc(a,f){ const x = S.acts[a.id]?.f?.[f]; if (x && x.unc !== undefined) return !!x.unc; return !!a.ai && (a.unc.includes(f) || /\?/.test(a.ai[f]||'')); }
// ---- lista
function visible(){ return D.acts.filter(a => (S.flt==='rej' ? a.kind : !a.kind) && (S.flt==='rej' || S.year==='all' || String(a.year)===S.year) && (a.id===S.cur || !S.hideDoneActs || S.flt==='done' || S.flt==='rej' || !S.acts[a.id]?.done) && (S.flt==='all' || S.flt==='rej' || (S.flt==='ai' && a.ai) || (S.flt==='todo' && a.ai && !S.acts[a.id]?.done) || (S.flt==='diff' && a.ai && hasDiff(a)) || (S.flt==='done' && S.acts[a.id]?.done) || (S.flt==='lub' && !a.ai))); }
function renderTabs(){ const ys = ['all',...new Set(D.acts.filter(a => !a.kind).map(a => String(a.year)))]; const fl = [['rej','Rejestr + protokoły'],['all','Wszystkie'],['ai','Z odczytem AI'],['todo','Do weryfikacji'],['diff','Różnice'],['done','Zatwierdzone'],['lub','Tylko Lubgens']];
  $('tabs').innerHTML = ys.map(y => `<button class="sm ${S.year===y?'on':''}" data-y="${y}">${y==='all'?'Lata: wszystkie':y}</button>`).join('') + fl.map(([k,l]) => `<button class="sm ${S.flt===k?'on':''}" data-f="${k}">${l}</button>`).join('') + `<button class="sm ${S.hideDoneActs?'on':''}" id="tHide">Ukryj ✓ zatwierdzone</button>`;
  $('tHide').onclick = () => { S.hideDoneActs = !S.hideDoneActs; save(); renderTabs(); renderList(); };
  $('tabs').querySelectorAll('button[data-y],button[data-f]').forEach(b => b.onclick = () => { if (b.dataset.y) S.year = b.dataset.y; else S.flt = b.dataset.f; save(); renderTabs(); renderList(); }); }
function renderList(){ const v = visible(); $('list').innerHTML = v.map(a => `<button data-id="${a.id}" class="${a.id===S.cur?'cur':''} ${S.acts[a.id]?.done?'done':''} ${a.ai&&hasDiff(a)?'diff':''} ${a.ai?'':'noai'}" title="${a.year}">${a.kind==='rej'?'Lp'+a.act:a.kind==='prot'?'Prot '+a.year:(S.year==='all'?String(a.year).slice(2)+'/':'')+a.act}</button>`).join('') || '<span class="muted">Brak aktów w tym filtrze</span>';
  $('list').querySelectorAll('button').forEach(b => b.onclick = () => open(b.dataset.id));
  const done = D.acts.filter(a => !a.kind && S.acts[a.id]?.done).length, ai = D.acts.filter(a => !a.kind && a.ai).length; $('prog').textContent = `${done}/${ai} zatwierdz.`;
  const c = $('list').querySelector('.cur'); if (c) c.scrollIntoView({inline:'center', block:'nearest'}); }
// ---- akt
function open(id){ S.cur = id; save(); renderList(); if (W.on) wizStart(); renderAct(); showScan(); }
function chipsFor(a,f){ const cur = getv(a,f); const out = []; const seen = new Set(); const add = (cls,lbl,val,extra='') => { if (!val) return; const key = cls+val; if (seen.has(key)) return; seen.add(key); out.push(`<button class="chip ${cls} ${clean(cur)===clean(val)?'sel':''}" data-f="${f}" data-v="${val.replace(/"/g,'&quot;')}" data-s="${cls}"><small>${lbl}</small>${val}${extra}</button>`); };
  const cnt = v => { const c = countOf(f,v); return c === null ? '' : ` <small>×${c}</small>`; };
  if (a.ai?.[f]) add('ai','AI',a.ai[f],cnt(a.ai[f])); if (a.lub?.[f]) add('lub','LUB',a.lub[f],cnt(a.lub[f])); (a.alts?.[f]||[]).forEach(([c,l,v]) => add(c,l,v,cnt(v)));
  if (FT[f]) { [a.ai?.[f], a.lub?.[f]].filter(Boolean).forEach(v => { if (countOf(f,v) === 0) near(f,v).forEach(([n,c]) => add('bz','BAZA ≈',n,` <small>×${c}</small>`)); }); }
  return out.join(''); }

  const unc = FIELDS.filter(f => (isUnc(a,f.id) && !s.f?.[f.id]?.ok) || (s.f?.[f.id]?.unc)).map(f => f.id); r.uncertain_fields = unc.join(';'); r.verification_notes = FIELDS.filter(f => s.f?.[f.id]?.note).map(f => f.id + ': ' + s.f[f.id].note).join(' | ');
  const ed = Object.keys(s.f||{}).length; r.verification_status = s.done ? 'ok' : (ed ? 'ai_v1_w_trakcie' : 'ai_v1'); return r; }); }
$('mCsv').onclick = () => { const rs = rows(); dl('ZGONY_zweryfikowane.csv', COLS.join(';') + '\r\n' + rs.map(r => COLS.map(c => q(r[c])).join(';')).join('\r\n') + '\r\n'); toast(`Eksport: ${rs.length} aktów`); };
$('mLog').onclick = () => { const L = ['akt;pole;ai;lubgens;wybrane;zrodlo']; D.acts.forEach(a => { const s = S.acts[a.id]; if (!s) return; Object.entries(s.f).forEach(([f,x]) => L.push([a.id, f, a.ai?.[f]||'', a.lub?.[f]||'', x.v, x.src].map(q).join(';'))); }); dl('ZGONY_log_wyborow.csv', L.join('\r\n') + '\r\n'); };
$('mRoi').onclick = () => dl('ZGONY_ai1_roi_poprawione.json', JSON.stringify(D.acts.filter(a => a.ai).map(a => ({id:a.id, plik:scanOf(a), strona:1, roi:roiOf(a)})), null, 1), 'application/json');
$('mRej').onclick = () => { const L = ['id;pole;wartosc;zrodlo;niepewne;opis;pominiete;zatwierdzone']; D.acts.filter(a => a.kind).forEach(a => fieldsOf(a).forEach(f => { const x = S.acts[a.id]?.f?.[f.id]; L.push([a.id, f.id, x ? x.v : (a.ai?.[f.id]||''), x?.src||'ai_v1', x?.unc?'1':'', x?.note||'', x?.skip?'1':'', x?.ok?'1':''].map(q).join(';')); })); dl('ZGONY_rejestr_protokoly_zweryfikowane.csv', L.join('\r\n') + '\r\n'); toast('Eksport rejestru'); };
$('mSave').onclick = () => dl('weryfikacja_kopia.json', JSON.stringify(S), 'application/json');
$('mLoad').onclick = () => $('fLoad').click(); $('fLoad').onchange = async e => { try { S = Object.assign(S, JSON.parse(await e.target.files[0].text())); save(); init(); toast('Wczytano kopię'); } catch(x){ toast('Błędny plik'); } };
$('mReset').onclick = () => { if ($('mReset').dataset.arm) { S.acts = {}; save(); delete $('mReset').dataset.arm; $('mReset').textContent = '🗑 Wyczyść moje wybory'; init(); toast('Wyczyszczono'); } else { $('mReset').dataset.arm = 1; $('mReset').textContent = '⚠ Dotknij ponownie, by wyczyścić'; } };
$('bMenu').onclick = () => { const m = $('menu'); m.style.display = m.style.display === 'block' ? 'none' : 'block'; };
$('mAi').onclick = () => $('fAi').click();
$('fAi').onchange = async e => { const t = (await e.target.files[0].text()).replace(/^﻿/,''); const L = t.split(/\r?\n/).filter(Boolean), H = L[0].split(';'); let n = 0;
  L.slice(1).forEach(l => { const c = l.split(';'), o = {}; H.forEach((h,i) => o[h] = c[i]||''); const id = o.id; if (!id) return; if (AM[id]) { AM[id].ai = o; n++; } else { const [,y,k] = id.match(/-(\d{4})-(\d+)/)||[]; if (!y) return; const a = {id, year:+y, act:+k, ai:o, unc:(o.uncertain_fields||'').split(';').filter(Boolean), file:'', roi:null}; D.acts.push(a); AM[id] = a; n++; } });
  D.acts.sort((x,y) => x.year-y.year || x.act-y.act); toast(`Dołączono rekordów AI: ${n}`); init(); };
$('mScan').onclick = () => $('fScan').click();
$('fScan').onchange = async e => { for (const f of e.target.files) { extra[f.name] = URL.createObjectURL(f); try { const db = await idb(); db.transaction('s','readwrite').objectStore('s').put(f, f.name); } catch(x){} } toast(`Dodano skanów: ${e.target.files.length}`); renderAct(); };
const idb = () => new Promise((ok,no) => { const r = indexedDB.open('wz1', 1); r.onupgradeneeded = () => r.result.createObjectStore('s'); r.onsuccess = () => ok(r.result); r.onerror = no; });
async function loadExtra(){ try { const db = await idb(), os = db.transaction('s').objectStore('s'); const ks = await new Promise(ok => { const q = os.getAllKeys(); q.onsuccess = () => ok(q.result); }); for (const k of ks) { const b = await new Promise(ok => { const g = os.get(k); g.onsuccess = () => ok(g.result); }); extra[k] = URL.createObjectURL(b); } } catch(e){} }

// ---- tryby tekstowe (pełny tekst od Haiku)
const TF_ORDER = ['informant1','informant2','death_place','deceased_first_name','deceased_last_name','deceased_birth_place','deceased_residence','profession','deceased_status','deceased_spouse','deceased_maiden_name','father_first_name','father_last_name','mother_first_name','mother_last_name','officiant'];
let TF = null;
const txtOf = a => { const s = S.acts[a.id]; return s && s.text != null ? s.text : (a.tekst || ''); };
function stemOk(w, v){ const a = fold(w), b = fold(v); if (a.length < 3 || b.length < 3 || Math.abs(a.length-b.length) > 3) return false; let k = 0; while (k < a.length && k < b.length && a[k] === b[k]) k++; return k >= Math.max(3, Math.min(a.length, b.length) - 2); }
function assignTok(a, t, FS){ const toks = []; const re = /[\p{L}]+/gu; let m; while ((m = re.exec(t))) toks.push({w:m[0], i:m.index, e:m.index+m[0].length, f:null});
  const ids = new Set(FS.map(f => f.id)); let cur = 0; const um = toks.findIndex(x => /^(umar|zmar)/i.test(x.w));
  for (const f of TF_ORDER) { if (!ids.has(f)) continue; const ws = (f.startsWith('informant') ? clean(getv(a,f)).split(',')[0] : clean(getv(a,f))).split(/[\s\-,]+/).filter(w => w.length >= 3); if (!ws.length) continue;
    if (um >= 0 && ['death_place','deceased_first_name','deceased_last_name'].includes(f) && cur < um) cur = um;
    let from = cur; for (const w of ws) { let j = toks.findIndex((x,k) => k >= from && !x.f && stemOk(x.w, w)); if (j < 0) j = toks.findIndex(x => !x.f && stemOk(x.w, w)); if (j >= 0) { toks[j].f = f; from = j; if (w === ws[0]) cur = j; } } }
  return toks; }
const hlCls = (a, f) => { const x = S.acts[a.id]?.f?.[f]; return x?.skip ? 'sk' : x?.ok ? (x.unc ? 'un' : 'ok') : isUnc(a,f) ? 'un' : diffState(a,f) === 'ne' ? 'cf' : ''; };
function marks(h){ return h.replace(/\[[^\]]*\]/g, q => /\?/.test(q) ? `<span class="mq">${q}</span>` : /nieczytel/i.test(q) ? `<span class="mr">${q}</span>` : `<span class="mg">${q}</span>`); }
const QRE = /(?:[\p{L}]+\s?)?\[[^\]]*(?:\?|nieczytel)[^\]]*\]/gu;
function qList(t){ const o = [], c = {}; for (const m of t.matchAll(QRE)) { const k = m[0]; c[k] = c[k] || 0; o.push({s:m.index, e:m.index+k.length, txt:k, key:k+'#'+(c[k]++)}); } return o; }
function qClean(x){ const m = x.match(/^([\s\S]*?)\[([^\]]*)\]$/); if (!m) return x; const inner = m[2].replace(/\?/g,'').trim(); return /nieczytel/i.test(inner) ? m[1].trim() : (inner ? m[1] + inner : m[1].trim()); }
let TQ = null;
function hlHtml(a, t, FS, withHl){ const qs = qList(t), sk = S.acts[a.id]?.qs || {}; const toks = withHl ? assignTok(a, t, FS) : [];
  toks.forEach(x => { if (x.f && qs.some(q => x.i < q.e && x.e > q.s)) x.f = null; });
  const items = qs.map(q => ({s:q.s, e:q.e, q})); let i = 0;
  while (i < toks.length) { const x = toks[i]; if (!x.f) { i++; continue; } let j = i; while (j+1 < toks.length && toks[j+1].f === x.f && /^[\s\-,]*$/.test(t.slice(toks[j].e, toks[j+1].i))) j++; items.push({s:x.i, e:toks[j].e, f:x.f}); i = j+1; }
  items.sort((u,v) => u.s - v.s); let out = '', p = 0;
  for (const it of items) { if (it.s < p) continue; out += marks(esc(t.slice(p, it.s)));
    out += it.q ? `<span class="qm ${/nieczytel/i.test(it.q.txt)?'r':''} ${sk[it.q.key]?'sk':''} ${TQ===it.q.key?'sel':''}" data-q="${esc(it.q.key)}" title="Niepewny odczyt – dotknij">${esc(it.q.txt)}</span>` : `<span class="hl ${hlCls(a,it.f)} ${TF===it.f?'sel':''}" data-f="${it.f}" title="${esc(FS.find(f=>f.id===it.f)?.label||it.f)}">${esc(t.slice(it.s, it.e))}</span>`; p = it.e; }
  return {html: out + marks(esc(t.slice(p))), used: new Set(toks.filter(x => x.f).map(x => x.f))}; }
function setTxt(a, v){ const s2 = st(a.id); if (v === (a.tekst||'')) delete s2.text; else s2.text = v; save(); }
function qNext(a, pos){ const sk = S.acts[a.id]?.qs || {}, L = qList(txtOf(a)).filter(q => !sk[q.key]); const n = L.find(q => q.s >= pos) || L[0]; return n ? n.key : null; }
function nextTF(a, FS){ const s = st(a.id); const ids = FS.map(f => f.id); const order = TF_ORDER.filter(f => ids.includes(f)).concat(ids.filter(f => !TF_ORDER.includes(f))); const k = Math.max(0, order.indexOf(TF)); for (let n = 1; n <= order.length; n++) { const f = order[(k+n) % order.length]; const x = s.f[f]; if (!(x?.ok || x?.skip) && (clean(getv(a,f)) || (a.alts?.[f]||[]).length) && appl(a,f)) return f; } return null; }
function renderText(a){ const m = $('main'), s = st(a.id), FS = fieldsOf(a), md = S.tmode, t = txtOf(a); const fs = S.tfs || 18;
  const nm = a.kind ? a.title : `${a.year} · akt ${a.act} · ${a.ai ? a.ai.deceased_last_name+' '+a.ai.deceased_first_name : a.lubName||''}`;
  const modes = [['pola','Pola w tekście'],['czysty','Czysty tekst'],['popraw','Popraw tekst'],['lista','Lista pól']];
  let h = `<div class="card"><div class="hd"><b>${esc(nm)}</b><span class="muted">${s.done?'✓ zatwierdzony':'do weryfikacji'}${s.text!=null?' · tekst poprawiony':''}</span></div><div class="tm" style="margin-top:8px">${modes.map(([k,l]) => `<button class="sm ${md===k?'on':''}" data-tm="${k}">${l}</button>`).join('')}<button class="sm" data-tm="">✕ Pola</button></div>`;
  const edit = () => { if (!TF || !FS.some(f => f.id === TF)) return ''; const f = FS.find(f => f.id === TF), v = getv(a,TF), x = s.f[TF];
    return `<div class="ted"><b>${esc(f.label)}</b> ${tagsFor(a,TF,v,x)} <span class="muted">${x?.ok?'✓ '+(SRCN[x.src]||''):x?.skip?'pominięte':''}</span><input id="tfv" value="${esc(v)}" ${FT[TF]?`list="${FT[TF]==='s'?'dlS':'dlN'}"`:''} autocomplete="off"><div class="chips">${chipsFor(a,TF)}</div><div class="chips"><button class="chip btn-skip" id="tfSkip">Pomiń</button><button class="chip uncb ${x?.unc?'sel':''}" id="tfUnc">? niepewne</button><button class="chip" id="tfScan">🔍 na skanie</button><button class="chip btn-ok" id="tfOk">✓ Zatwierdź i dalej</button></div>${x?.unc?`<div class="nt"><input id="tfNote" placeholder="Opis niepewności" value="${esc(x.note||'')}"></div>`:''}</div>`; };
  const qAll = qList(t), qOpen = qAll.filter(q => !(s.qs||{})[q.key]);
  const qedit = () => { const q = qAll.find(q => q.key === TQ); if (!q) return ''; const cl = qClean(q.txt); const ctx = esc(t.slice(Math.max(0,q.s-60), q.s)) + '<span class="qm sel">' + esc(q.txt) + '</span>' + esc(t.slice(q.e, q.e+60));
    return `<div class="ted"><b>Niepewny odczyt</b><div class="muted" style="margin:4px 0">…${ctx}…</div><input id="qv" value="${esc(cl)}" autocomplete="off"><div class="chips"><button class="chip btn-skip" id="qSkip">Pomiń</button><button class="chip" id="qSave">✎ Zapisz zmianę</button><button class="chip btn-ok" id="qOk" ${cl?'':'disabled'}>✓ OK: „${esc(cl)}”</button></div></div>`; };
  const qbar = qAll.length ? `<div class="chips" style="margin-bottom:6px"><span class="muted">Niepewne w tekście: <b>${qOpen.length}</b> z ${qAll.length}</span>${qOpen.length?'<button class="sm" id="qFirst">▶ Pierwsze niepewne</button>':''}</div>` : '';
  const notes = (a.tnotes||[]).length ? `<div class="tnot">${esc(a.tnotes.join('\n'))}</div>` : '';
  if (md === 'czysty') {
    h += `<div class="chips" style="margin-bottom:6px"><button class="sm" id="tfMinus">A−</button><button class="sm" id="tfPlus">A+</button><button class="sm" id="tfCopy">Kopiuj tekst</button></div>${qbar}<div class="ttext" style="font-size:${fs}px">${hlHtml(a,t,FS,false).html}</div>${qedit()}<div class="tleg"><span class="mq">[?] niepewne – dotknij</span><span class="mr">[nieczytelne]</span><span class="mg">[...] brak</span></div>${notes}</div>`;
  } else if (md === 'popraw') {
    h += `<div class="muted" style="margin-bottom:6px">Edytuj tekst aktu (np. popraw słowa z [?]). Zapis automatyczny przy opuszczeniu pola; oryginał Haiku zostaje i można go przywrócić.</div><textarea id="tfArea" class="tarea" style="font-size:${fs}px">${esc(t)}</textarea><div class="chips" style="margin-top:6px"><button class="sm" id="tfMinus">A−</button><button class="sm" id="tfPlus">A+</button><button class="sm btn-ok" id="tfSave">Zapisz tekst</button><button class="sm" id="tfRest">↺ Przywróć oryginał</button></div>${notes}</div>`;
  } else if (md === 'lista') {
    const L = FS.filter(f => appl(a,f.id) || clean(getv(a,f.id))).map(f => { const v = clean(getv(a,f.id)); const c = v ? hlCls(a,f.id) : 'blank'; return `<button class="chip ${c==='ok'?'sel':''} hl ${c} ${TF===f.id?'sel':''}" data-f="${f.id}"><small>${esc(f.label)}:</small> ${v?esc(v):'<i>brak</i>'}</button>`; }).join(' ');
    h += `<div class="ttext" style="font-size:${fs}px;line-height:2.4">${L}</div><div class="tleg"><span>zielone — zatwierdzone</span><span>bursztyn — niepewne</span><span>czerwone — AI≠Lubgens</span><span>niebieskie — do sprawdzenia</span></div>${edit()}<details style="margin-top:8px" ${TQ?'open':''}><summary class="muted">Pełny tekst (niepewne: ${qOpen.length})</summary><div class="ttext" style="font-size:${fs}px">${hlHtml(a,t,FS,false).html}</div>${qedit()}</details>${notes}</div>`;
  } else {
    const r = hlHtml(a,t,FS,true); const miss = FS.filter(f => (clean(getv(a,f.id)) ) && !r.used.has(f.id) && appl(a,f.id));
    h += `${qbar}<div class="ttext" style="font-size:${fs}px">${r.html}</div>${qedit()}<div class="tleg"><span style="background:var(--lubb)">zatwierdzone</span><span style="background:var(--bzb)">niepewne</span><span style="background:var(--badb)">AI≠Lubgens</span><span style="background:var(--aib)">do sprawdzenia</span><span class="mq">[?]</span></div>
      ${miss.length ? `<div class="muted">Pola bez miejsca w tekście (daty, wiek, godzina…):</div><div class="chips">${miss.map(f => `<button class="chip hl ${hlCls(a,f.id)} ${TF===f.id?'sel':''}" data-f="${f.id}"><small>${esc(f.label)}:</small> ${esc(clean(getv(a,f.id)))}</button>`).join('')}</div>` : ''}${edit()}${notes}</div>`;
  }
  m.innerHTML = warnHtml(a) + h;
  m.querySelectorAll('[data-tm]').forEach(b => b.onclick = () => { S.tmode = b.dataset.tm; save(); renderAct(); window.scrollTo(0,0); });
  m.querySelectorAll('.hl[data-f]').forEach(b => b.onclick = () => { TF = b.dataset.f; renderAct(); focusField(a, TF); const e = m.querySelector('.ted'); if (e) e.scrollIntoView({block:'nearest'}); });
  m.querySelectorAll('.qm[data-q]').forEach(b => b.onclick = () => { TQ = b.dataset.q; TF = null; renderAct(); const e = $('main').querySelector('.ted'); if (e) e.scrollIntoView({block:'nearest'}); });
  if ($('qFirst')) $('qFirst').onclick = () => { TQ = qOpen[0].key; TF = null; renderAct(); const e = $('main').querySelector('.ted'); if (e) e.scrollIntoView({block:'nearest'}); };
  if ($('qv')) { const q = qAll.find(q => q.key === TQ); const apply = v => { setTxt(a, t.slice(0,q.s) + v + t.slice(q.e)); TQ = qNext(a, q.s); renderAct(); renderList(); toast('Zapisano'); };
    $('qOk').onclick = () => apply(qClean(q.txt)); $('qSave').onclick = () => { const v = $('qv').value.trim(); if (v === qClean(q.txt) && !v) { toast('Wpisz odczyt'); return; } apply(v); };
    $('qSkip').onclick = () => { const s2 = st(a.id); (s2.qs = s2.qs || {})[q.key] = 'skip'; save(); TQ = qNext(a, q.s + 1); renderAct(); }; }
  const adv = () => { const n = nextTF(a, FS); TF = n; renderAct(); renderList(); if (n) focusField(a, n); };
  if ($('tfv')) { const f = TF; $('tfv').onchange = () => { commit(a, f, $('tfv').value.trim(), 'edit'); renderAct(); renderList(); };
    m.querySelectorAll('.ted .chip[data-f]').forEach(b => b.onclick = () => { commit(a, b.dataset.f, b.dataset.v, b.dataset.s); adv(); });
    $('tfOk').onclick = () => { const v = $('tfv').value.trim(), c = m.querySelector('.ted .chip.sel[data-f]'); commit(a, f, v, c ? c.dataset.s : (st(a.id).f[f]?.src || 'edit')); adv(); };
    $('tfSkip').onclick = () => { commit(a, f, getv(a,f), 'ai', {skip:true, ok:false}); adv(); };
    $('tfUnc').onclick = () => { const x = st(a.id).f[f] || {v:getv(a,f), src:(a.ai?.[f]?'ai':'lub'), ok:false}; x.unc = !isUnc(a,f); st(a.id).f[f] = x; save(); renderAct(); };
    $('tfScan').onclick = () => { if (!focusField(a, f)) toast('Brak ramki tego pola na skanie'); };
    if ($('tfNote')) $('tfNote').onchange = () => { const x = st(a.id).f[f]; if (x) { x.note = $('tfNote').value.trim(); save(); } }; focusField(a, f); }
  if ($('tfMinus')) { $('tfMinus').onclick = () => { S.tfs = Math.max(13, fs-2); save(); renderAct(); }; $('tfPlus').onclick = () => { S.tfs = Math.min(30, fs+2); save(); renderAct(); }; }
  if ($('tfCopy')) $('tfCopy').onclick = async () => { try { await navigator.clipboard.writeText(t); toast('Skopiowano'); } catch(e) { toast('Nie można skopiować'); } };
  if ($('tfArea')) { const sv = () => { const v = $('tfArea').value; const s2 = st(a.id); if (v === (a.tekst||'')) delete s2.text; else s2.text = v; save(); }; $('tfArea').onchange = sv; $('tfSave').onclick = () => { sv(); toast('Zapisano tekst'); renderAct(); }; $('tfRest').onclick = () => { delete st(a.id).text; save(); toast('Przywrócono oryginał'); renderAct(); }; }
}
$('bText').onclick = () => { W.on = false; document.body.classList.remove('wz'); S.tmode = S.tmode ? '' : 'pola'; save(); if (S.tmode && !curAct()?.tekst) toast('Ta pozycja nie ma pełnego tekstu – wybierz akt z listy (np. 43/26)'); renderAct(); window.scrollTo(0,0); };
$('mTxt').onclick = () => { const L = ['# Teksty aktów zmarłych (Haiku AI v1, z poprawkami z narzędzia)', '']; D.acts.filter(a => a.tekst).forEach(a => { const ch = S.acts[a.id]?.text != null; L.push(`## ${a.id}${ch ? ' · POPRAWIONY' : ''}`, '> ' + txtOf(a), ''); if (ch) L.push('Oryginał Haiku:', '> ' + a.tekst, ''); }); dl('ZGONY_teksty_poprawione.md', L.join('\n'), 'text/markdown'); };
document.addEventListener('click', e => { if (!e.target.closest('#menu') && !e.target.closest('#bMenu')) $('menu').style.display = 'none'; });
function init(){ $('zRf').classList.toggle('on', !!S.noroi); renderTabs(); renderList(); if (!S.cur || !AM[S.cur]) S.cur = (D.acts.find(a => a.ai) || D.acts[0])?.id; renderList(); renderAct(); showScan(); }
loadExtra().then(init);
</script></body></html>
