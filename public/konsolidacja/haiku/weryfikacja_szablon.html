<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Weryfikacja zgonów AI</title>
<style>
:root{--bg:#f2f1ed;--card:#fcfbf9;--ink:#23282e;--mut:#6b7078;--line:#dad7ce;--ai:#43648c;--aib:#e5ebf2;--lub:#4b7a5d;--lubb:#e6eee8;--bz:#966a2e;--bzb:#f1eadc;--bad:#9f4a45;--badb:#f2e3e1;--ok:#4b7a5d;--acc:#3d4d63}
@media(prefers-color-scheme:dark){:root{--bg:#15171a;--card:#1d2024;--ink:#e4e2dd;--mut:#9b9ea2;--line:#34383d;--aib:#243243;--lubb:#1f3126;--bzb:#382f1f;--badb:#3b2624;--ai:#93b1d4;--lub:#8fbf9f;--bz:#d0a769;--bad:#d89b95;--ok:#8fbf9f;--acc:#93a8c6}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
header h1{font-size:15px;margin:0;flex:1 1 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{min-height:34px;padding:5px 9px;font-size:14px}
#prog{font-size:13px;color:var(--mut)}
#list{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--card);border-bottom:1px solid var(--line)}
#list button{min-width:48px;padding:6px 8px;min-height:38px;flex:0 0 auto}
#list button.cur{outline:3px solid var(--acc)}
#list button.ready{background:var(--lubb);border:2px solid var(--lub)}#list button.done{background:var(--lubb);border-color:var(--lub);font-weight:600}#list button.part{background:linear-gradient(to top,var(--bzb) calc(var(--p)*1%),var(--card) calc(var(--p)*1%));border-color:var(--bz)}
#list button.diff{border-color:var(--bad);border-width:2px}
#list button.noai{opacity:.55}#list #sbT{display:none}
@media (min-width:1000px){#list #sbT{display:block}}
.tabs{display:flex;gap:6px;padding:6px 10px;flex-wrap:nowrap;overflow-x:auto;background:var(--card)}.tabs button{flex:0 0 auto}
.tabs button.on{background:var(--acc);color:#fff}
#view{position:sticky;top:0;z-index:25;height:42vh;background:#222;overflow:hidden;touch-action:none}
#view.l{height:68vh}#view.s{height:28vh}#view.xl{position:fixed;inset:0;z-index:50;height:100vh}
body.wz header,body.wz .tabs,body.wz #list,body.wz #bar{display:none}body.wz #view{height:40vh}body.wz #view.l{height:60vh}body.wz #view.s{height:26vh}
#layer{position:absolute;left:0;top:0;transform-origin:0 0}
#layer img{display:block;max-width:none;user-select:none;-webkit-user-drag:none}
#roi{position:absolute;border:1px solid rgba(245,158,11,.65);background:none;pointer-events:none}
#vbar{position:absolute;right:6px;top:6px;display:flex;gap:5px;flex-direction:row;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 12px);z-index:3}
#vbar button{background:rgba(255,255,255,.9);color:#111;min-height:38px;min-width:38px;padding:3px 7px}
#vbar button.on{background:#f59e0b}
#noimg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#ddd;text-align:center;padding:20px}
main{padding:10px;max-width:760px;margin:0 auto 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.hd{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.hd b{font-size:18px}.muted{color:var(--mut);font-size:13px}
.row{border-top:1px solid var(--line);padding:8px 0}
.row:first-of-type{border-top:0}
.lab{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-bottom:3px}
.row input,.row textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:17px}
.row.ok input{border-color:var(--ok);background:var(--lubb)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{border-radius:999px;padding:7px 12px;min-height:38px;font-size:15px;border:1px solid;display:inline-flex;gap:6px;align-items:center;max-width:100%;text-align:left}
.chip small{opacity:.75;font-size:11px}
.chip.ai{background:var(--aib);border-color:var(--ai);color:var(--ai)}
.chip.lub{background:var(--lubb);border-color:var(--lub);color:var(--lub)}
.chip.bz{background:var(--bzb);border-color:var(--bz);color:var(--bz)}
.chip.sel{box-shadow:0 0 0 3px var(--acc)}
.tag{font-size:11px;border-radius:6px;padding:1px 6px;margin-left:4px}
.tag.eq{background:var(--lubb);color:var(--lub)}.tag.ne{background:var(--badb);color:var(--bad)}.tag.ap{background:var(--bzb);color:var(--bz)}.tag.q{background:var(--bzb);color:var(--bz)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px}
#bar{gap:5px}#bar button{flex:1;min-width:0;min-height:52px;padding:4px 2px}#bar #bOk{flex:2.6;font-size:16px;font-weight:700}#bar #bPrev,#bar #bNext,#bar #bWiz,#bar #bMenu2,#bar #bText2{flex:.62}#bar #bSkip{flex:1.2}
#bar #bOk.rdy{background:var(--lub);color:#fff;border-color:var(--lub)}
#fab{display:none;position:fixed;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:45;width:56px;height:56px;border-radius:50%;font-size:24px;box-shadow:0 4px 14px rgba(0,0,0,.35);background:var(--acc);color:#fff;border:0}body.textmode #fab{display:block}body:has(#tsheet) #fab{display:none}#tsheet .tnav #tMenu{min-width:48px}.row.act{outline:3px solid var(--acc);border-radius:10px;padding-left:6px;padding-right:6px}
details{margin-top:6px}details pre{white-space:pre-wrap;font-size:13px;background:var(--bg);padding:8px;border-radius:8px}
#menu{display:none;position:fixed;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));top:auto;max-height:78vh;overflow:auto;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);width:260px}
#menu button{display:block;width:100%;margin:4px 0;text-align:left;min-height:46px}
#wbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
body.wz #wbar{display:flex}#wbar button{flex:1;padding:9px 4px}
.wz-card .big{font-size:22px;font-weight:600;margin:4px 0}.wz-card .chip{font-size:18px;min-height:48px;padding:9px 16px}
.wz-card input,.wz-card textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:19px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}
.mini b{color:var(--ink);font-weight:500}.mini button{min-height:30px;padding:2px 10px;font-size:13px}
.chip.akt{background:#ede9fe;border-color:#6d28d9;color:#6d28d9}.chip.uncb{background:var(--bzb);border-color:var(--bz);color:var(--bz)}.chip.uncb.sel{box-shadow:0 0 0 3px var(--bz)}
.nt{margin-top:5px}.nt input{padding:7px;font-size:15px}
button.btn-ok,.chip.btn-ok{background:#15803d!important;color:#fff!important;border-color:#15803d!important}
button.btn-skip,.chip.btn-skip{background:#ea580c!important;color:#fff!important;border-color:#ea580c!important}
.warn{border:2px solid var(--bad);background:var(--badb);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:10px;z-index:70;display:none;max-width:90%}

/* tryby tekstowe */
#bText.on,#bText2.on{background:var(--acc);color:#fff;border-color:var(--acc)}
body.textmode #bar{display:none}body.textmode main{max-width:1000px;margin-bottom:24px}
.tm{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tm button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ttext{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:2.1;overflow-wrap:anywhere}
.hl{border-bottom:3px solid var(--ai);background:var(--aib);border-radius:4px;padding:1px 2px;cursor:pointer}
.hl.ok{background:var(--lubb);border-bottom-color:var(--lub)}.hl.un{background:var(--bzb);border-bottom-color:var(--bz)}.hl.cf{background:var(--badb);border-bottom-color:var(--bad)}.hl.sk{background:transparent;border-bottom:3px dotted var(--mut)}
.hl.sel{outline:3px solid var(--acc)}
.mq{background:var(--bzb);color:var(--bz);border-radius:4px;padding:0 2px;font-weight:600}.mr{background:var(--badb);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:600}.mg{color:var(--mut)}
.tleg{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}.tleg span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.ted{margin-top:10px;border:2px solid var(--acc);border-radius:12px;background:var(--card);padding:10px}.ted input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;margin:6px 0}
.qm{background:var(--bzb);border-bottom:3px solid var(--bz);border-radius:4px;padding:1px 3px;font-weight:600;cursor:pointer;color:var(--ink)}.qm.r{background:var(--badb);border-bottom-color:var(--bad)}.qm.sk{background:transparent;border-bottom:3px dotted var(--mut);font-weight:400}.qm.sel{outline:3px solid var(--acc)}
#tsheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--acc);box-shadow:0 -4px 14px rgba(0,0,0,.25);max-height:46vh;overflow:auto;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
#tsheet .ted{margin:0;border:0;padding:4px 0}#tsheet .tnav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}#tsheet .tnav button{min-height:36px;padding:2px 16px}
#tsheet .act3{display:flex;gap:8px;margin-top:8px}#tsheet .act3 button{min-height:54px;flex:1;font-size:16px;font-weight:600}#tsheet .act3 .btn-ok{flex:2.2}#tsheet .act3 .uncb{background:var(--bzb);border-color:var(--bz);color:var(--bz);font-weight:500}
#tsheet .ted input{margin:4px 0;padding:9px;font-size:17px}#tsheet .chip{min-height:44px}
body.textmode main{margin-bottom:330px}body.textmode #view{height:30vh}body.textmode #view.l{height:48vh}body.textmode #view.s{height:20vh}
.rep{margin-bottom:10px}.ri{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-radius:10px;padding:7px 9px;margin-bottom:5px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.ri.err{border-color:var(--bad);background:var(--badb)}.ri.warn{border-color:var(--bz);background:var(--bzb)}.ri.ig{opacity:.5}.ri a{color:var(--acc);text-decoration:underline;cursor:pointer}.ri button{flex:0 0 auto;min-height:30px;padding:2px 9px;font-size:12px}
#repov,#histov{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}.ovl{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}.rep-hd{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}.rep-body{padding:8px 10px 40px;max-width:760px;margin:0 auto}
#list button.rp-err::after,#list button.rp-warn::after{content:'!';color:#fff;border-radius:8px;font-size:10px;padding:0 4px;margin-left:3px}#list button.rp-err::after{background:var(--bad)}#list button.rp-warn::after{background:#d97706}
.dw{margin:6px 0}.dwr{display:flex;flex-wrap:wrap;gap:8px}.dwg{display:inline-flex;align-items:stretch}.dwg button{min-height:44px;min-width:40px;padding:0 8px;font-size:20px;border-radius:0}.dwg button:first-child{border-radius:10px 0 0 10px}.dwg button:last-child{border-radius:0 10px 10px 0}
.dwi{border:1px solid var(--line);background:var(--bg);text-align:center;padding:6px 4px;font-size:17px;min-height:44px;border-radius:0}input.dwi[data-p=d]{width:52px}input.dwi[data-p=y]{width:68px}select.dwi{width:118px}.dwj.on{background:var(--acc);color:#fff;border-color:var(--acc)}.dwj{margin-top:4px;min-height:34px}
.dwl{font-size:13px;color:var(--mut);margin-top:4px}
#tsheet .dwg button{min-height:40px}#tsheet .dwi{min-height:40px}
.tnot{font-size:13px;color:var(--mut);margin-top:8px;white-space:pre-wrap}
.tarea{width:100%;min-height:42vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px;font:17px/1.6 system-ui,sans-serif}

/* ===== układ na komputer (szeroki ekran): skan po lewej na całą wysokość, pola/audyt po prawej; telefon bez zmian ===== */
@media (min-width:1000px){
 :root{--vw:57vw}
 #top{position:sticky;top:0;z-index:40;background:var(--card);box-shadow:0 1px 0 var(--line)}
 #view:not(.xl){position:fixed;left:0;top:var(--tt,130px);width:var(--vw);height:auto!important;bottom:0;z-index:20}
 main{margin:0 0 0 var(--vw);max-width:none!important;padding:14px 18px 110px}
 body.textmode main{margin-bottom:0;padding-bottom:340px}
 #bar,#wbar,#tsheet{left:var(--vw);right:0}
 #bar{padding-left:14px;padding-right:14px}
 body.wz #view:not(.xl){top:0}
 body.wz main{padding-top:14px}
 .card{padding:14px 16px}
 .row input,.row textarea{font-size:16px;padding:8px 10px}
 .chip{min-height:34px;padding:5px 11px;font-size:14px}
 button{min-height:36px}
 #bar button{min-height:46px}
 #toast{left:calc(var(--vw) + (100vw - var(--vw))/2)}
 /* lista aktów: pionowy pasek po lewej (wąski = numery, szeroki = rocznik / nr / nazwisko imię) */
 :root{--sw:58px}body.sbx{--sw:280px}
 #list{position:fixed;left:0;top:var(--tt,130px);bottom:0;width:var(--sw);flex-direction:column;flex-wrap:nowrap;overflow-x:hidden;overflow-y:auto;padding:6px 5px;gap:4px;border-bottom:0;border-right:1px solid var(--line);z-index:35}
 #list button{min-width:0;width:100%;min-height:34px;padding:4px 2px;flex:0 0 auto}
 #list #sbT{position:sticky;top:-6px;z-index:2;background:var(--card);font-size:15px}
 #list .syh{font-weight:700;font-size:13px;padding:6px 4px 2px;color:var(--mut);border-bottom:1px solid var(--line);margin-top:4px}
 #list button.srow{text-align:left;display:flex;gap:8px;align-items:baseline;padding:4px 8px;white-space:nowrap;overflow:hidden}
 #list button.srow b{min-width:30px;text-align:right}#list button.srow span{overflow:hidden;text-overflow:ellipsis}
 #view:not(.xl){left:var(--sw);width:calc(var(--vw) - var(--sw))}
}

/* ===== wizualizacja stonowana: wyciszona paleta, delikatne tła, małe zaokrąglenia, bez zabawkowych kolorów ===== */
button{border-radius:8px}.card{border-radius:10px}.chip{border-radius:8px}
.tabs button,#list button,#bar button,#menu button{border-radius:8px}
.row input,.row textarea{border-radius:8px}
#list button{position:relative}
#list button.done{background:linear-gradient(to right,var(--lubb),var(--card));border-color:var(--line);font-weight:500;box-shadow:inset 3px 0 0 var(--lub)}
#list button.ready{background:linear-gradient(to right,var(--aib),var(--card));border:1px solid var(--line);box-shadow:inset 3px 0 0 var(--ai)}
#list button.part{background:linear-gradient(to top,var(--bzb) calc(var(--p)*1%),var(--card) calc(var(--p)*1%));border-color:var(--line)}
#list button.diff{border:1px solid var(--line)}#list button.diff::before{content:'';position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
#list button.cur{outline:2px solid var(--acc);outline-offset:-1px}
.row.ok input{background:var(--lubb);border-color:var(--line);border-left:4px solid var(--ok)}
.row.ok .lab span:last-child{color:var(--ok)}
.row.act{outline:2px solid var(--acc)}
.chip.ai,.chip.lub,.chip.bz,.chip.akt{border-color:var(--line)}
.chip.ai{color:var(--ink);box-shadow:inset 3px 0 0 var(--ai)}.chip.lub{color:var(--ink);box-shadow:inset 3px 0 0 var(--lub)}.chip.bz{color:var(--ink);box-shadow:inset 3px 0 0 var(--bz)}
.chip.akt{background:var(--card);color:var(--ink);box-shadow:inset 3px 0 0 #6b5b95}
.chip.sel{outline:2px solid var(--acc);outline-offset:1px}
.chip small{color:var(--mut);opacity:1}
.chip.uncb{background:var(--bzb);border-color:var(--line);color:var(--bz)}.chip.uncb.sel{box-shadow:none}
.tag{border-radius:5px;font-weight:500}
.chip.btn-ok,button.sm.btn-ok:not(#hDone):not(#tDone){background:var(--card)!important;color:var(--ok)!important;border-color:var(--ok)!important;font-weight:600}
button.btn-skip,.chip.btn-skip{background:var(--card)!important;color:var(--bz)!important;border-color:var(--bz)!important}
#bar #bOk,#wbar .btn-ok,#tsheet .act3 .btn-ok,#hDone,#tDone.btn-ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
#bar #bOk.rdy{background:var(--lub)!important}
body:not(.dk) .tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#vbar button.on{background:#c9a15a}
#roi{border-color:rgba(190,150,80,.7)}
.warn{background:var(--badb);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px}
details.tsug{background:var(--bzb)!important;border:1px solid var(--line)!important;border-left:4px solid var(--bz)!important;border-radius:8px!important}
.card[style*="--lubb"]{background:var(--lubb)!important;border:1px solid var(--line)!important;border-left:4px solid var(--lub)!important}
@media(prefers-color-scheme:dark){button.on,button.pri,.tabs button.on,.sm.on,#bText.on,.tm .on{color:#10151b!important}#bar #bOk,#wbar .btn-ok,#tsheet .act3 .btn-ok,#hDone,#tDone.btn-ok,#bar #bOk.rdy{color:#10151b!important}}
</style></head><body>
<div id="menu">
 <button id="mCsv">⬇ Eksport CSV (zweryfikowane)</button>
 <button id="mAuto">💾 Autozapis CSV do pliku <small id="autoSt" style="opacity:.7"></small></button>
 <button id="mLog">⬇ Eksport logu zmian</button>
 <button id="mRoi">⬇ Eksport ROI (JSON)</button>
 <button id="mHist">🕘 Historia zmian (cofanie)</button>
 <button id="mSpell">🔤 Pisownia – warianty nazwisk i imion</button>
 <button id="mModel">⬇ Eksport modelu (osoby, zdarzenia, relacje – JSON)</button>
 <button id="mRel">⬇ Eksport powiązań rodzinnych (CSV)</button>
 <button id="mRep">⚠ Raport spójności</button>
 <button id="mFr">▭ Pokaż / ukryj zaznaczenia na skanie</button>
 <button id="mTop">↑ Lista aktów i filtry (do góry)</button>
 <button id="mOff">✕ Zamknij tryb tekstu / kreator</button>
 <button id="mTxt">⬇ Eksport tekstów aktów (MD, z poprawkami)</button>
 <button id="mFixTxt">✎ Dopasuj teksty aktów do zatwierdzonych pól</button>
 <button id="mSave">⬇ Wszystko w jednym pliku (kopia JSON: pola, tekst, rejestr, ustawienia)</button>
 <button id="mVerOvw">⬆ Wczytaj CSV i NADPISZ moje (stan = plik)</button>
 <button id="mVer">⬆ Wczytaj zweryfikowany CSV (jako zatwierdzone)</button>
 <button id="mKid">👶 Ustaw „dziecko” u nieletnich (stan cywilny)</button>
 <button id="mBase">📁 Folder główny skanów (ZG)…</button>
 <button id="mFix">📖 Eksport słownika poprawek (JSON)</button>
 <button id="mLoad">⬆ Wczytaj kopię roboczą</button>
 <button id="mAi">⬆ Dołącz CSV z odczytem AI</button>
 <button id="mScan">🖼 Dodaj skany z telefonu</button>
 <button id="mRej">⬇ Eksport rejestru i protokołów (CSV)</button>
 <button id="mReset">🗑 Wyczyść moje wybory</button>
