<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weryfikacja małżeństw – Blinów</title>
<style>
:root{--bg:#f4f2ee;--pn:#fbfaf7;--ln:#d9d4c9;--tx:#2b2a27;--mu:#7a7468;--ac:#4f6f8f;--ok:#5f8a63;--okb:#e3ede2;--un:#b0803a;--unb:#f4ead6;--er:#a85a50;--erb:#f3dfdb;--in:#fff;--sb:#ece8e0}
@media (prefers-color-scheme:dark){:root:not([data-th=light]){--bg:#1f2022;--pn:#272829;--ln:#3a3b3d;--tx:#e6e3dc;--mu:#9a958a;--ac:#8fb0d0;--ok:#86b28a;--okb:#27352a;--un:#d2a65c;--unb:#3a3022;--er:#d58a80;--erb:#3b2724;--in:#1d1e1f;--sb:#232425}}
:root[data-th=dark]{--bg:#1f2022;--pn:#272829;--ln:#3a3b3d;--tx:#e6e3dc;--mu:#9a958a;--ac:#8fb0d0;--ok:#86b28a;--okb:#27352a;--un:#d2a65c;--unb:#3a3022;--er:#d58a80;--erb:#3b2724;--in:#1d1e1f;--sb:#232425}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--pn);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}.sp{flex:1}
button,select{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:5px 10px;cursor:pointer}button:hover{border-color:var(--ac)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button.ok{background:var(--okb);border-color:var(--ok);color:var(--ok)}
#app{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 50px)}
#sb{background:var(--sb);border-right:1px solid var(--ln);overflow:auto;position:sticky;top:50px;height:calc(100vh - 50px);padding:6px}
.yh{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);padding:8px 6px 3px}
.sr{display:flex;gap:6px;align-items:baseline;padding:4px 7px;border-radius:7px;cursor:pointer;border-left:3px solid transparent;font-size:13px}.sr:hover{background:var(--pn)}.sr.cur{background:var(--pn);border-left-color:var(--ac);font-weight:600}
.sr .n{width:24px;text-align:right;color:var(--mu)}.sr.d{border-left-color:var(--ok)}.sr.w{border-left-color:var(--un)}
#main{display:grid;grid-template-columns:minmax(380px,46%) 1fr;gap:12px;padding:12px;align-items:start}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px}
#view{position:sticky;top:60px;height:calc(100vh - 78px);display:flex;flex-direction:column;overflow:hidden}
#vbar{display:flex;gap:6px;padding:6px 8px;border-bottom:1px solid var(--ln);flex-wrap:wrap;align-items:center}
#vp{flex:1;position:relative;overflow:hidden;background:#111;cursor:grab;touch-action:none}#vp img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none;user-select:none;-webkit-user-drag:none}
#ov{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}#ov b{position:absolute;border:3px solid;border-radius:3px;box-sizing:border-box}#ov b.p{border-color:#e0b800;background:rgba(224,184,0,.12)}#ov b.a{border-color:#a24fd0;background:rgba(162,79,208,.12)}#ov b.f{border-color:#4f9fd0;background:rgba(79,159,208,.08)}
#vmiss{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#ccc;text-align:center;padding:20px}
#txt{max-height:22%;overflow:auto;padding:8px 10px;border-top:1px solid var(--ln);font-size:12.5px;color:var(--mu)}
#form{padding:10px 12px}
.grp{margin:0 0 12px}.grp h3{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu);font-weight:600;border-bottom:1px solid var(--ln);padding-bottom:3px}
.f{display:grid;grid-template-columns:1fr auto;gap:3px 6px;align-items:start;padding:5px 0;border-radius:6px;border-bottom:1px dashed var(--ln)}
.f label{grid-column:1/-1;color:var(--mu);font-size:12px}.f input,.f textarea{width:100%;padding:7px 9px;border:1px solid var(--ln);border-radius:8px;background:var(--in);color:var(--tx);font:inherit}.f textarea{resize:vertical;line-height:1.4}
.f.ok input,.f.ok textarea{background:var(--okb);border-color:var(--ok)}.f.un input,.f.un textarea{background:var(--unb);border-color:var(--un)}
.ins{display:grid;grid-template-columns:repeat(var(--n,1),1fr);gap:6px}.cell{min-width:0}.tgw{display:block;min-height:0}
.f .b{display:flex;gap:4px}.f .b button{padding:2px 9px;font-size:13px;border-radius:7px}.f .b .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ex,.chps,.ntw,.dw{grid-column:1/-1}.chps{display:flex;flex-wrap:wrap;gap:5px}.chps:empty,.ntw:empty{display:none}.ex{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.nt input,.ntw input{font-size:13px}
.pb{border-left:4px solid var(--c,var(--ln));padding:4px 0 4px 10px;margin:0 0 14px;border-radius:2px}.pb.g{--c:#5b7fa6}.pb.b{--c:#b06f8c}.pb.w{--c:#8a8a80}.pb.mg{--c:#b0803a}.pb.akt{--c:var(--ac)}.pb.sub{margin:8px 0 6px 2px;--c:inherit;border-left-width:3px;border-left-style:dotted;border-left-color:inherit;padding-left:8px}
.pb.g .pb.sub{border-left-color:#5b7fa6}.pb.b .pb.sub{border-left-color:#b06f8c}
.pt{font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--c,var(--mu));margin:2px 0 4px}.pb.sub>.pt{font-size:11.5px;font-weight:600;color:var(--mu)}
.pb.g>.pt{color:#5b7fa6}.pb.b>.pt{color:#b06f8c}
.stb{display:flex;gap:6px}.stb button{padding:6px 14px;border-radius:8px}.stb .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.warn{background:var(--erb);border:1px solid var(--er);color:var(--er);border-radius:8px;padding:6px 10px;margin:0 0 10px;font-size:12.5px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid var(--ln);color:var(--mu);margin-left:6px}.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--okb)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--pn);color:var(--tx);max-width:760px;width:92%}dialog::backdrop{background:rgba(0,0,0,.45)}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--ln);padding:3px 6px;text-align:left}
.yn{display:inline-flex;gap:4px}.yn button{padding:5px 12px;border-radius:8px;opacity:.8}.yn .y.on{background:var(--okb);border-color:var(--ok);color:var(--ok);opacity:1;font-weight:600}.yn .n.on{background:var(--erb);border-color:var(--er);color:var(--er);opacity:1;font-weight:600}.yn .z.on{background:var(--sb);border-color:var(--mu);color:var(--mu);opacity:1;font-weight:600}
.chp{grid-column:2/4;display:flex;flex-wrap:wrap;gap:5px;margin:1px 0 3px}.chip{border:1px solid var(--ln);border-radius:8px;padding:4px 9px;min-height:32px;font-size:13px;display:inline-flex;gap:5px;align-items:center}.chip small{color:var(--mu);font-size:10.5px}.chip.bz{border-color:var(--ac)}.chip.ai{border-color:var(--un);background:var(--unb)}.chip.akt{border-color:#6b5b95}.chip.fx{border-color:var(--ok)}
.tg{font-size:10.5px;padding:0 6px;border-radius:8px;border:1px solid var(--ln);margin-left:3px}.tg.ok{color:var(--ok);border-color:var(--ok)}.tg.nw{color:var(--un);border-color:var(--un);background:var(--unb)}
.dw{grid-column:2/4;margin:2px 0}.dwr{display:flex;flex-wrap:wrap;gap:8px}.dwg{display:inline-flex}.dwg button{min-height:40px;min-width:38px;padding:0 8px;font-size:18px;border-radius:0}.dwg button:first-child{border-radius:8px 0 0 8px}.dwg button:last-child{border-radius:0 8px 8px 0}.dwi{border:1px solid var(--ln);background:var(--in);color:var(--tx);text-align:center;padding:5px 4px;font:inherit;min-height:40px;border-radius:0}input.dwi[data-p=d]{width:48px}input.dwi[data-p=y]{width:64px}select.dwi{width:112px}.dwl{font-size:12.5px;color:var(--mu);margin-top:3px}
.phone{display:none}#scrim,#pbar,#vh{display:none}
@media(max-width:1000px){
 :root{--hh:48px;--vhp:36vh}
 header{position:fixed;left:0;right:0;top:0;padding:5px 8px;gap:6px}header h1{display:none}#prog{font-size:11px}#bImp,#bReg{display:none}
 header button{padding:6px 9px}
 #app{display:block}
 #sb{position:fixed;left:0;top:0;bottom:0;width:80vw;max-width:310px;z-index:70;height:auto;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.35);padding:8px 6px 80px}
 body.sbo #sb{transform:none}body.sbo #scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:65}
 .sr{padding:9px 8px;font-size:15px}.sr .n{width:28px}
 #main{display:block;padding:8px 8px 90px;padding-top:calc(var(--hh) + var(--vhp) + 14px)}
 body.vmin #main{padding-top:calc(var(--hh) + 46px)}
 #view{position:fixed;left:6px;right:6px;top:calc(var(--hh) + 4px);height:var(--vhp);z-index:40;box-shadow:0 6px 22px rgba(0,0,0,.4)}
 body.vmin #view{height:38px}body.vmin #vp,body.vmin #txt,body.vmin #vh{display:none!important}body.vmin #vbar>:not(.phone){display:none}
 #vh{display:flex;align-items:center;justify-content:center;height:18px;cursor:ns-resize;touch-action:none;background:var(--sb);border-top:1px solid var(--ln)}#vh i{width:44px;height:4px;border-radius:2px;background:var(--mu)}
 #txt{display:none}body.vtx #txt{display:block;max-height:30%}
 .phone{display:inline-block}
 #vbar button{padding:6px 10px;min-height:32px}
 #vinfo{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .f{padding:6px 0}
 .yn button{min-height:44px;font-size:15px}.f input,.f textarea{font-size:16px;padding:9px 10px}.f input{min-height:44px}.stb button{min-height:44px}.f .b button{min-height:44px;min-width:40px;font-size:16px}
 #form h2{font-size:15px!important}
 #pbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;gap:6px;padding:7px 8px calc(7px + env(safe-area-inset-bottom));background:var(--pn);border-top:1px solid var(--ln)}
 #pbar button{flex:1;min-height:48px;font-size:15px}#pbar #pOk{flex:2;font-weight:600}
 .cols2{grid-template-columns:1fr}
}
</style></head><body>
<header><h1>Weryfikacja małżeństw · Blinów</h1><span id="prog" class="tag"></span><span class="sp"></span>
<button id="bImp">Wczytaj CSV…</button><button id="bExp" class="pri">Zapisz CSV</button><button id="bReg">Rejestry</button><button id="bMenu">Więcej…</button><input type="file" id="fl" accept=".csv,.json" hidden></header>
<div id="scrim"></div><div id="pbar"><button id="pSb">☰ Akty</button><button id="pPr">‹</button><button id="pOk" class="ok">✓ Zatwierdź</button><button id="pNx">›</button></div>
<div id="app"><aside id="sb"></aside><div id="main">
<section id="view" class="card"><div id="vbar"><button id="vAkt">Akt</button><button id="vAll">Cały skan</button><button id="vMk" title="pieczątki i adnotacje">Pieczątki/adn. ▸</button><button id="vP">+</button><button id="vM">−</button><span id="vinfo" class="tag"></span><span class="sp"></span><button id="vTx" class="phone" title="tekst odczytu">Aa</button><button id="vMin" class="phone" title="zwiń/rozwiń skan">▾</button></div>
<div id="vp"><img id="im" alt=""><div id="ov"></div><div id="vmiss"></div></div><div id="txt"></div><div id="vh"><i></i></div></section>
<section id="form" class="card"></section></div></div>
<dialog id="dg"><div id="dgc"></div><p style="text-align:right"><button onclick="document.getElementById('dg').close()">Zamknij</button></p></dialog>
<script>
const D = /*DATA*/null;
const KEY = 'wm1'; const PH = () => matchMedia('(max-width:1000px)').matches;
const $ = id => document.getElementById(id);
let S; try { S = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {} if (!S) S = {acts:{}, cur:null};
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
const st = id => S.acts[id] || (S.acts[id] = {f:{}, done:false});
const clean = v => (v == null ? '' : String(v)).trim();
const normPl = v => clean(v).replace(/Mocydła/g,'Moczydła').replace(/Mocydłach/g,'Moczydłach').replace(/Kacyniec/g,'Kaczyniec');
const AM = {}; D.acts.forEach(a => AM[a.id] = a);
const getv = (a,f) => { const s = S.acts[a.id]; if (s && s.f[f] && s.f[f].v != null) return s.f[f].v; return a.ai[f] != null ? a.ai[f] : ''; };
const pair = (id, l, a, b, ex) => Object.assign({k:'pair', id, l, f:[a, b]}, ex || {});
const one = (f, l, ex) => Object.assign({k:'one', id:f, l, f:[f]}, ex || {});
const person = (x, title, cls) => ({t:title, cls, rows:[
  pair(x + '_nm', 'Imię i nazwisko', x + '_first_name', x + '_last_name'),
  one(x + '_status', 'Stan', {status:x}),
  pair(x + '_prev', 'Po kim (imię i nazwisko rodowe)', x + '_prev_spouse_first_name', x + '_prev_spouse_last_name', {cond:x}),
  one(x + '_profession', 'Zawód'), one(x + '_age', 'Wiek', {age:1}), one(x + '_birth_place', 'Miejsce urodzenia'), one(x + '_residence', 'Zamieszkanie')],
  sub:[{t:'Ojciec', cls:'sub', rows:[pair(x + '_father', 'Imię i nazwisko', x + '_father_first_name', x + '_father_last_name', {alive:x + '_father_alive'})]},
       {t:'Matka', cls:'sub', rows:[pair(x + '_mother', 'Imię i nazwisko rodowe', x + '_mother_first_name', x + '_mother_last_name', {alive:x + '_mother_alive'})]}]});
const witness = (k) => ({t:'Świadek ' + k, cls:'w', rows:[pair('w' + k, 'Imię i nazwisko', 'witness' + k + '_first_name', 'witness' + k + '_last_name'), one('witness' + k + '_profession', 'Zawód'), one('witness' + k + '_residence', 'Zamieszkanie')]});
const BLOCKS = [
 {t:'Akt', cls:'akt', rows:[one('marriage_date', 'Data aktu (RRRR-MM-DD)', {date:1}), one('margin_place', 'Miejscowość (margines)')]},
 {t:'Margines – imiona młodych', cls:'mg', sub:[{t:'Pan młody', cls:'g', rows:[pair('mg_g', 'Imię i nazwisko', 'margin_groom_first_name', 'margin_groom_last_name')]}, {t:'Panna młoda', cls:'b', rows:[pair('mg_b', 'Imię i nazwisko', 'margin_bride_first_name', 'margin_bride_last_name')]}]},
 witness(1), witness(2), person('groom', 'Pan młody', 'g'), person('bride', 'Panna młoda', 'b'),
 {t:'Zakończenie aktu', cls:'akt', rows:[one('officiant', 'Duchowny (ksiądz)'), one('margin_notes', 'Adnotacje i uwagi (margines, stemple, zgon, kolejne małżeństwo…)', {big:1})]}
];
const ROWS = {}; const FIELDS = [];
(function walk(L){ L.forEach(b => { (b.rows || []).forEach(r => { ROWS[r.id] = r; r.f.concat(r.alive ? [r.alive] : []).forEach(f => FIELDS.push(f)); }); walk(b.sub || []); }); })(BLOCKS);
const PLF = new Set(['margin_place','groom_birth_place','groom_residence','bride_birth_place','bride_residence','witness1_residence','witness2_residence']);
const isUnc = (a,f) => new Set(clean(a.ai.uncertain_fields).split(/[;,]\s*/)).has(f) || /\?\s*$/.test(clean(a.ai[f]));
const fld = (a,f) => (S.acts[a.id] && S.acts[a.id].f[f]) || null;
const normV = (f,v) => { v = clean(v); if (PLF.has(f)) v = normPl(v); return v; };
function commit(a,f,v,flag){ if (flag === 'edit') { if (f === 'marriage_date') v = dateShort(a, v); learn(a, f, v); } const s = st(a.id); const o = s.f[f] || (s.f[f] = {}); o.v = normV(f,v); if (flag === 'edit') { o.unc = false; o.ok = false; } save(); }
function nm(a){ return clean(getv(a,'groom_last_name')).replace(/\?/g,'') + ' ' + clean(getv(a,'groom_first_name')).replace(/\?/g,'') + ' z ' + clean(getv(a,'bride_first_name')).replace(/\?/g,'') + ' ' + clean(getv(a,'bride_last_name')).replace(/\?/g,''); }
function status(a){ const s = S.acts[a.id]; if (!s) return 'n'; if (s.done) return 'd'; return Object.keys(s.f).some(k => s.f[k].ok || s.f[k].v != null) ? 'w' : 'n'; }
function warns(a){ const w = []; const num = f => { const m = clean(getv(a,f)).match(/\d+/); return m ? +m[0] : null; };
  { const dd = (x, y, mx) => lev(fold(clean(x)), fold(clean(y)), mx) > mx; [['groom','pan młody'],['bride','panna młoda']].forEach(([x,l]) => { const mf = getv(a,'margin_' + x + '_first_name'), ml = getv(a,'margin_' + x + '_last_name'); if (!clean(mf) && !clean(ml)) { w.push('Margines: brak ' + l + ' – przepisz z marginesu (imię i nazwisko osobno).'); return; } const tf = getv(a,x + '_first_name'), tl = getv(a,x + '_last_name'); if (dd(ml, tl, 1) || dd(mf, tf, 2)) w.push('Margines a tekst: ' + l + ' „' + clean(mf) + ' ' + clean(ml) + '” ≠ „' + clean(tf) + ' ' + clean(tl) + '”.'); }); }
  [['groom_age','pana młodego'],['bride_age','panny młodej']].forEach(([f,l]) => { const n = num(f); if (n != null && (n < 15 || n > 90)) w.push('Wiek ' + l + ' (' + n + ') wygląda nieprawdopodobnie.'); });
  const d = clean(getv(a,'marriage_date')); if (d && !/^\d{4}-\d{2}-\d{2}$/.test(d)) w.push('Data aktu nie ma formatu RRRR-MM-DD.');
  if (!clean(getv(a,'witness1_last_name')) || !clean(getv(a,'witness2_last_name'))) w.push('Brak jednego ze świadków.');
  const r = (D.reg[a.year] || []).find(x => x.akt === a.act); if (r) { const sn = x => clean(x).replace(/\?/g,'').toLowerCase().split(/\s+/)[0]; if (sn(r.mlodzi) !== sn(getv(a,'groom_last_name'))) w.push('Rejestr: pan młody „' + r.mlodzi + '” ≠ w akcie „' + clean(getv(a,'groom_last_name')) + '”.'); const bl = x => clean(x).replace(/\?/g,'').toLowerCase().split(/\s+/).slice(-1)[0]; if (bl(r.panna) !== bl(getv(a,'bride_last_name'))) w.push('Rejestr: panna młoda „' + r.panna + '” ≠ w akcie „' + clean(getv(a,'bride_first_name')) + ' ' + clean(getv(a,'bride_last_name')) + '”.'); }
  else if (D.reg[a.year]) w.push('Brak wpisu tego aktu w rejestrze alfabetycznym.');
  return w; }
/* ---- lista ---- */
function renderList(){ let h = ''; const hide = S.hideDone !== false; const years = [...new Set(D.acts.map(a => a.year))].sort(); years.forEach(y => { const acts = D.acts.filter(a => a.year === y); const dn = acts.filter(a => status(a) === 'd').length; h += '<div class="yh">' + y + ' · ' + dn + '/' + acts.length + '</div>'; acts.filter(a => !(hide && status(a) === 'd' && a.id !== S.cur)).forEach(a => { h += '<div class="sr ' + status(a) + (S.cur === a.id ? ' cur' : '') + '" data-id="' + a.id + '"><span class="n">' + a.act + '</span><span>' + nm(a).replace(/^ z /,'') + '</span></div>'; }); }); h = '<div style="padding:4px 4px 6px"><button id="hdT" style="width:100%">' + (hide ? 'Pokaż zatwierdzone' : 'Ukryj zatwierdzone') + '</button></div>' + h; $('sb').innerHTML = h; const done = D.acts.filter(a => status(a) === 'd').length; $('prog').textContent = done + '/' + D.acts.length + ' zatwierdzonych'; }
$('sb').onclick = e => { if (e.target.id === 'hdT') { S.hideDone = S.hideDone === false; save(); renderList(); return; } const r = e.target.closest('.sr'); if (r) open(r.dataset.id); };

/* ---- baza wg płci: nazwiska, imiona, miejscowości (wybór istniejących / edycja / nowy wpis) ---- */
const fold = s => (s||'').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');

function drawOv(a){ const P = D.pola[a.id] || {}; const ov = $('ov'); ov.style.width = NW + 'px'; ov.style.height = NH + 'px'; let h = ''; const box = (r, c, t) => '<b class="' + c + '" title="' + esc(t || '') + '" style="left:' + r.x * 100 + '%;top:' + r.y * 100 + '%;width:' + r.w * 100 + '%;height:' + r.h * 100 + '%"></b>'; (P.pieczatki || []).forEach(r => h += box(r, 'p', 'pieczątka: ' + (r.opis || ''))); (P.adnotacje || []).forEach(r => h += box(r, 'a', 'adnotacja: ' + (r.opis || ''))); ov.innerHTML = h; }
function fitField(f){ const a = AM[S.cur]; if (!a) return; const P = D.pola[a.id]; const k = REG_OF(f); if (!P || !k) return; let r = k === 'adnotacje' ? ((P.adnotacje || [])[0] || P.zakonczenie) : P[k]; if (r && NW) { curRoi = a.roi.roi; fitRoi(padR(r)); } }
$('form').addEventListener('focusin', e => { const f = e.target.dataset && e.target.dataset.f; if (f) fitField(f); });
let annI = 0; function nextMark(){ const a = AM[S.cur]; const P = (a && D.pola[a.id]) || {}; const L = (P.pieczatki || []).map(r => ['pieczątka', r]).concat((P.adnotacje || []).map(r => ['adnotacja', r])); if (!L.length) { alert('Brak wykrytych pieczątek i adnotacji w tym akcie.'); return; } const x = L[annI++ % L.length]; fitRoi(padR(x[1])); $('vinfo').textContent = x[0] + ': ' + (x[1].opis || ''); }
function showScan(a){ const key = a.roi.plik; const src = D.scans[key]; curRoi = a.roi.roi; $('vmiss').style.display = 'none'; $('vinfo').textContent = a.roi.file || key;
  if (!src) { im.removeAttribute('src'); $('vmiss').style.display = 'flex'; $('vmiss').textContent = 'Brak skanu: ' + key; return; }
  im.onload = () => { NW = im.naturalWidth; NH = im.naturalHeight; drawOv(a); fitRoi(curRoi); }; im.onerror = () => { $('vmiss').style.display = 'flex'; $('vmiss').innerHTML = 'Nie można wczytać skanu.<br>' + esc(src); }; if (im.getAttribute('src') === src && NW) { drawOv(a); fitRoi(curRoi); } else im.src = src; }
$('vAkt').onclick = () => curRoi && fitRoi(curRoi); $('vAll').onclick = () => fitRoi({x:0,y:0,w:1,h:1});
const zoom = (k, cx, cy) => { cx = cx == null ? vp.clientWidth / 2 : cx; cy = cy == null ? vp.clientHeight / 2 : cy; T.x = cx - (cx - T.x) * k; T.y = cy - (cy - T.y) * k; T.s *= k; apply(); };
$('vMk').onclick = nextMark; $('vP').onclick = () => zoom(1.3); $('vM').onclick = () => zoom(1 / 1.3);
vp.addEventListener('wheel', e => { e.preventDefault(); const r = vp.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); }, {passive:false});
let drag = null; vp.addEventListener('pointerdown', e => { drag = {x:e.clientX - T.x, y:e.clientY - T.y}; vp.setPointerCapture(e.pointerId); vp.style.cursor = 'grabbing'; });
vp.addEventListener('pointermove', e => { if (!drag) return; T.x = e.clientX - drag.x; T.y = e.clientY - drag.y; apply(); }); vp.addEventListener('pointerup', () => { drag = null; vp.style.cursor = 'grab'; });
/* ---- otwieranie ---- */
function open(id){ const a = AM[id]; if (!a) return; S.cur = id; save(); renderList(); renderForm(a); showScan(a); $('txt').textContent = a.text || ''; window.scrollTo(0,0); }
/* ---- CSV ---- */
const COLS = D.cols.filter(c => c !== 'margin_names').concat(['margin_groom','margin_bride','margin_groom_first_name','margin_groom_last_name','margin_bride_first_name','margin_bride_last_name','witness1_first_name','witness1_last_name','witness2_first_name','witness2_last_name','groom_prev_spouse_first_name','groom_prev_spouse_last_name','bride_prev_spouse_first_name','bride_prev_spouse_last_name'].filter(c => !D.cols.includes(c)));
const q = v => { v = v == null ? '' : String(v); return /[;"\n\r]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; };
function rows(){ return D.acts.map(a => { const s = S.acts[a.id] || {f:{}}; const r = {}; COLS.forEach(c => r[c] = a.ai[c] != null ? a.ai[c] : ''); r.id = a.id; r.marriage_year = a.year; r.marriage_act_number = a.act; FIELDS.forEach(f => { r[f] = normV(f, getv(a,f)); });
  const unc = FIELDS.filter(f => { const o = s.f[f]; return o ? (o.unc || (!o.ok && !s.done && isUnc(a,f))) : (!s.done && isUnc(a,f)); }); r.uncertain_fields = unc.join(',');
  r.verification_notes = FIELDS.filter(f => s.f[f] && s.f[f].note).map(f => f + ': ' + s.f[f].note).join(' | ');
  r.verification_status = s.done ? 'ok' : (status(a) === 'w' ? 'ai_v1_w_trakcie' : 'ai_v1'); ['groom','bride'].forEach(x => { r['margin_' + x] = (clean(r['margin_' + x + '_first_name']) + ' ' + clean(r['margin_' + x + '_last_name'])).trim(); }); [1,2].forEach(k => { r['witness' + k + '_name'] = (clean(r['witness' + k + '_first_name']) + ' ' + clean(r['witness' + k + '_last_name'])).trim(); }); return r; }); }
const csvText = () => COLS.join(';') + '\r\n' + rows().map(r => COLS.map(c => q(r[c])).join(';')).join('\r\n') + '\r\n';
function download(name, text, type){ const b = new Blob(['﻿' + text], {type: type || 'text/csv;charset=utf-8'}); const u = URL.createObjectURL(b); const l = document.createElement('a'); l.href = u; l.download = name; document.body.appendChild(l); l.click(); setTimeout(() => { URL.revokeObjectURL(u); l.remove(); }, 500); }
$('bExp').onclick = () => download('MALZENSTWA_zweryfikowane_auto.csv', csvText());
function parseCsv(t){ t = t.replace(/^﻿/,''); const out = []; let row = [], c = '', inq = false; for (let i = 0; i < t.length; i++) { const ch = t[i]; if (inq) { if (ch === '"') { if (t[i+1] === '"') { c += '"'; i++; } else inq = false; } else c += ch; } else if (ch === '"') inq = true; else if (ch === ';') { row.push(c); c = ''; } else if (ch === '\n') { row.push(c.replace(/\r$/,'')); out.push(row); row = []; c = ''; } else c += ch; } if (c || row.length) { row.push(c.replace(/\r$/,'')); out.push(row); } return out; }
let OVW = false;
function importCsv(text){ const rs = parseCsv(text); const h = rs[0]; const ix = {}; h.forEach((k,i) => ix[k] = i); let n = 0, skip = 0, miss = 0;
  rs.slice(1).forEach(r => { const id = r[ix.id]; const a = AM[id]; if (!a) { miss++; return; } const ok = r[ix.verification_status] === 'ok'; const unc = new Set(clean(r[ix.uncertain_fields]).split(/[;,]\s*/)); const s = st(id);
    FIELDS.forEach(f => { if (ix[f] == null) return; const v = normV(f, r[ix[f]]); if (s.f[f] && s.f[f].ok && !OVW) { skip++; return; } const o = s.f[f] || (s.f[f] = {}); o.v = v; o.ok = ok; o.unc = !ok && unc.has(f); n++; });
    if (ix.verification_notes != null) clean(r[ix.verification_notes]).split(' | ').forEach(p => { const m = p.match(/^(\w+): (.*)$/); if (m && FIELDS.includes(m[1])) { (s.f[m[1]] || (s.f[m[1]] = {})).note = m[2]; } });
    if (ok) s.done = true; });
  save(); renderList(); if (AM[S.cur]) open(S.cur); alert('Wczytano pól: ' + n + (skip ? ', pominięto zatwierdzonych: ' + skip : '') + (miss ? ', nieznanych aktów: ' + miss : '')); }
$('bImp').onclick = () => $('fl').click();
$('fl').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { if (/\.json$/i.test(f.name)) { try { S = JSON.parse(rd.result); save(); renderList(); open(S.cur || D.acts[0].id); } catch(x) { alert('Błędny JSON'); } } else importCsv(rd.result); e.target.value = ''; }; rd.readAsText(f, 'utf-8'); };
/* ---- rejestry ---- */
$('bReg').onclick = () => { let h = '<h3>Rejestry alfabetyczne zaślubionych</h3>'; Object.keys(D.reg).forEach(y => { h += '<h4>' + y + '</h4><table><tr><th>Lp.</th><th>Pan młody</th><th>Panna młoda</th><th>Akt</th><th></th></tr>'; D.reg[y].forEach(r => { const a = D.acts.find(x => x.year == y && x.act === r.akt); h += '<tr><td>' + r.lp + '</td><td>' + esc(r.mlodzi) + '</td><td>' + esc(r.panna) + '</td><td>' + r.akt + '</td><td>' + (a ? '<a href="#" data-o="' + a.id + '">otwórz</a>' : '<span style="color:var(--mu)">brak skanu</span>') + '</td></tr>'; }); h += '</table>'; }); $('dgc').innerHTML = h; $('dg').showModal(); };
$('dgc').addEventListener('click', e => { const l = e.target.closest('[data-o]'); if (l) { e.preventDefault(); $('dg').close(); open(l.dataset.o); } });
$('bMenu').onclick = () => { $('dgc').innerHTML = '<h3>Więcej</h3><p><button id="mImp">Wczytaj CSV…</button> <button id="mReg">Rejestry</button> <button id="mJson">Zapisz stan (JSON)</button> <button id="mOvw">Wczytaj CSV z nadpisaniem…</button> <button id="mTh">Motyw jasny/ciemny</button> <button id="mClr">Wyczyść zapis w przeglądarce</button></p><p style="color:var(--mu);font-size:12.5px">Zapis automatyczny jest w pamięci przeglądarki. CSV zawiera wszystko: pola, status, niepewne pola, uwagi i tekst aktu.</p>'; $('dg').showModal(); };
$('dgc').addEventListener('click', e => { if (e.target.id === 'mImp') { $('dg').close(); $('fl').click(); } if (e.target.id === 'mReg') { $('dg').close(); $('bReg').click(); } if (e.target.id === 'mJson') download('malzenstwa_stan.json', JSON.stringify(S), 'application/json'); if (e.target.id === 'mOvw') { OVW = true; $('dg').close(); $('fl').click(); } if (e.target.id === 'mTh') { const r = document.documentElement; r.dataset.th = r.dataset.th === 'dark' ? 'light' : 'dark'; } if (e.target.id === 'mClr' && confirm('Usunąć zapis z przeglądarki?')) { try { localStorage.removeItem(KEY); } catch(x) {} S = {acts:{}, cur:null}; renderList(); open(D.acts[0].id); $('dg').close(); } });
document.addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return; const a = AM[S.cur]; if (!a) return; const i = D.acts.indexOf(a); if (e.key === 'ArrowRight' && D.acts[i+1]) open(D.acts[i+1].id); if (e.key === 'ArrowLeft' && D.acts[i-1]) open(D.acts[i-1].id); });
window.addEventListener('resize', () => curRoi && fitRoi(curRoi));
D.acts.forEach(a => { [1,2].forEach(k => { const w = clean(a.ai['witness' + k + '_name']).split(/\s+/).filter(Boolean); if (!clean(a.ai['witness' + k + '_last_name']) && w.length) { a.ai['witness' + k + '_last_name'] = w[w.length - 1]; a.ai['witness' + k + '_first_name'] = w.slice(0, -1).join(' '); } }); });
D.acts.forEach(a => { const c = x => clean(a.ai[x]).replace(/\?/g,''); ['groom','bride'].forEach(x => { const old = clean(a.ai['margin_' + x]).split(/\s+/).filter(Boolean); ['first_name','last_name'].forEach((k,i) => { const key = 'margin_' + x + '_' + k; if (!clean(a.ai[key])) { a.ai[key] = old.length > 1 ? (i ? old[old.length - 1] : old.slice(0,-1).join(' ')) : c(x + '_' + k); a.ai.uncertain_fields = (clean(a.ai.uncertain_fields) ? clean(a.ai.uncertain_fields) + ',' : '') + key; } }); }); });
D.acts.forEach(a => { ['groom','bride'].forEach(x => { if (clean(a.ai[x + '_prev_spouse_last_name']) || clean(a.ai[x + '_prev_spouse_first_name'])) return; if (!/^wd/i.test(clean(a.ai[x + '_status']))) return; const src = clean(a.ai.margin_notes) + ' ' + clean(a.text); const m = src.match(/wdow\S*\s+po\s+([A-ZŻŹĆŚŁÓĄĘŃ][a-ząćęłńóśźż]+)\s+(?:z|ze)\s+([A-ZŻŹĆŚŁÓĄĘŃ][a-ząćęłńóśźż]+)/); if (m) { a.ai[x + '_prev_spouse_first_name'] = m[1]; a.ai[x + '_prev_spouse_last_name'] = m[2]; a.ai.uncertain_fields = (clean(a.ai.uncertain_fields) ? clean(a.ai.uncertain_fields) + ',' : '') + x + '_prev_spouse_first_name,' + x + '_prev_spouse_last_name'; } }); });
D.acts.forEach(a => { Object.keys(a.ai).forEach(k => { if (typeof a.ai[k] === 'string') a.ai[k] = PLF.has(k) ? normPl(a.ai[k]) : a.ai[k]; }); });

/* ---- telefon: szuflada aktów, pływający skan, pasek dolny ---- */
const rt = document.documentElement.style;
function layout(){ const h = document.querySelector('header'); rt.setProperty('--hh', h.offsetHeight + 'px'); let v = S.vhp || Math.round(innerHeight * .36); v = Math.max(110, Math.min(v, Math.round(innerHeight * .75))); rt.setProperty('--vhp', v + 'px'); document.body.classList.toggle('vmin', !!S.vmin); document.body.classList.toggle('vtx', !!S.vtx); if (PH() && curRoi && !S.vmin) setTimeout(() => fitRoi(curRoi), 30); }
const sbo = on => document.body.classList.toggle('sbo', on);
$('pSb').onclick = () => sbo(!document.body.classList.contains('sbo')); $('scrim').onclick = () => sbo(false);
$('sb').addEventListener('click', e => { if (e.target.closest('.sr')) sbo(false); });
$('vMin').onclick = () => { S.vmin = !S.vmin; save(); $('vMin').textContent = S.vmin ? '▴' : '▾'; layout(); };
$('vTx').onclick = () => { S.vtx = !S.vtx; save(); layout(); };
$('pPr').onclick = () => { const b = $('bPrev'); b && b.click(); }; $('pNx').onclick = () => { const b = $('bNext'); b && b.click(); }; $('pOk').onclick = () => { const b = $('bDone'); b && b.click(); };
function pOkLbl(){ const a = AM[S.cur]; $('pOk').textContent = a && S.acts[a.id] && S.acts[a.id].done ? '↺ Cofnij zatwierdzenie' : '✓ Zatwierdź akt'; }
let hd = null; $('vh').addEventListener('pointerdown', e => { hd = {y:e.clientY, v:$('view').offsetHeight}; $('vh').setPointerCapture(e.pointerId); });
$('vh').addEventListener('pointermove', e => { if (!hd) return; S.vhp = Math.max(110, Math.min(hd.v + e.clientY - hd.y, Math.round(innerHeight * .75))); rt.setProperty('--vhp', S.vhp + 'px'); });
$('vh').addEventListener('pointerup', () => { if (hd) { hd = null; save(); layout(); } });
window.addEventListener('resize', layout); new MutationObserver(pOkLbl).observe($('form'), {childList:true});
renderList(); layout(); $('vMin').textContent = S.vmin ? '▴' : '▾'; open(S.cur && AM[S.cur] ? S.cur : D.acts[0].id); pOkLbl();
