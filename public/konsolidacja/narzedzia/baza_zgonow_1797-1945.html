let S={edits:{},scan:{},added:[],status:{},note:{}}; // zmiany użytkownika
try{S=Object.assign(S,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){};stat()}
S.added.forEach(r=>recs.push(r));
const pool={}; // dekada -> [{name,url}]
const dec=y=>Math.floor(y/10)*10, cen=y=>Math.floor(y/100)+1;
const rom={18:'1700–1799',19:'1800–1899',20:'1900–1999'};
let sel={lvl:'all',v:null}, cur=null, view=[];
const $=s=>document.querySelector(s);
function fld(r,k){const e=S.edits[r.id];return e&&k in e?e[k]:(r.f[k]||'')}
function name(r){return (fld(r,'deceased_last_name')||'?')+' '+(fld(r,'deceased_first_name')||'')}
function stat(){const n=Object.keys(S.edits).length;$('#st').textContent=recs.length+' aktów · zmienionych: '+n+' · zdjęć w pamięci: '+Object.values(pool).reduce((a,b)=>a+b.length,0)}
function by(){const m={};recs.forEach(r=>{(m[r.y]=m[r.y]||[]).push(r)});return m}
function sumYear(l){const o={n:l.length,ok:0,ai:0,idx:0};l.forEach(r=>{const s=S.status[r.id]==='ok'?'ok':r.s;o[s==='ok'?'ok':s==='ai'?'ai':'idx']++});return o}
function drawTree(){
  const m=by();let h=`<div class="n ${sel.lvl=='all'?'sel':''}" data-l="all">Wszystkie lata <span class="cnt">${recs.length}</span></div>`;
  for(const c of [18,19,20]){
    const a=(c-1)*100, b=a+99;
    const ys=[];for(let y=Math.max(a,1797);y<=Math.min(b,1945);y++)ys.push(y);
    const cn=ys.reduce((s,y)=>s+(m[y]||[]).length,0);
    h+=`<div class="n c1 ${sel.lvl=='c'&&sel.v==c?'sel':''}" data-l="c" data-v="${c}">▾ ${rom[c]} <span class="cnt">${cn}</span></div>`;
    const ds=[...new Set(ys.map(dec))];
    for(const d of ds){
      const yy=ys.filter(y=>dec(y)==d), dn=yy.reduce((s,y)=>s+(m[y]||[]).length,0), np=(pool[d]||[]).length;
      h+=`<div class="n c2 ${sel.lvl=='d'&&sel.v==d?'sel':''} ${dn?'':'dim'}" data-l="d" data-v="${d}">${d}–${d+9}${np?' 📷'+np:''}<span class="cnt">${dn||'–'}</span></div>`;
      if((sel.lvl=='d'&&sel.v==d)||(sel.lvl=='y'&&dec(sel.v)==d)){
        for(const y of yy){const l=m[y]||[];const o=sumYear(l);
          h+=`<div class="n c3 ${sel.lvl=='y'&&sel.v==y?'sel':''} ${l.length?'':'dim'}" data-l="y" data-v="${y}">${y}${o.ok?` <span class="b ok">✓${o.ok}</span>`:''}${o.ai?` <span class="b ai">AI${o.ai}</span>`:''}<span class="cnt">${l.length||'–'}</span></div>`}
      }
    }
  }
  $('#tree').innerHTML=h;
}
$('#tree').onclick=e=>{const n=e.target.closest('.n');if(!n)return;sel={lvl:n.dataset.l,v:n.dataset.v?+n.dataset.v:null};cur=null;draw()};
function badge(r){const st=S.status[r.id];const s=st==='ok'?'ok':st==='bad'?'er':r.s;const t={ok:'zweryfikowany',ai:'odczyt AI',idx:'tylko indeks',er:'błąd/wątpliwy'}[s];return `<span class="b ${s}">${t}</span>`}
function hasScan(r){return S.scan[r.id]||r.scan}
function drawList(){
  const m=by(),q=$('#q').value.trim().toLowerCase();let h='';
  if(q){view=recs.filter(r=>(name(r)+' '+fld(r,'mother_last_name')+' '+fld(r,'father_last_name')).toLowerCase().includes(q)).slice(0,500);
    h=`<div class="pad dim">Wyniki szukania: ${view.length}${view.length==500?'+':''}</div>`+table(view,true)}
  else if(sel.lvl=='y'){view=m[sel.v]||[];
    h=`<div class="pad"><b>${sel.v}</b> — ${view.length} aktów ${view.length?'':'(brak w bazie — możesz dodać akt lub wczytać odczyty)'}</div>`+(view.length?table(view,false):'')}
  else{
    const ys=[];let a=1797,b=1945;
    if(sel.lvl=='c'){a=(sel.v-1)*100;b=a+99}
    if(sel.lvl=='d'){a=sel.v;b=sel.v+9}
    for(let y=Math.max(a,1797);y<=Math.min(b,1945);y++)ys.push(y);
    h='<div class="pad">'+ys.map(y=>{const l=m[y]||[];const o=sumYear(l);return `<div class="card ${l.length?'':'e'}" data-y="${y}"><b>${y}</b><br>${l.length?l.length+' aktów':'brak'}<br>${o.ok?`<span class="b ok">✓${o.ok}</span> `:''}${o.ai?`<span class="b ai">AI${o.ai}</span>`:''}</div>`}).join('')+'</div>';
    view=[]}
  $('#list').innerHTML=h;
}
function table(l,showY){return `<table><tr><th>${showY?'rok ':''}akt</th><th>zmarły</th><th>wiek</th><th>miejsce</th><th>stan</th><th>📷</th></tr>`+l.map((r,i)=>`<tr class="r ${cur&&cur.id==r.id?'sel':''}" data-i="${i}"><td>${showY?r.y+' ':''}${r.a??'·'+r.ord}</td><td>${esc(name(r))}</td><td>${esc(fld(r,'age'))}</td><td>${esc(fld(r,'death_place')||fld(r,'deceased_residence'))}</td><td>${badge(r)}</td><td>${hasScan(r)?'●':''}</td></tr>`).join('')+'</table>'}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
$('#list').onclick=e=>{const c=e.target.closest('.card');if(c){const y=+c.dataset.y;sel={lvl:'y',v:y};cur=null;draw();return}
  const t=e.target.closest('tr.r');if(t){open(view[+t.dataset.i])}};
$('#q').oninput=()=>{drawList()};
// ---- szczegóły
const LAB={deceased_last_name:'Nazwisko',deceased_first_name:'Imię',deceased_maiden_name:'Nazwisko rodowe',deceased_sex:'Płeć (M/K)',death_date:'Data zgonu (RRRR-MM-DD)',death_time:'Godzina',death_place:'Miejsce zgonu',age:'Wiek',deceased_status:'Stan',deceased_spouse:'Małżonek',deceased_residence:'Zamieszkały',profession:'Zawód',father_first_name:'Ojciec – imię',father_last_name:'Ojciec – nazwisko',mother_first_name:'Matka – imię',mother_last_name:'Matka – nazwisko',informant1:'Zgłaszający 1',informant2:'Zgłaszający 2',cause_of_death:'Przyczyna zgonu',burial_place:'Pochówek',officiant:'Ksiądz/urzędnik',notes:'Uwagi'};
function open(r){cur=r;drawList();
  const rows=Object.keys(LAB).map(k=>{const v=fld(r,k),ch=S.edits[r.id]&&k in S.edits[r.id];return `<div class="row ${ch?'ch':''}"><label>${LAB[k]}</label>${k=='notes'?`<textarea data-k="${k}" rows="2">${esc(v)}</textarea>`:`<input data-k="${k}" value="${esc(v)}">`}</div>`}).join('');
  const d=dec(r.y),p=pool[d]||[];
  $('#det').innerHTML=`<div class="pad" style="padding-bottom:4px"><b>${r.y} · akt ${r.a??'(bez numeru, poz. '+r.ord+')'}</b> ${badge(r)} <span class="dim">${esc(r.book||'')}</span>
  <button id="pv">←</button><button id="nx">→</button> <select id="stsel"><option value="">stan: wg źródła</option><option value="ok" ${S.status[r.id]=='ok'?'selected':''}>✓ zweryfikowane</option><option value="bad" ${S.status[r.id]=='bad'?'selected':''}>⚠ wątpliwe/błąd</option></select></div>
  <div id="view"><div id="vtools"><button data-z="1.25">+</button><button data-z="0.8">−</button><button data-z="0">⟲</button><button id="rot">↻</button></div></div>
  <div id="thumbs">${p.length?p.map((x,i)=>`<img src="${x.url}" title="${esc(x.name)}" data-i="${i}" class="${S.scan[r.id]==x.name||(!S.scan[r.id]&&r.scan==x.name)?'on':''}">`).join(''):'<span class="dim">Brak zdjęć dla dekady '+d+'–'+(d+9)+'. Zaznacz dekadę i użyj „📷 Zdjęcia dekady…".</span>'}</div>
  <div class="pad">${r.f.notes_org?`<div class="dim">Indeks: ${esc(r.f.notes_org)}</div>`:''}${r.f.act_text?`<details><summary>Tekst aktu</summary><div>${esc(r.f.act_text)}</div></details>`:''}${rows}</div>`;
  $('#det').querySelectorAll('input[data-k],textarea[data-k]').forEach(el=>el.onchange=()=>{(S.edits[r.id]=S.edits[r.id]||{})[el.dataset.k]=el.value;el.closest('.row').classList.add('ch');save();drawList()});
  $('#stsel').onchange=e=>{S.status[r.id]=e.target.value;if(!e.target.value)delete S.status[r.id];save();drawList()};
  $('#pv').onclick=()=>step(-1);$('#nx').onclick=()=>step(1);
  $('#thumbs').onclick=e=>{const i=e.target.dataset.i;if(i==null)return;S.scan[r.id]=p[+i].name;save();show(p[+i].url);open(r)};
  const nm=S.scan[r.id]||r.scan,f=p.find(x=>x.name==nm);
  if(f)show(f.url);else $('#view').insertAdjacentHTML('beforeend','<div class="hint" style="color:#aaa">'+(nm?'Plik skanu: '+esc(nm)+' — wczytaj zdjęcia dekady.':'Brak przypisanego skanu — kliknij miniaturę poniżej, aby przypisać.')+'</div>');
}
function step(d){const i=view.findIndex(x=>x.id==cur.id);const n=view[i+d];if(n)open(n)}
document.onkeydown=e=>{if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key=='ArrowRight')step(1);if(e.key=='ArrowLeft')step(-1);if(e.key=='+')zoom(1.25);if(e.key=='-')zoom(.8)};
// viewer
let T={x:0,y:0,k:1,r:0},img=null;
function show(url){const v=$('#view');v.querySelectorAll('img,.hint').forEach(x=>x.remove());img=new Image();img.onload=()=>{const k=Math.min(v.clientWidth/img.naturalWidth,v.clientHeight/img.naturalHeight);T={x:0,y:0,k:k,r:0,k0:k};ap()};img.src=url;v.appendChild(img)}
function ap(){if(img)img.style.transform=`translate(${T.x}px,${T.y}px) scale(${T.k}) rotate(${T.r}deg)`}
function zoom(f,cx,cy){const v=$('#view');if(!img)return;if(f==0){T.x=0;T.y=0;T.k=T.k0;T.r=0;ap();return}
  cx=cx??v.clientWidth/2;cy=cy??v.clientHeight/2;T.x=cx-(cx-T.x)*f;T.y=cy-(cy-T.y)*f;T.k*=f;ap()}
$('#det').addEventListener('click',e=>{const z=e.target.dataset&&e.target.dataset.z;if(z!=null&&e.target.closest('#vtools'))zoom(+z);if(e.target.id=='rot'){T.r=(T.r+90)%360;ap()}});
$('#det').addEventListener('wheel',e=>{const v=e.target.closest('#view');if(!v)return;e.preventDefault();const b=v.getBoundingClientRect();zoom(e.deltaY<0?1.15:.87,e.clientX-b.left,e.clientY-b.top)},{passive:false});
let drag=null;$('#det').addEventListener('mousedown',e=>{if(e.target.closest('#view')&&!e.target.closest('#vtools'))drag={x:e.clientX-T.x,y:e.clientY-T.y}});
window.addEventListener('mousemove',e=>{if(drag){T.x=e.clientX-drag.x;T.y=e.clientY-drag.y;ap()}});window.addEventListener('mouseup',()=>drag=null);
// pliki
$('#bImg').onclick=()=>{if(sel.lvl=='all'||sel.lvl=='c'){alert('Najpierw zaznacz dekadę (lub rok) w drzewie.');return}$('#fImg').click()};
$('#fImg').onchange=e=>{const d=sel.lvl=='d'?sel.v:dec(sel.v);const l=[...e.target.files].sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}));
  (pool[d]=pool[d]||[]).push(...l.map(f=>({name:f.name,url:URL.createObjectURL(f)})));e.target.value='';stat();draw();if(cur)open(cur)};
$('#bAi').onclick=()=>$('#fAi').click();
function csvParse(t){t=t.replace(/^﻿/,'');const rows=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}else if(ch=='"')q=true;else if(ch==';'){row.push(c);c=''}else if(ch=='\n'){row.push(c);rows.push(row);row=[];c=''}else if(ch!='\r')c+=ch}if(c||row.length){row.push(c);rows.push(row)}return rows}
$('#fAi').onchange=async e=>{const rows=csvParse(await e.target.files[0].text()),h=rows[0];let n=0,nw=0;
  for(const x of rows.slice(1)){if(x.length<3)continue;const o={};h.forEach((k,i)=>o[k]=x[i]||'');const m=/-(\d{4})-(\d+)/.exec(o.id||'');const y=+(o.death_year||(m&&m[1])),a=+(o.death_act_number||(m&&m[2]));if(!y)continue;
    let r=recs.find(r=>r.y==y&&r.a==a);if(!r){r={id:o.id||'new-'+y+'-'+a,y,a,s:'ai',ord:a,f:{},book:'dodane'};recs.push(r);S.added.push(r);nw++}
    const ed=S.edits[r.id]=S.edits[r.id]||{};cols.forEach(k=>{if(['id','death_year','death_act_number'].includes(k))return;if(o[k]&&!(S.edits[r.id]&&S.edits[r.id][k]))ed[k]=o[k]});r.s='ai';n++}
  e.target.value='';save();draw();alert('Wczytano odczytów: '+n+' (nowe akty: '+nw+')')};
$('#bSave').onclick=()=>dl('baza_zgonow_zmiany.json',JSON.stringify(S));
$('#bLoad').onclick=()=>$('#fLoad').click();
$('#fLoad').onchange=async e=>{const o=JSON.parse(await e.target.files[0].text());S=Object.assign(S,o);S.added.forEach(r=>{if(!recs.find(x=>x.id==r.id))recs.push(r)});recs.sort((a,b)=>a.y-b.y||(a.a??9999)-(b.a??9999)||a.ord-b.ord);save();draw()};
$('#bCsv').onclick=()=>{const l=(sel.lvl=='y'?recs.filter(r=>r.y==sel.v):sel.lvl=='d'?recs.filter(r=>dec(r.y)==sel.v):recs);const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const h=cols.slice();const body=l.map(r=>h.map(k=>k=='id'?r.id:k=='death_year'?r.y:k=='death_act_number'?(r.a??''):k=='verification_status'?(S.status[r.id]=='ok'?'ok':S.status[r.id]=='bad'?'wątpliwe':fld(r,k)):fld(r,k)).map(q).join(';'));
  dl('zgony_'+(sel.lvl=='all'?'wszystkie':sel.v)+'.csv','﻿'+h.join(';')+'\n'+body.join('\n'))};
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t]));a.download=n;a.click()}
$('#bAdd').onclick=()=>{if(sel.lvl!='y'){alert('Zaznacz rok w drzewie.');return}const a=prompt('Numer aktu w roku '+sel.v+'?');if(!a)return;const r={id:'new-'+sel.v+'-'+a,y:sel.v,a:+a,s:'ai',ord:+a,f:{},book:'dodane'};recs.push(r);S.added.push(r);recs.sort((a,b)=>a.y-b.y||(a.a??9999)-(b.a??9999)||a.ord-b.ord);save();draw();open(recs.find(x=>x.id==r.id))};
function draw(){drawTree();drawList();stat()}
draw();
</script></body></html>
