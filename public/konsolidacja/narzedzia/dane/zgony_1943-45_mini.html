<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{background:var(--card);border-bottom:1px solid var(--line);padding:6px 10px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap}

button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:42px}

.mini{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 4px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}

.chip.akt{background:#ede9fe;border-color:#6d28d9;color:#6d28d9}.chip.uncb{background:var(--bzb);border-color:var(--bz);color:var(--bz)}.chip.uncb.sel{box-shadow:0 0 0 3px var(--bz)}
.nt{margin-top:5px}.nt input{padding:7px;font-size:15px}

.warn{border:2px solid var(--bad);background:var(--badb);border-radius:12px;padding:8px 10px;margin-bottom:10px;font-size:14px}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:10px;z-index:70;display:none;max-width:90%}

/* tryby tekstowe */
#bText.on,#bText2.on{background:var(--acc);color:#fff;border-color:var(--acc)}

.ttext{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;line-height:2.1;overflow-wrap:anywhere}
.hl{border-bottom:3px solid var(--ai);background:var(--aib);border-radius:4px;padding:1px 2px;cursor:pointer}
.hl.ok{background:var(--lubb);border-bottom-color:var(--lub)}.hl.un{background:var(--bzb);border-bottom-color:var(--bz)}.hl.cf{background:var(--badb);border-bottom-color:var(--bad)}.hl.sk{background:transparent;border-bottom:3px dotted var(--mut)}
.hl.sel{outline:3px solid var(--acc)}
.mq{background:var(--bzb);color:var(--bz);border-radius:4px;padding:0 2px;font-weight:600}.mr{background:var(--badb);color:var(--bad);border-radius:4px;padding:0 2px;font-weight:600}.mg{color:var(--mut)}
.tleg{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0}.tleg span{border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.ted{margin-top:10px;border:2px solid var(--acc);border-radius:12px;background:var(--card);padding:10px}.ted input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:18px;margin:6px 0}
.qm{background:var(--bzb);border-bottom:3px solid var(--bz);border-radius:4px;padding:1px 3px;font-weight:600;cursor:pointer;color:var(--ink)}.qm.r{background:var(--badb);border-bottom-color:var(--bad)}.qm.sk{background:transparent;border-bottom:3px dotted var(--mut);font-weight:400}.qm.sel{outline:3px solid var(--acc)}
#tsheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--acc);box-shadow:0 -4px 14px rgba(0,0,0,.25);max-height:46vh;overflow:auto;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
#tsheet .ted{margin:0;border:0;padding:4px 0}#tsheet .tnav{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--mut)}#tsheet .tnav button{min-height:36px;padding:2px 16px}
#tsheet .act3{display:flex;gap:8px;margin-top:8px}#tsheet .act3 button{min-height:54px;flex:1;font-size:16px;font-weight:600}#tsheet .act3 .btn-ok{flex:2.2}#tsheet .act3 .uncb{background:var(--bzb);border-color:var(--bz);color:var(--bz);font-weight:500}
#tsheet .ted input{margin:4px 0;padding:9px;font-size:17px}#tsheet .chip{min-height:44px}
body.textmode main{margin-bottom:330px}body.textmode #view{height:30vh}body.textmode #view.l{height:48vh}body.textmode #view.s{height:20vh}
.rep{margin-bottom:10px}.ri{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;border-radius:10px;padding:7px 9px;margin-bottom:5px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.ri.err{border-color:var(--bad);background:var(--badb)}.ri.warn{border-color:var(--bz);background:var(--bzb)}.ri.ig{opacity:.5}.ri a{color:var(--acc);text-decoration:underline;cursor:pointer}.ri button{flex:0 0 auto;min-height:30px;padding:2px 9px;font-size:12px}
#repov,#histov{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}.ovl{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}.rep-hd{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0}.rep-body{padding:8px 10px 40px;max-width:760px;margin:0 auto}
#list button.rp-err::after,#list button.rp-warn::after{content:'!';color:#fff;border-radius:8px;font-size:10px;padding:0 4px;margin-left:3px}#list button.rp-err::after{background:var(--bad)}#list button.rp-warn::after{background:#d97706}
.dw{margin:6px 0}.dwr{display:flex;flex-wrap:wrap;gap:8px}.dwg{display:inline-flex;align-items:stretch}.dwg button{min-height:44px;min-width:40px;padding:0 8px;font-size:20px;border-radius:0}.dwg button:first-child{border-radius:10px 0 0 10px}.dwg button:last-child{border-radius:0 10px 10px 0}
.dwi{border:1px solid var(--line);background:var(--bg);text-align:center;padding:6px 4px;font-size:17px;min-height:44px;border-radius:0}input.dwi[data-p=d]{width:52px}input.dwi[data-p=y]{width:68px}select.dwi{width:118px}.dwj.on{background:var(--acc);color:#fff;border-color:var(--acc)}.dwj{margin-top:4px;min-height:34px}
.dwl{font-size:13px;color:var(--mut);margin-top:4px}
#tsheet .dwg button{min-height:40px}#tsheet .dwi{min-height:40px}
.tnot{font-size:13px;color:var(--mut);margin-top:8px;white-space:pre-wrap}
.tarea{width:100%;min-height:42vh;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:11px;font:17px/1.6 system-ui,sans-serif}

/* ===== układ na komputer (szeroki ekran): skan po lewej na całą wysokość, pola/audyt po prawej; telefon bez zmian ===== */
@media (min-width:1000px){
 :root{--pw:clamp(520px,42vw,640px);--vw:calc(100vw - var(--pw))}
 #top{position:sticky;top:0;z-index:40;background:var(--card);box-shadow:0 1px 0 var(--line)}
 #view:not(.xl){position:fixed;left:0;top:var(--tt,130px);width:var(--vw);height:auto!important;bottom:0;z-index:20}
 main{margin:0 0 0 var(--vw);max-width:none!important;padding:14px 18px 110px}
 body.textmode main{margin-bottom:0;padding-bottom:340px}
 #bar,#wbar,#tsheet{left:var(--vw);right:0}
 #bar{padding-left:14px;padding-right:14px}

 .card{padding:14px 16px}
 .row input,.row textarea{font-size:16px;padding:8px 10px}
 .chip{min-height:34px;padding:5px 11px;font-size:14px}
 button{min-height:36px}

 :root{--sw:58px}body.sbx{--sw:280px}
 #list{position:fixed;left:0;top:var(--tt,130px);bottom:0;width:var(--sw);flex-direction:column;flex-wrap:nowrap;overflow-x:hidden;overflow-y:auto;padding:6px 5px;gap:4px;border-bottom:0;border-right:1px solid var(--line);z-index:35}
 #list button{min-width:0;width:100%;min-height:34px;padding:4px 2px;flex:0 0 auto}
 #list #sbT{position:sticky;top:-6px;z-index:2;background:var(--card);font-size:15px}
 #list .syh{font-weight:700;font-size:13px;padding:6px 4px 2px;color:var(--mut);border-bottom:1px solid var(--line);margin-top:4px}
 #list button.srow{text-align:left;display:flex;gap:8px;align-items:baseline;padding:4px 8px;white-space:nowrap;overflow:hidden}
 #list button.srow b{min-width:30px;text-align:right}#list button.srow span{overflow:hidden;text-overflow:ellipsis}
 #view:not(.xl){left:var(--sw);width:calc(var(--vw) - var(--sw))}
}

/* ===== wizualizacja stonowana: wyciszona paleta, delikatne tła, małe zaokrąglenia, bez zabawkowych kolorów ===== */
button{border-radius:8px}.card{border-radius:10px}.chip{border-radius:8px}
.tabs button,#list button,#bar button,#menu button{border-radius:8px}
.row input,.row textarea{border-radius:8px}
#list button{position:relative}

#list button.cur{outline:2px solid var(--acc);outline-offset:-1px}
.row.ok input{background:var(--lubb);border-color:var(--line);border-left:4px solid var(--ok)}

#bar #bOk,#wbar .btn-ok,#tsheet .act3 .btn-ok,#hDone,#tDone.btn-ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
#bar #bOk.rdy{background:var(--lub)!important}
body:not(.dk) .tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
#vbar button.on{background:#c9a15a}
#roi{border-color:rgba(190,150,80,.7)}
.warn{background:var(--badb);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px}
details.tsug{background:var(--bzb)!important;border:1px solid var(--line)!important;border-left:4px solid var(--bz)!important;border-radius:8px!important}
.card[style*="--lubb"]{background:var(--lubb)!important;border:1px solid var(--line)!important;border-left:4px solid var(--lub)!important}
@media(prefers-color-scheme:dark){button.on,button.pri,.tabs button.on,.sm.on,#bText.on,.tm .on{color:#10151b!important}#bar #bOk,#wbar .btn-ok,#tsheet .act3 .btn-ok,#hDone,#tDone.btn-ok,#bar #bOk.rdy{color:#10151b!important}}

her_first_name": "Stanisław", "father_last_name": "Solarz", "mother_first_name": "Anastazja", "mother_last_name": "Goch", "act_date": "1943-03-06", "informant1": "Marcin Pudło, rolnik", "informant2": "Jan Chudy, rolnik", "officiant": "ks. K. Wojtan", "notes": "Akt spisany 1943-03-06, godzina nieczytelna. Indeks Lubgens zgodny."}, "alts": {"death_date": [["akt", "wczoraj", "1943-03-05"], ["akt", "dzisiaj", "1943-03-06"], ["akt", "przedwczoraj", "1943-03-04"]]}, "unc": [], "file": "5cc8b77f-image.jpg", "roi": {"x": 0.5, "y": 0.52, "w": 0.45, "h": 0.35}, "lub": {"father_first_name": "Stanisław", "mother_first_name": "Anastazja", "mother_last_name": "Goch", "deceased_residence": "Moczydła", "age": "42", "death_date": "1943-03-04", "deceased_spouse": "Zofia Chuda", "deceased_last_name": "Solarz", "deceased_first_name": "Antoni"}, "lubRaw": "O: Stanisław, M: Anastazja zd. Goch, Moczydła, l. 42, zm. 4.03.1943r., ż. Zofia Chuda", "lubName": "Solarz Antoni", "pola": {"deceased_last_name": [[0.6639, 0.666, 0.1316, 0.0245]], "deceased_first_name": [[0.6639, 0.666, 0.1316, 0.0245]]}, "tekst": "Działo się we wsi Blinów dnia szóstego marca tysiąc dziewięćset czterdziestego trzeciego roku o godzinie [...] [?]. Stawili się: Marcin Pudło i Jan Chudy, obaj rolnicy pełnoletni w Moczydłach zamieszkali i oświadczyli, że dnia czwartego marca roku bieżącego o godzinie osiemnastej umarł w Moczydłach tamże urodzony i zamieszkały Antoni Solarz, rolnik, żonaty, lat czterdzieści dwa mający, syn Stanisława i Anastazji z Gochów małżonków Solarzów, pozostawiwszy po sobie owdowiałą żonę Zofię z Chudych. Po przekonaniu się naocznie o śmierci Antoniego Solarza; akt ten stawającym niepiśmiennym przeczytany, przez czas podpisany został. — Ks. K. Wojtan U.H.C.", "tnotes": ["Uwagi: godzina spisania aktu nieczytelna (obcięty brzeg). Zgon 4.03.1943 godz. 18:00. Indeks Lubgens: Solarz Antoni, 27/1943, O: Stanisław, M: Anastazja zd. Goch, Moczydła, l. 42, zm. 4.03.1943r., ż. Zofia Chuda – zgodny. Świadek Marcin Pudło (nazwisko w bazie Pudło ×208)."]}, {"id": "ai1-1943-028", "year": 1943, "act": 28, "ai": {"deceased_last_name": "Sokół", "deceased_first_name": "Czesława?", "deceased_maiden_name": "", "deceased_sex": "K", "death_date": "1943-03-10", "death_time": "02:00", "age": "2", "deceased_status": "", "deceased_spouse": "", "death_place": "Moczydła", "deceased_birth_place": "Moczydła", "deceased_residence": "Moczydła", "profession": "", "father_first_name": "Paweł", "father_last_name": "Sokół", "mother_first_name": "Agnieszka", "mother_last_name": "Wiśniewska?", "act_date": "1943-03-11", "informant1": "Szymon Paszkowski", "informant2": "Antoni Dudek?", "officiant": "ks. K. Wojtan", "notes": "Akt spisany 11.03.1943. Matka: z Wiśniewskich."}, "alts": {"death_date": [["akt", "wczoraj", "1943-03-10"], ["akt", "dzisiaj", "1943-03-11"], ["akt", "przedwczoraj", "1943-03-09"]]}, "unc": ["deceased_first_name", "death_date", "death_time", "mother_last_name", "informant2"], "file": "3bbd47ee-image.jpg", "roi": {"x": 0.04, "y": 0.06, "w": 0.44, "h": 0.42}, "lub": {"father_first_name": "Paweł", "mother_first_name": "Agnieszka", "mother_last_name": "Winiarczyk", "deceased_residence": "Moczydła", "age": "2", "deceased_last_name": "Sokół", "deceased_first_name": "Czesława"}, "lubRaw": "O: Paweł, M: Agnieszka zd. Winiarczyk, Moczydła, l. 2,", "lubName": "Sokół Czesława", "pola": {"deceased_last_name": [[0.0737, 0.2211, 0.1472, 0.024]], "deceased_first_name": [[0.0737, 0.2211, 0.1472, 0.024]]}, "tekst": "Działo się we wsi Blinów dnia jedenastego marca tysiąc dziewięćset czterdziestego trzeciego roku o godzinie dziewiątej. Stawili się: Szymon Paszkowski i [?] Dudek, obaj rolnicy pełnoletni w Moczydłach zamieszkali i oświadczyli, że dnia wczorajszego o godzinie drugiej umarła w Moczydłach tamże urodzona Cres[ława?] Sokół, dwa lata mająca, zamieszkała w Moczydłach, córka Pawła i Agnieszki z Wiśniewskich małżonków Sokołów. Po przekonaniu się naocznie o śmierci Cresławy Sokół; Akt ten sta iało się we wsi Blinów dnia czternastego marca tysiąc dziewięćset czterdziestego trzeciego roku o godzinie dziewiątej. Stawili się: Hawrynicz [?] Mielba i Adam Stroski, obaj rolnicy pełnoletni w Moczydłach zamieszkali i oświadczyli, że dnia jedenastego marca roku bieżącego o godzinie [nieczytelne] umarł w szpitalu w Janowie-Lubelskim Andrzej Janik, rolnik, żonaty, lat trzydzieści pięć mający, urodzony i zamieszkały w Moczydłach, syn Antoniego i Anny z Kacyńskich małżonków Janików, pozostawiwszy po sobie owdowiałą żonę Mariannę z Chudych. Po przekonaniu się naocznie o śmierci Andrzeja Janika; Akt ten stawającym niepiśmiennym przeczytany, przez czas podpisany został. — Ks. K. Wojtan U.H.C.", "tnotes": ["Niepewne: godzina, imiona świadków, rodowe nazwisko żony", "Porównanie z Lubgens: Indeks: Janik Andrzej 29/1943, O: Antoni, M: Anna zd. Kaczyńska, szpital Janów Lub., l. 35, zm. 11.03.1943, ż. Marianna Chuda — zgodne (data, wiek, żona)."]}, {"id": "ai1-1943-030", "year": 1943, "act": 30, "ai": {"deceased_last_name": "Chmiel", "deceased_first_name": "Agnieszka", "deceased_maiden_name": "", "deceased_sex": "K", "death_date": "1943-03-27", "death_time": "18:00", "age": "47", "deceased_status": "panna", "deceased_spouse": "", "death_place": "Szpital Janów Lubelski", "deceased_birth_place": "Moczydła", "deceased_residence": "Moczydła", "profession": "rolniczka", "father_first_name": "Tomasz", "father_last_name": "Chmiel", "mother_first_name": "Stanisława", "mother_last_name": "Żaba?", "act_date": "1943-03-03", "informant1": "Józef Stroski", "informant2": "Jan Chmiel", "officiant": "ks. K. Wojtan", "notes": "KONFLIKT: akt spisany 3.03.1943, zgon 'dwudziestego siódmego marca' – sprawdzić odczyt."}, "alts": {"death_date": [["akt", "wczoraj", "1943-03-02"], ["akt", "dzisiaj", "1943-03-03"], ["akt", "przedwczoraj", "1943-03-01"]]}, "unc": ["death_date", "mother_last_name", "informant1"], "file": "3bbd47ee-image.jpg", "roi": {"x": 0.47, "y": 0.06, "w": 0.47, "h": 0.42}, "lub": {" eks Lubgens: 64 akty zgonów 1943 (nr 1–64) – liczba zgodna.", "tekst": "Działo się we wsi Blinów dnia trzydziestego pierwszego grudnia tysiąc dziewięćset czterdziestego trzeciego roku o godzinie dwudziestej drugiej. My, proboszcz Rzymsko-Katolickiej parafii Blinów, Utrzymujący Akta Stanu Cywilnego, niżej podpisany, stosownie do artykułu 74 Kodeksu Cywilnego Polskiego, księgę niniejszą Aktów Stanu Cywilnego zmarłych parafii Blinów co do zmarłych zamknęliśmy z dniem dzisiejszym o godzinie dwudziestej drugiej, a znaleźliśmy w niej zapisanych z roku bieżącym aktów zmarłych sześćdziesiąt cztery (64), które w niniejszym zamykamy i księgę kończymy tym protokołem, po którym już żaden akt wpisany w nią być nie może. — Ks. K. Wojtan U.H.C.", "tnotes": ["Niepewne: godzina (22:00), kilka słów", "Porównanie z Lubgens: w indeksie 64 akty zgonów 1943 (nr 1–64) — liczba zgodna."]}, {"id": "prot-1944", "kind": "prot", "year": 1944, "act": 101, "file": "a213c362-image.jpg", "roi": {"x": 0.05, "y": 0.32, "w": 0.43, "h": 0.63}, "unc": ["p_date", "p_signer"], "title": "Protokół rewizji ksiąg za 1943, 5.01.1944 (str. 12)", "ai": {"p_date": "1944-01-05", "p_born": "92", "p_married": "32", "p_count": "64", "p_signer": "Dziekan Dekanatu Janowskiego, M. J. Dąbro… (podpis niepewny)", "p_note": "akta prowadził ks. Kazimierz Wojtan, Urzędnik Stanu Cywilnego; w obu egzemplarzach jednakowa liczba; duplikat do archiwum hipotecznego w Janowie; pieczęć Dziekan Dekanatu Janów Lubelski"}, "lub": {"p_count": "64"}, "alts": {}, "lubRaw": "", "lubName": "", "cmp": "Zgony: 64 = liczba aktów 1943 w indeksie Lubgens. Urodzenia 92 i małżeństwa 32 – do porównania z indeksami urodzeń i małżeństw.", "tekst": "Protokół z odbytej rewizji Akt Stanu Cywilnego parafii Rzymsko-Katolickiej Blinów 1943 roku. „Działo się we wsi Blinów dnia 5 stycznia 1944 roku. Dziekan Dekanatu Janowskiego zamieszkały w Janowie, przybywszy w dniu dzisiejszym do kancelarii parafialnej Blinowskiej, przystąpił do rewizji Akt Stanu Cywilnego tejże parafii z roku 1943, na zasadzie przysługującego mu prawa z artykułu 74 Kodeksu Cywilnego i reskryptu Komisji Sprawiedliwości z dnia 18/30 czerwca 1839 roku — i znalazł w tym ubiegłym roku aktów: 1) Urodzonych 92, 2) Zaślubionych 32, 3) Zmarłych 64. Akta te były prowadzone przez księdza Kazimierza Wojtana, Urzędnika Stanu Cywilnego parafii Blinów, w obu egzemplarzach jest ich jednakowa liczba, protokoły zakończenia i skorowidze są poczynione, omyłki zanotowane. Dopatrzywszy rewizji, Dziekan nie zauważył żadnych uchybień prawnych, czego dla tym niniejszy protokół Dziekan zakończył i przyjął duplikat z dokumentami dla złożenia go w archiwum hipotecznym w Janowie na przechowanie.” — Dziekan Dekanatu Janowskiego, podpis M. J. Dąbro… (nieczytelny); pieczęć „Dziekan Dekanatu Janów Lubelski”.", "tnotes": ["Niepewne: dzień miesiąca (5), podpis dziekana, kilka słów", "Porównanie z Lubgens: zgony 64 = 64 akty 1943 w indeksie; urodzenia 92 i małżeństwa 32 — do porównania z indeksami urodzeń i małżeństw.", "Uwaga: ksiądz prowadzący akta to Kazimierz Wojtan (potwierdza protokół); wcześniejsza forma „Wojtasz” była błędem odczytu."]}], "counts": {"s": {"Rembacz": 4, "Kozaczek": 95, "Pęk": 25, "Rataj": 15, "Zurak": 2, "Kopiwoda": 177, "Barbarzak": 109, "Kudrelek": 222, "Pcionek": 309, "Morawska": 3, "Morawski": 1, "Faber": 2, "Kłos": 2, "Grabowska": 2, "Grabowski": 1, "Sobotka": 22, "Czuba": 90, "Wiśniowski": 2, "Szopa": 2, "Szopówna": 1, "Pastyga": 8, "Samuel": 100, "Kurczak": 429, "Mścisło": 8, "Bucon": 9, "Woś": 135, "Gnat": 163, "Machulek": 96, "Terlecki": 2, "Krupa": 29, "Łata": 33, "Lebieda": 2, "Skrzypek": 27, "Siemian": 5, "Pazdrak": 147, "Tabaka": 6, "Jarzenska": 1, "Jarzenski": 1, "Solarz": 93, "Mscisło": 4, "Jędrzyczak": 7, "Igras": 46, "Bolibrzuch": 4, "Zdybel": 6, "Kossidło": 9, "Baron": 7, "Baran": 234, "Pyć": 12, "Stępień": 105, "Paluchowska": 1, "Paluchowski": 3, "Wscisło": 65, "Wcisło": 319, "Sokół": 114, "Stępnik": 5, "Goch": 111, "Brzyska": 29, "Kaczyński function raportSpojnosci(rows, opt){ opt = opt || {}; const out = []; const add = (r, sev, code, msg, rel) => out.push({id:r.id, sev, code, msg, rel:rel || []});
  rows.forEach(r => { const last = (r.last || '').trim(), first = (r.first || '').trim(), age = wiekLat(r.ageText), st = fold(r.status || ''), dd = dzien(r.death), ad = dzien(r.act);
    if (r.death && dd === null) add(r, 'warn', 'data-zla', 'Data zgonu „' + r.death + '” nie jest w formacie RRRR-MM-DD.');
    if (dd !== null && ad !== null) { if (dd > ad) add(r, 'err', 'zgon-po-akcie', 'Data zgonu (' + r.death + ') jest późniejsza niż data aktu (' + r.act + ').'); else if (ad - dd > 10) add(r, 'warn', 'zgon-dawno', 'Akt spisany ' + (ad - dd) + ' dni po zgonie (' + r.death + ' → ' + r.act + ') – sprawdź daty.'); }
    if (dd !== null && r.year) { const y = new Date(dd * 864e5).getUTCFullYear(); if (y < +r.year - 1 || y > +r.year) add(r, 'warn', 'rok-zgonu', 'Rok zgonu (' + y + ') nie pasuje do roku księgi (' + r.year + ').'); }
    if (age !== null && age > 110) add(r, 'warn', 'wiek-duzy', 'Wiek „' + r.ageText + '” wygląda na zbyt duży.');
    if (age !== null && age < 15 && /zonat|zamezn|wdow/.test(st)) add(r, 'err', 'wiek-stan', 'Wiek „' + r.ageText + '” i stan „' + r.status + '” się wykluczają.');
    if (age !== null && age < 18 && /wdow/.test(st)) add(r, 'warn', 'wiek-wdowiec', 'Wdowa/wdowiec w wieku „' + r.ageText + '”.');
    if (age !== null && age < 15) { if (fold(r.job || '').trim()) add(r, 'warn', 'dziecko-zawod', 'Dziecko (wiek „' + r.ageText + '”) ma wpisany zawód: ' + r.job + '.'); if (r.spouse) add(r, 'warn', 'dziecko-malzonek', 'Dziecko ma wpisanego małżonka.'); if (!r.father && !r.mother) add(r, 'info', 'dziecko-rodzice', 'Dziecko bez wpisanych rodziców.'); }
    if (/panna|kawaler/.test(st) && r.spouse) add(r, 'warn', 'stan-malzonek', 'Stan „' + r.status + '” ale wpisany małżonek: ' + r.spouse + '.');
    if (r.sex === 'M' && r.maiden) add(r, 'warn', 'mezczyzna-rodowe', 'Mężczyzna z nazwiskiem rodowym („' + r.maiden + '”) – nazwisko powinno być rodowe, chyba że wyjątek.');
    if (first && r.sex) { const f = fold(first.split(/\s+/)[0]); if (r.sex === 'M' && /a$/.test(f) && !RAP_M_A.test(first.split(/\s+/)[0])) add(r, 'warn', 'plec-imie', 'Płeć M, ale imię „' + first + '” brzmi żeńsko.'); if (r.sex === 'K' && !/a$/.test(f)) add(r, 'warn', 'plec-imie', 'Płeć K, ale imię „' + first + '” brzmi męsko.'); }
    if (last && r.sex) { const l = fold(last); if (r.sex === 'K' && /(sk|ck|dzk)i$/.test(l)) add(r, 'warn', 'plec-nazwisko', 'Płeć K, ale nazwisko „' + last + '” ma formę męską.'); if (r.sex === 'M' && /(sk|ck|dzk)a$/.test(l)) add(r, 'warn', 'plec-nazwisko', 'Płeć M, ale nazwisko „' + last + '” ma formę żeńską.'); }
    if (opt.brak !== false) ['last','first','sex','death'].forEach(k => { if (!r[k]) add(r, 'warn', 'brak-' + k, 'Brak: ' + ({last:'nazwisko', first:'imię', sex:'płeć', death:'data zgonu'})[k] + '.'); });
  });
  // chronologia dat aktów w obrębie roku (numer rośnie → data nie maleje)
  const by = {}; rows.forEach(r => { if (r.year && r.num && dzien(r.act) !== null) (by[r.year] = by[r.year] || []).push(r); });
  Object.values(by).forEach(L => { L.sort((a, b) => a.num - b.num); let mx = null; L.forEach(r => { const d = dzien(r.act); if (mx && d < mx.d) add(r, 'warn', 'chronologia', 'Data aktu ' + r.act + ' jest wcześniejsza niż w akcie ' + mx.r.num + ' (' + mx.r.act + ') – sprawdź daty lub numer.', [mx.r.id]); if (!mx || d >= mx.d) mx = {d, r}; }); });
  // duplikaty: ta sama osoba i ta sama data zgonu w dwóch aktach
  const key = {}; rows.forEach(r => { if (r.last && r.first && r.death) (key[fold(r.last) + '|' + fold(r.first) + '|' + r.death] = key[fold(r.last) + '|' + fold(r.first) + '|' + r.death] || []).push(r); });
  Object.values(key).forEach(L => { if (L.length > 1) L.forEach(r => add(r, 'err', 'duplikat', 'Ta sama osoba i data zgonu w aktach: ' + L.filter(x => x !== r).map(x => x.num + '/' + x.year).join(', ') + '.', L.filter(x => x !== r).map(x => x.id))); });
  if (opt.dupRok) { const g = {}; rows.forEach(r => { if (r.last && r.first && r.ageText && !r.death) { const k = [fold(r.last), fold(r.first), r.year, fold(r.ageText), fold(r.resid || '')].join('|'); (g[k] = g[k] || []).push(r); } });
    Object.values(g).forEach(L => { if (L.length > 1) L.forEach(r => add(r, 'warn', 'duplikat-rok', 'Możliwy duplikat (to samo nazwisko, imię, wiek, rok i miejsce): ' + L.filter(x => x !== r).map(x => x.id).join(', ') + '.', L.filter(x => x !== r).map(x => x.id))); }); }
  return out; }
function raportCsv(items, label){ return ['id;waga;kod;opis;powiazane'].concat(items.map(i => [i.id, i.sev, i.code, i.msg, (i.rel || []).join(' ')].map(csvCell).join(';'))).join('\r\n') + '\r\n'; }

/* wspolne/historia.js – wspólna historia zmian z możliwością cofnięcia (czyste funkcje, bez DOM).
   Stan: acts = { idAktu: { f:{pole:{...}}, text, done, qs:{klucz:'skip'} } }. Migawka → różnice → wpisy {id,k,f,before,after}. */
function histSnap(acts){ const o = {}; for (const id in acts) { const a = acts[id] || {}; for (const f in (a.f || {})) o[id + '|f|' + f] = JSON.stringify(a.f[f]); if (a.text != null) o[id + '|text'] = String(a.text); if (a.done) o[id + '|done'] = '1'; for (const k in (a.qs || {})) o[id + '|q|' + k] = String(a.qs[k]); } return o; }
function histDiff(prev, cur){ const out = [], keys = new Set([...Object.keys(prev), ...Object.keys(cur)]); keys.forEach(k => { if (prev[k] !== cur[k]) { const p = k.split('|'); out.push({id:p[0], k:p[1], f:p.slice(2).join('|'), before:prev[k] ?? null, after:cur[k] ?? null}); } }); return out; }
// cofnięcie wpisu: przywraca stan „przed” w acts
function histApply(acts, e){ const a = acts[e.id] = acts[e.id] || {f:{}, done:false}; a.f = a.f || {};
  if (e.k === 'f') { if (e.before == null) delete a.f[e.f]; else a.f[e.f] = JSON.parse(e.before); }
  else if (e.k === 'text') { if (e.before == null) delete a.text; else a.text = e.before; }
  else if (e.k === 'done') a.done = e.before != null;
  else if (e.k === 'q') { a.qs = a.qs || {}; if (e.before == null) delete a.qs[e.f]; else a.qs[e.f] = e.before; } }
function histCsv(list){ return ['nr;czas;akt;rodzaj;pole;przed;po;powod'].concat(list.map(e => [e.n, e.t, e.id, e.k, e.f, e.before ?? '', e.after ?? '', e.why || ''].map(csvCell).join(';'))).join('\r\n') + '\r\n'; }

/* wspolne/model.js – wspólny model genealogiczny (wersja 1): osoba, zdarzenie, źródło, relacja.

  const par = (rola, fn, ln) => { if (!get(fn) && !get(ln)) return null; const o = os(rola, {imie:A(fn), nazwisko:A(ln)}); relacje.push({typ:'rodzic-dziecko', a:o.id, b:zm.id, status: ok(fn) && ok(ln) ? 'dokument' : 'hipoteza', zrodlo:'zr:' + id}); return o; };

const clean = s => (s||'').toString().replace(/\?/g,'').trim();

$('dlN').innerHTML = Object.keys(D.counts.n).filter(k => D.counts.n[k] >= 2).sort().map(k => `<option value="${k}">`).join('');
const fuzzCache = {};
function near(f, v){ const t = FT[f]; const w = fold(clean(v)); if (!t || w.length < 3) return []; const k = t+w; if (fuzzCache[k]) return fuzzCache[k];
  const out = []; for (const [n,c] of Object.entries(D.counts[t])) { if (c < 3) continue; const d = lev(w, fold(n), 2); if (d <= 2 && n !== clean(v)) out.push([n,c,d]); }

function diffState(a,f){ let x = a.ai?.[f], y = a.lub?.[f]; if (f === 'deceased_spouse') { x = x && x.replace(/\s*\((?:owd\.?|†)\)/g,''); y = y && y.replace(/\s*\((?:owd\.?|†)\)/g,''); } if (!x || !y) return ''; if (exact(x,y)) return 'eq'; if (loose(x,y)) return 'ap'; return 'ne'; }
function hasDiff(a){ return fieldsOf(a).some(f => diffState(a,f.id) === 'ne' && !S.acts[a.id]?.f?.[f.id]?.ok && !S.acts[a.id]?.done); }   // czerwona ramka tylko dla nierozstrzygniętych różnic AI↔Lubgens (zatwierdzone pole = rozstrzygnięte)

// ---- kalendarz wieczny przy polach dat: dzień / miesiąc / rok z przesuwaniem (lata przestępne, granice miesięcy i lat)

// juliański (st. styl, akta zaboru rosyjskiego) ↔ gregoriański (n. styl)
const jdnG = (y,m,d) => { const a = Math.floor((14-m)/12), y2 = y+4800-a, m2 = m+12*a-3; return d + Math.floor((153*m2+2)/5) + 365*y2 + Math.floor(y2/4) - Math.floor(y2/100) + Math.floor(y2/400) - 32045; };

const pad2 = n => String(n).padStart(2,'0'), isoYMD = o => `${String(o.y).padStart(4,'0')}-${pad2(o.m)}-${pad2(o.d)}`;
const DATE_F = new Set(['death_date','act_date','p_date']);
const MIES = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'], MIESD = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'], DNI = ['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];
const dwParse = v => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((v||'').trim()); return m ? {y:+m[1], m:+m[2], d:+m[3]} : null; };
